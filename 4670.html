<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="naver-site-verification" content="57ec73e2bb9a431d8e67f45db33040f4f2be5992" />
<meta name="theme-color" content="#e8ecf1">
<title>K-교육특별시 비서실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8ecf1; --ink:#1c2230; --ink-2:#3a4252; --mute:#7d8695; --faint:#a9b0bc;
    --line:rgba(28,34,48,.07);
    --panel:rgba(247,249,251,.74); --card:rgba(255,255,255,.8); --dark:#1b2230;
    --shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 12px 32px -14px rgba(32,44,68,.22), 0 2px 6px -2px rgba(32,44,68,.06);
    --shadow-sm:0 1px 0 rgba(255,255,255,.95) inset, 0 4px 12px -6px rgba(32,44,68,.18);
    --num:'Inter','Noto Sans KR',sans-serif;
    --rail:68px; --side:260px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  body{
    font-family:'Noto Sans KR', system-ui, sans-serif; color:var(--ink); font-size:14px; line-height:1.5;
    background:radial-gradient(1200px 600px at 85% -10%, #f6f8fb 0%, transparent 60%), radial-gradient(900px 500px at -10% 110%, #dfe5ec 0%, transparent 60%), var(--bg);
    min-height:100dvh; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  }
  a{ color:inherit; text-decoration:none; }
  button, input{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid #5b6b86; outline-offset:2px; }

  .app{ min-height:100dvh; }
  .panel{ background:var(--panel); border:1px solid rgba(255,255,255,.95); border-radius:24px; box-shadow:var(--shadow); padding:18px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  .p-title{ font-size:15.5px; font-weight:700; letter-spacing:-.01em; margin:2px 4px 12px; display:flex; align-items:center; gap:8px; }
  .eyebrow{ display:inline-flex; align-items:center; gap:7px; font:600 11px var(--num); letter-spacing:.14em; text-transform:uppercase; color:var(--mute); margin:2px 4px 0; }
  .live{ width:7px; height:7px; border-radius:50%; background:#2f9d7c; box-shadow:0 0 0 0 rgba(47,157,124,.5); animation:ping 1.8s infinite; }
  @keyframes ping{ 0%{ box-shadow:0 0 0 0 rgba(47,157,124,.5); } 80%,100%{ box-shadow:0 0 0 8px rgba(47,157,124,0); } }

  /* ---------- 상단 드롭다운 메뉴 ---------- */
  .bar{ display:flex; align-items:center; gap:14px; min-height:46px; margin-bottom:10px; }
  .brand{ display:inline-flex; align-items:center; gap:9px; flex-shrink:0; }
  .logo{ width:36px; height:36px; border-radius:11px; display:grid; place-items:center; background:var(--dark); color:#fff; font:700 15px var(--num); box-shadow:0 8px 18px -8px rgba(27,34,48,.7); }
  .nav{ display:flex; align-items:center; gap:2px; flex:1 1 auto; min-width:0; }
  .dd{ position:relative; }
  .dd-btn{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 12px; border:0; border-radius:11px; background:transparent; font-size:13.5px; font-weight:500; color:var(--ink-2); white-space:nowrap; transition:background .15s, color .15s; }
  .dd-btn svg{ width:16px; height:16px; color:var(--mute); }
  .dd-btn .chev{ width:10px; height:10px; transition:transform .2s; }
  .dd:hover .dd-btn, .dd.open .dd-btn{ background:rgba(255,255,255,.75); color:var(--ink); }
  .dd-btn.on{ background:#fff; box-shadow:var(--shadow-sm); color:var(--ink); font-weight:700; }
  .dd-btn.on svg{ color:var(--ink); }
  .dd.open .chev{ transform:rotate(180deg); }
  .dd-panel{ position:absolute; top:calc(100% + 10px); left:0; z-index:30; width:440px; padding:12px;
    background:rgba(255,255,255,.97); border:1px solid rgba(255,255,255,1); border-radius:18px;
    box-shadow:0 24px 50px -18px rgba(32,44,68,.4), 0 2px 8px -2px rgba(32,44,68,.08);
    opacity:0; visibility:hidden; transform:translateY(6px); transition:opacity .18s, transform .18s, visibility .18s; }
  .dd-panel::before{ content:""; position:absolute; left:0; right:0; top:-12px; height:12px; }
  .dd.open .dd-panel{ opacity:1; visibility:visible; transform:none; }
  @media (hover:hover) and (min-width:761px){ .dd:hover .dd-panel{ opacity:1; visibility:visible; transform:none; } .dd:hover .chev{ transform:rotate(180deg); } }
  .dd:nth-last-child(-n+2) .dd-panel{ left:auto; right:0; }
  .dd-head{ display:flex; align-items:center; gap:8px; padding:4px 8px 10px; margin-bottom:6px; border-bottom:1px solid var(--line); font-size:13.5px; font-weight:700; }
  .dd-head .n{ font:600 11px var(--num); color:var(--mute); background:rgba(28,34,48,.06); padding:1px 7px; border-radius:6px; }
  .dd-head .cap{ margin-left:auto; font-size:11.5px; font-weight:400; color:var(--faint); }
  .dd-grid{ display:grid; grid-template-columns:1fr 1fr; gap:2px; }
  .dd-grid a{ display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:10px; font-size:13.5px; line-height:1.3; word-break:keep-all; transition:background .12s; }
  .dd-grid a i{ font-style:normal; font:600 10.5px var(--num); color:var(--mute); width:22px; height:20px; display:grid; place-items:center; border-radius:6px; background:rgba(232,236,241,.9); flex-shrink:0; }
  .dd-grid a:hover, .dd-grid a:focus-visible{ background:rgba(232,236,241,.8); outline:none; }
  .dd-more{ display:block; width:100%; margin-top:8px; padding:9px; border:1px dashed rgba(28,34,48,.15); border-radius:10px; background:transparent; font-size:12.5px; color:var(--mute); }
  .dd-more:hover{ background:var(--dark); border-color:var(--dark); color:#fff; }
  .bar .cmd-btn{ margin-left:auto; }
  .nav-tog{ display:none; }
  .site-foot{ padding:6px 4px 0; text-align:center; font-size:12.5px; color:var(--mute); }
  .site-foot a{ color:var(--ink); font:600 12.5px var(--num); }
  .site-foot a:hover{ text-decoration:underline; text-underline-offset:3px; }


  /* ---------- 본문 ---------- */
  .main{ max-width:1320px; margin:0 auto; padding:0 22px 32px; min-width:0; display:flex; flex-direction:column; gap:16px; }

  /* 상단 고정 영역: 제목줄 + 바로가기 8개 */
  .head{ position:sticky; top:0; z-index:8; padding:12px 0 12px; margin:0 -4px; padding-left:4px; padding-right:4px;
    background:linear-gradient(180deg, rgba(232,236,241,.96) 70%, rgba(232,236,241,0)); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .topline{ display:flex; align-items:center; gap:12px; min-height:32px; margin-bottom:10px; font-size:13px; color:var(--mute); flex-wrap:wrap; }
  .crumb{ font-size:15px; color:var(--ink); font-weight:700; letter-spacing:-.01em; display:inline-flex; align-items:center; gap:6px; }
  .crumb .pre{ color:var(--mute); font-weight:500; }
  .crumb .num{ font:600 12px var(--num); background:#fff; border-radius:7px; padding:2px 8px; box-shadow:var(--shadow-sm); }
  .topline .sp{ flex:1; }
  .topline .meta{ font-size:12.5px; color:var(--mute); }
  .topline .meta a{ color:var(--ink); font:600 12.5px var(--num); }
  .topline .meta a:hover{ text-decoration:underline; text-underline-offset:3px; }
  .quick{ display:flex; flex-wrap:wrap; gap:8px; }
  a.qk{ flex:1 1 auto; display:flex; align-items:center; gap:8px; height:46px; padding:0 14px 0 8px; background:var(--card); border:1px solid rgba(255,255,255,.95); border-radius:13px; box-shadow:var(--shadow-sm); transition:transform .15s, background .15s, box-shadow .15s; }
  a.qk .g{ flex-shrink:0; width:30px; height:30px; display:grid; place-items:center; border-radius:9px; background:rgba(232,236,241,.95); border:1px solid rgba(28,34,48,.06); font:700 13.5px 'Noto Sans KR'; color:var(--ink-2); }
  a.qk .t{ font-size:13.5px; font-weight:500; white-space:nowrap; }
  a.qk:hover{ background:#fff; transform:translateY(-1px); box-shadow:0 1px 0 #fff inset, 0 10px 22px -12px rgba(32,44,68,.35); }
  a.qk:hover .g{ background:var(--dark); color:#fff; }

  /* 통합 검색 */
  .finder{ display:flex; align-items:center; gap:10px; height:52px; padding:0 16px; background:var(--card); border:1px solid rgba(255,255,255,.95); border-radius:16px; box-shadow:var(--shadow-sm); }
  .finder svg{ width:18px; height:18px; color:var(--mute); flex-shrink:0; }
  .finder input{ flex:1; min-width:0; border:0; background:none; outline:none; font-size:15px; }
  .finder input::placeholder{ color:var(--faint); }
  .finder .st{ font-size:12px; color:var(--faint); white-space:nowrap; }
  kbd{ font:500 11px var(--num); color:var(--mute); padding:2px 6px; border-radius:6px; background:rgba(28,34,48,.06); }
  .cmd-btn{ display:inline-flex; align-items:center; gap:9px; height:40px; padding:0 8px 0 13px; flex-shrink:0;
    border:1px solid rgba(255,255,255,.95); border-radius:12px; background:var(--card); box-shadow:var(--shadow-sm); font-size:13px; color:var(--ink-2); }
  .cmd-btn svg{ width:16px; height:16px; color:var(--mute); }
  .cmd-btn:hover{ background:#fff; color:var(--ink); }
  .cmd{ position:fixed; inset:0; z-index:100; display:flex; justify-content:center; align-items:flex-start; padding:10vh 16px 16px;
    background:rgba(28,34,48,.28); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .cmd[hidden]{ display:none; }
  .cmd-box{ width:min(760px, 100%); max-height:78vh; display:flex; flex-direction:column; overflow:hidden;
    background:rgba(247,249,251,.98); border:1px solid #fff; border-radius:22px;
    box-shadow:0 40px 90px -30px rgba(32,44,68,.55), 0 2px 8px -2px rgba(32,44,68,.1); animation:pop .16s ease-out; }
  @keyframes pop{ from{ opacity:0; transform:translateY(8px) scale(.985); } }
  .cmd-in{ display:flex; align-items:center; gap:10px; padding:0 14px 0 18px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.7); }
  .cmd-in > svg{ width:19px; height:19px; color:var(--mute); flex-shrink:0; }
  .cmd-in input{ flex:1; min-width:0; height:60px; border:0; background:none; outline:none; font-size:16.5px; }
  .cmd-in input::placeholder{ color:var(--faint); }
  .cmd-in .st{ font-size:12px; color:var(--faint); white-space:nowrap; }
  .cmd-x{ width:32px; height:32px; border:0; border-radius:9px; background:transparent; display:grid; place-items:center; color:var(--mute); }
  .cmd-x svg{ width:18px; height:18px; }
  .cmd-x:hover{ background:rgba(28,34,48,.06); color:var(--ink); }
  .cmd-list{ flex:1; overflow:auto; padding:14px 16px 16px; overscroll-behavior:contain; }
  .cmd-list .rows{ grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); }
  .cmd-list a.sel{ background:#fff; outline:2px solid var(--dark); outline-offset:-2px; }
  .cmd-foot{ display:flex; align-items:center; gap:14px; padding:10px 16px; border-top:1px solid var(--line); font-size:11.5px; color:var(--faint); }
  .cmd-foot .sp{ flex:1; }
  .cmd-foot button{ border:0; background:transparent; font-size:12px; color:var(--mute); padding:4px 8px; border-radius:7px; }
  .cmd-foot button:hover{ background:rgba(28,34,48,.06); color:var(--ink); }
  .note{ margin:4px 4px 0; padding:12px 14px; border-radius:12px; background:rgba(253,233,168,.45); font-size:12.5px; color:var(--ink-2); line-height:1.6; }
  .r-sec + .r-sec{ margin-top:16px; }
  .r-head{ display:flex; align-items:center; gap:8px; margin:0 4px 8px; font-size:13px; color:var(--ink-2); }
  .r-head .n{ font:600 11px var(--num); color:var(--mute); background:rgba(28,34,48,.06); padding:1px 7px; border-radius:6px; }
  .r-head .sp{ flex:1; }
  .r-head button{ border:0; background:transparent; font-size:12px; color:var(--mute); padding:3px 8px; border-radius:7px; }
  .r-head button:hover{ background:rgba(28,34,48,.06); color:var(--ink); }
  .doc{ display:block; padding:12px 14px; background:var(--card); border:1px solid rgba(255,255,255,.95); border-radius:14px; box-shadow:var(--shadow-sm); transition:background .15s, box-shadow .15s; }
  .doc + .doc{ margin-top:8px; }
  .doc:hover{ background:#fff; box-shadow:0 1px 0 #fff inset, 0 10px 22px -12px rgba(32,44,68,.35); }
  .doc .d-top{ display:flex; align-items:center; gap:8px; }
  .doc .d-title{ font-size:14.5px; font-weight:700; }
  .doc .d-file{ font:500 11.5px var(--num); color:var(--faint); }
  .doc .d-cnt{ margin-left:auto; font-size:11.5px; color:var(--mute); white-space:nowrap; }
  .doc .d-snip{ margin-top:6px; font-size:13px; color:var(--ink-2); line-height:1.6; }
  .doc .d-snip + .d-snip{ margin-top:2px; }
  mark{ background:#fde9a8; color:var(--ink); border-radius:3px; padding:0 2px; }
  .empty{ padding:18px 8px; text-align:center; color:var(--faint); font-size:13px; }

  /* 정보: 웹검색 / 시계 / 날씨, 아래 뉴스 */
  .info{ display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); gap:16px; align-items:stretch; }
  .p-ws, .p-clock, .p-wx{ grid-column:span 4; }
  .p-ws, .p-clock, .p-wx{ padding:14px 18px; }
  .p-news{ grid-column:span 8; padding:4px 18px; display:flex; flex-direction:column; justify-content:center; }
  .p-find{ grid-column:span 4; display:flex; flex-direction:column; justify-content:center; gap:8px; padding:12px 18px; }
  .find-btn{ display:flex; align-items:center; gap:10px; height:42px; padding:0 10px 0 14px; border-radius:14px;
    border:1px solid rgba(255,255,255,.95); background:var(--card); box-shadow:var(--shadow-sm); text-align:left; transition:background .15s; }
  .find-btn svg{ width:18px; height:18px; color:var(--mute); flex-shrink:0; }
  .find-btn .ph{ flex:1; min-width:0; font-size:14px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .find-btn:hover{ background:#fff; }
  .find-btn:hover .ph{ color:var(--mute); }
  .find-st{ margin:0 4px; font-size:12px; color:var(--faint); }
  /* 레트로 아날로그 시계 + 미니 달력 (웹검색 칸 높이 이내: 114px) */
  .p-clock{ display:flex; flex-direction:column; justify-content:center; position:relative; z-index:5; }
  .clock-body{ display:flex; align-items:center; gap:16px; height:114px; }
  .aclock{ flex-shrink:0; width:114px; height:114px; display:block; filter:drop-shadow(0 8px 14px rgba(32,44,68,.22)); }
  .aclock .hand{ transition:transform .25s cubic-bezier(.4,2.2,.6,1); }
  .aclock .hand.no-anim{ transition:none; }
  .cal-side{ flex:1; min-width:0; height:114px; display:flex; flex-direction:column; gap:4px; }
  .cal-side .eyebrow{ margin:0 2px; height:18px; letter-spacing:.06em; text-transform:none; font:600 12px var(--num); color:var(--ink-2); white-space:nowrap; overflow:hidden; }
  button.mini-cal{ flex:1; min-height:0; display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:1fr; align-items:center; text-align:center; padding:4px 6px;
    border:1px solid rgba(255,255,255,.95); border-radius:12px; background:var(--card); box-shadow:var(--shadow-sm); font:500 10.5px/1 var(--num); color:var(--ink-2); transition:background .15s, transform .15s; }
  button.mini-cal:hover{ background:#fff; transform:translateY(-1px); }
  .mini-cal span{ display:grid; place-items:center; height:100%; max-height:15px; border-radius:4px; }
  .mini-cal .dow{ font:600 9.5px 'Noto Sans KR'; color:var(--mute); }
  .mini-cal .sun{ color:#c0566b; } .mini-cal .sat{ color:#4a6fa5; }
  .mini-cal .today{ background:var(--dark); color:#fff; font-weight:700; }
  /* 확대 달력 */
  .cal-modal{ position:fixed; inset:0; z-index:110; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(28,34,48,.28); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .cal-modal[hidden]{ display:none; }
  .cal-box{ width:min(400px, 100%); padding:18px 18px 20px; background:rgba(255,255,255,.98); border:1px solid #fff; border-radius:22px;
    box-shadow:0 40px 90px -30px rgba(32,44,68,.55), 0 2px 8px -2px rgba(32,44,68,.1); animation:calzoom .2s ease-out; }
  @keyframes calzoom{ from{ opacity:0; transform:scale(.88); } }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin:0 2px 10px; font-size:17px; font-weight:700; }
  .cal-head .arw{ display:flex; align-items:center; gap:2px; }
  .cal-head button{ height:32px; min-width:32px; border:0; border-radius:9px; background:transparent; color:var(--ink-2); font-size:17px; white-space:nowrap; padding:0 8px; }
  .cal-head button.txt{ font-size:13px; color:var(--mute); }
  .cal-head button:hover{ background:rgba(28,34,48,.06); color:var(--ink); }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); row-gap:4px; text-align:center; font:500 15px var(--num); }
  .cal-grid span{ height:44px; display:grid; place-items:center; border-radius:11px; color:var(--ink-2); }
  .cal-grid .dow{ font:600 12.5px 'Noto Sans KR'; color:var(--mute); height:30px; }
  .cal-grid .sun{ color:#c0566b; } .cal-grid .sat{ color:#4a6fa5; } .cal-grid .out{ color:#c9ced6; }
  .cal-grid .today{ background:var(--dark); color:#fff; font-weight:700; box-shadow:0 6px 12px -6px rgba(27,34,48,.8); }
  .cal-foot{ margin:12px 4px 0; font-size:13px; color:var(--mute); text-align:center; }
  .p-wx{ display:flex; flex-direction:column; gap:6px; }
  .p-wx .wx{ flex:1; }
  .news-row{ display:flex; flex-direction:column; }

  .wx{ display:flex; align-items:center; gap:14px; padding:6px 10px; border-radius:16px; background:transparent; border:1px solid transparent; box-shadow:none; transition:background .15s; }
  .wx:hover{ background:rgba(255,255,255,.55); }
  .wx-ico{ font-size:34px; line-height:1; }
  .wx-temp{ display:block; font:600 26px var(--num); letter-spacing:-.03em; line-height:1.1; }
  .wx-cond{ font-size:13px; color:var(--ink-2); }
  .wx-loc{ margin-left:auto; align-self:flex-start; max-width:50%; text-align:right; font-size:13px; font-weight:700; color:#23795f; line-height:1.4; word-break:keep-all; }
  .wx-loc .src{ font-weight:400; font-size:11.5px; color:var(--faint); }
  .wx-detail{ display:flex; flex-wrap:wrap; gap:2px 12px; margin:6px 4px 0; font-size:12px; color:var(--mute); }
  .wx-detail b{ font:600 12px var(--num); color:var(--ink-2); }
  .sub-title{ display:flex; align-items:center; gap:8px; margin:16px 4px 6px; font-size:13px; color:var(--ink-2); }
  .sub-title .line{ flex:1; height:1px; background:var(--line); }
  .news-line{ display:flex; align-items:center; gap:8px; min-height:36px; padding:3px 4px; }
  .news-line + .news-line{ border-top:1px solid var(--line); }
  .news-badge{ flex-shrink:0; font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; color:#fff; background:#c9465a; }
  .news-badge.latest{ background:#6b7486; } .news-badge.region{ background:#3b6f63; }
  .news-src{ display:none; }
  .news-time{ flex-shrink:0; font:500 12px var(--num); font-variant-numeric:tabular-nums; color:var(--mute); }
  .news-time:empty{ display:none; }
  a.news-title{ flex:1; min-width:0; font-size:13px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; transition:opacity .3s; }
  a.news-title:hover{ text-decoration:underline; text-underline-offset:3px; }
  a.news-title.fade{ opacity:0; }
  .news-empty{ color:var(--faint) !important; }
  .news-ctrl{ display:flex; flex-shrink:0; }
  .news-ctrl button{ width:24px; height:24px; border:0; border-radius:7px; background:transparent; color:var(--mute); font-size:14px; }
  .news-ctrl button:hover{ background:rgba(28,34,48,.06); color:var(--ink); }

  .ws{ display:flex; align-items:center; gap:8px; height:40px; padding:0 12px; border-radius:13px; background:var(--card); border:1px solid rgba(255,255,255,.95); box-shadow:var(--shadow-sm); }
  .ws svg{ width:16px; height:16px; color:var(--mute); flex-shrink:0; }
  .ws input{ flex:1; min-width:0; border:0; background:none; outline:none; font-size:14px; }
  .ws input::placeholder{ color:var(--faint); }
  .ws-btns{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }

  /* =================================================================

  var MENU = [];

  function getJSON(u){ return fetch(u).then(function(r){ if(!r.ok) throw r.status; return r.json(); }); }

  }
  /* 문서 읽기: 누리집 주소 → 원본 파일(raw) → jsDelivr 순으로 시도 */

        var lt=norm(p.title), lx=norm(p.text);
        if(!toks.every(function(t){ return lt.indexOf(t)>-1 || lx.indexOf(t)>-1; })) return;
        var cnt=0; toks.forEach(function(t){ var k=0; while((k=lx.indexOf(t,k))>-1){ cnt++; k+=t.length; if(cnt>999) break; } });
        hits.push({p:p, cnt:cnt, inTitle:toks.some(function(t){ return lt.indexOf(t)>-1; })});
      });
      hits.sort(function(a,b){ return (b.inTitle-a.inTitle) || (b.cnt-a.cnt); });
      h+='<span class="n">'+hits.length+'</span></div>';
      if(!hits.length) h+='<div class="empty">edu 문서에서 "'+esc(raw)+'"을(를) 찾지 못했습니다.</div>';
      hits.slice(0,30).forEach(function(x){
        var url=EDU.base+x.p.f+'#:~:text='+encodeURIComponent(raw.split(/\s+/)[0]);
        var sn=snippets(x.p.text, toks, 2);
        h+='<a class="doc" href="'+esc(url)+'"'+EXT+'><div class="d-top"><span class="d-title">'+hl(x.p.title,toks)+'</span><span class="d-file">'+esc(x.p.f)+'</span><span class="d-cnt">'+x.cnt+'곳 일치 ↗</span></div>'+
          sn.map(function(s){ return '<div class="d-snip">'+hl(s,toks)+'</div>'; }).join('')+'</a>';
      });
      h+='</div>';
    }
    box.innerHTML=h;
    if(items().length) mark(0);
  }

  /* 통합검색 열기·닫기 */
  var cmd=$('cmd'), fq=$('finder');
  function openCmd(v){
    cmd.hidden=!v; document.body.style.overflow = v ? 'hidden' : '';
    if(v){ run(); if(!IDX) build(); setTimeout(function(){ fq.focus(); fq.select(); }, 30); }
  }
  $('cmd-open').addEventListener('click', function(){ openCmd(true); });
  $('cmd-close').addEventListener('click', function(){ openCmd(false); });
  cmd.addEventListener('click', function(e){ if(e.target===cmd) openCmd(false); });
  $('results').addEventListener('click', function(e){ if(e.target.closest('a')) setTimeout(function(){ openCmd(false); }, 60); });
  $('re-idx').addEventListener('click', function(){ IDX=null; try{ localStorage.removeItem(KEY); }catch(e){} build(true); run(); fq.focus(); });
  var tmr=null;
  fq.addEventListener('input', function(){ clearTimeout(tmr); tmr=setTimeout(run, 150); if(!IDX) build(); });
  fq.addEventListener('keydown', function(e){
    if(e.key==='ArrowDown'){ e.preventDefault(); mark(sel+1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); mark(sel-1); }
    else if(e.key==='Enter' && !e.isComposing){ var it=items(); if(it.length){ e.preventDefault(); window.open(it[Math.max(sel,0)].href,'_blank','noopener'); openCmd(false); } }
  });
  document.addEventListener('keydown', function(e){
    var tag=(e.target.tagName||'').toLowerCase();
    if((e.ctrlKey||e.metaKey) && (e.key==='k'||e.key==='K')){ e.preventDefault(); openCmd(cmd.hidden); }
    else if(e.key==='/' && tag!=='input' && cmd.hidden){ e.preventDefault(); openCmd(true); }
    else if(e.key==='Escape' && !cmd.hidden){ openCmd(false); }
  });
  setTimeout(function(){ if(!IDX) build(); }, 2500);   // 접속 후 잠시 뒤 미리 읽어 둠
})();

/* ===== 레트로 아날로그 시계 + 미니 달력(클릭 시 확대) ===== */
(function(){
  var W=['일','월','화','수','목','금','토'], NS='http://www.w3.org/2000/svg';
  function $(id){ return document.getElementById(id); }
  function el(tag, at){ var e=document.createElementNS(NS, tag); for(var k in at) e.setAttribute(k, at[k]); return e; }
  /* 눈금·숫자 */
  var tk=$('ck-ticks'), nm=$('ck-nums');
  for(var i=0;i<60;i++){
    var big=i%5===0, a=i*6*Math.PI/180, r1=big?72:77, r2=83;
    tk.appendChild(el('line',{x1:100+r1*Math.sin(a), y1:100-r1*Math.cos(a), x2:100+r2*Math.sin(a), y2:100-r2*Math.cos(a), stroke:'#3a3326', 'stroke-width':big?3:1.1, 'stroke-linecap':'round'}));
  }
  for(var n=1;n<=12;n++){
    var b=n*30*Math.PI/180, t=el('text',{x:100+60*Math.sin(b), y:100-60*Math.cos(b)}); t.textContent=n; nm.appendChild(t);
  }
  /* 바늘 */
  var H=$('ck-h'), M=$('ck-m'), S=$('ck-s'), last=-1;
  function rot(g, deg, snap){ g.classList.toggle('no-anim', !!snap); g.setAttribute('transform','rotate('+deg+' 100 100)'); }
  function tick(){
    var d=new Date(), s=d.getSeconds(), m=d.getMinutes(), h=d.getHours()%12;
    rot(S, s*6, s===0); rot(M, m*6+s*.1, m===0&&s===0); rot(H, h*30+m*.5, h===0&&m===0&&s===0);
    $('aclock').setAttribute('aria-label','현재 시각 '+d.getHours()+'시 '+m+'분');
    if(d.getDate()!==last){ last=d.getDate(); $('now-date-txt').textContent=d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'.('+W[d.getDay()]+')'; mini(); }
  }
  function cells(y, m, outCls){
    var now=new Date(), first=new Date(y,m,1).getDay(), lastD=new Date(y,m+1,0).getDate(), prevLast=new Date(y,m,0).getDate(), h='';
    W.forEach(function(w,i){ h+='<span class="dow'+(i===0?' sun':i===6?' sat':'')+'">'+w+'</span>'; });
    var total=Math.ceil((first+lastD)/7)*7;
    for(var i=0;i<total;i++){
      var day=i-first+1, wd=i%7, cls=wd===0?'sun':wd===6?'sat':'', txt;
      if(day<1){ txt=outCls?prevLast+day:''; cls=outCls||''; } else if(day>lastD){ txt=outCls?day-lastD:''; cls=outCls||''; }
      else { txt=day; if(y===now.getFullYear()&&m===now.getMonth()&&day===now.getDate()) cls+=' today'; }
      h+='<span class="'+cls+'">'+txt+'</span>';
    }
    return h;
  }
  function mini(){ var n=new Date(); $('mini-cal').innerHTML=cells(n.getFullYear(), n.getMonth(), ''); }
  /* 바늘 처음 위치는 애니메이션 없이 */
  [H,M,S].forEach(function(g){ g.classList.add('no-anim'); });
  tick(); setTimeout(function(){ setInterval(tick, 1000); tick(); }, 1000-new Date().getMilliseconds());

  /* 확대 달력 */
  var modal=$('cal-modal'), view;
  function draw(){
    var y=view.getFullYear(), m=view.getMonth(), n=new Date();
    $('cal-title').textContent=y+'년 '+(m+1)+'월';
    $('cal-grid').innerHTML=cells(y, m, 'out');
    $('cal-foot').textContent='오늘 '+n.getFullYear()+'. '+(n.getMonth()+1)+'. '+n.getDate()+'.('+W[n.getDay()]+')';
  }
  function open(v){ modal.hidden=!v; if(v){ var n=new Date(); view=new Date(n.getFullYear(), n.getMonth(), 1); draw(); $('cal-close').focus(); } else { $('mini-cal').focus(); } }
  $('mini-cal').addEventListener('click', function(e){ e.stopPropagation(); open(true); });
  modal.addEventListener('click', function(e){ if(e.target===modal) open(false); });
  $('cal-close').addEventListener('click', function(){ open(false); });
  $('cal-prev').addEventListener('click', function(){ view.setMonth(view.getMonth()-1); draw(); });
  $('cal-next').addEventListener('click', function(){ view.setMonth(view.getMonth()+1); draw(); });
  $('cal-today').addEventListener('click', function(){ var n=new Date(); view=new Date(n.getFullYear(), n.getMonth(), 1); draw(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && !modal.hidden) open(false); });
})();

/* ===== 날씨: 접속 지역 기준 (인증키·별도 서버 불필요) =====
   위치: 브라우저 위치 권한 → 거부 시 접속 IP 기준 지역 → 실패 시 운암2동
   날씨: Open-Meteo 현재 날씨(무료·인증키 없음) */
(function(){
  var DEF={lat:35.17097, lon:126.88475, name:'북구 운암2동'};
  function $(id){ return document.getElementById(id); }
  function r(v){ return (v==null||isNaN(v)) ? '-' : Math.round(v); }
  function j(u){ return fetch(u).then(function(x){ if(!x.ok) throw 0; return x.json(); }); }
  function nameOf(d){ var parts=[d.city, d.locality].filter(function(v,i,a){ return v && a.indexOf(v)===i; }); return parts.length ? parts.join(' ') : '현재 위치'; }
  function byGPS(){
    return new Promise(function(res, rej){
      if(!navigator.geolocation) return rej();
      navigator.geolocation.getCurrentPosition(function(p){ res({lat:p.coords.latitude, lon:p.coords.longitude}); }, rej, {timeout:8000, maximumAge:10*60*1000});
    }).then(function(p){
      return j('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+p.lat+'&longitude='+p.lon+'&localityLanguage=ko')
        .then(function(d){ p.name=nameOf(d); return p; }, function(){ p.name='현재 위치'; return p; });
    });
  }
  function byIP(){
    return j('https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=ko').then(function(d){
      if(d.latitude==null) throw 0; return {lat:d.latitude, lon:d.longitude, name:nameOf(d)+'(접속지역)'};
    });
  }
  var WMO={0:['☀️','맑음'],1:['🌤️','대체로 맑음'],2:['⛅','구름많음'],3:['☁️','흐림'],45:['🌫️','안개'],48:['🌫️','안개'],
    51:['🌦️','약한 이슬비'],53:['🌦️','이슬비'],55:['🌧️','강한 이슬비'],56:['🌧️','어는 이슬비'],57:['🌧️','어는 이슬비'],
    61:['🌧️','약한 비'],63:['🌧️','비'],65:['🌧️','강한 비'],66:['🌧️','어는 비'],67:['🌧️','어는 비'],
    71:['🌨️','약한 눈'],73:['🌨️','눈'],75:['❄️','강한 눈'],77:['🌨️','싸락눈'],
    80:['🌦️','소나기'],81:['🌧️','소나기'],82:['⛈️','강한 소나기'],85:['🌨️','눈 소나기'],86:['❄️','강한 눈 소나기'],
    95:['⛈️','뇌우'],96:['⛈️','뇌우·우박'],99:['⛈️','뇌우·우박']};
  function wxUrl(pos){
    return 'https://api.open-meteo.com/v1/forecast?latitude='+pos.lat+'&longitude='+pos.lon+
      '&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day'+
      '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max'+
      '&wind_speed_unit=ms&timezone=Asia%2FSeoul&forecast_days=1';
  }
  function render(d){
    var c=d.current, y=d.daily, w=WMO[c.weather_code]||['🌡️','-'];
    if(c.is_day===0 && c.weather_code<=1) w=['🌙', w[1]];
    $('wx-ico').textContent=w[0]; $('wx-temp').textContent=r(c.temperature_2m)+'°'; $('wx-cond').textContent=w[1];
    var pp=y.precipitation_probability_max?y.precipitation_probability_max[0]:null;
    $('wx-detail').innerHTML=
      '<span>최고 <b>'+r(y.temperature_2m_max[0])+'°</b> 최저 <b>'+r(y.temperature_2m_min[0])+'°</b></span>'+
      '<span>강수 <b>'+r(pp)+'%</b></span><span>습도 <b>'+r(c.relative_humidity_2m)+'%</b></span>'+
      '<span>바람 <b>'+(c.wind_speed_10m==null?'-':c.wind_speed_10m.toFixed(1))+'m/s</b></span>'+
      '<span>'+String(c.time||'').slice(11,16)+' 기준</span>';
  }
  var pos=null;
  function load(){
    (pos ? Promise.resolve(pos) : byGPS().catch(byIP).catch(function(){ return {lat:DEF.lat, lon:DEF.lon, name:DEF.name}; }).then(function(p){ return pos=p; }))
    .then(function(p){
      var el=$('wx-loc'), m=String(p.name).match(/^(.*?)\s*(\(접속지역\))$/);
      el.textContent=m?m[1]+' ':p.name;
      if(m){ var s=document.createElement('span'); s.className='src'; s.textContent=m[2]; el.appendChild(s); }
      return j(wxUrl(p)); })
    .then(render)
    .catch(function(){ $('wx-cond').textContent='기상청 날씨 보기'; $('wx-detail').textContent='날씨 정보를 불러오지 못했습니다'; });
  }
  load(); setInterval(load, 30*60*1000);
})();

/* ===== 뉴스 2줄: 뉴시스 공식 RSS =====
   1줄(전국): 속보 RSS / 2줄(지역): 여러 분야 RSS 중 광주·전남 발신 기사만
   6초마다 다음 기사, 마우스를 올리면 멈춤, 3분마다 새로고침 */
(function(){
  var BASE='https://www.newsis.com/RSS/', HOME='https://www.newsis.com/', ROTATE=6000, REFRESH=3*60*1000, MAX=30;
  var LOCAL_RE=/\[\s*(전남광주|광주|전남|무안|목포|순천|여수|광양|나주|담양|곡성|구례|고흥|보성|화순|장흥|강진|해남|영암|함평|영광|장성|완도|진도|신안)\s*=\s*뉴시스/;
  function $(id){ return document.getElementById(id); }
  function parse(txt, filter){
    var doc=new DOMParser().parseFromString(txt,'text/xml'), out=[], nodes=doc.getElementsByTagName('item');
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i], t=n.getElementsByTagName('title')[0], l=n.getElementsByTagName('link')[0], d=n.getElementsByTagName('pubDate')[0], ds=n.getElementsByTagName('description')[0];
      if(!t) continue;
      var title=t.textContent.replace(/\s+/g,' ').trim(); if(!title) continue;
      if(filter){ var body=(ds?ds.textContent:'').replace(/<[^>]+>/g,' ').slice(0,300); if(!filter.test(body)) continue; }
      out.push({title:title, link:l?l.textContent.trim():HOME, t:d?Date.parse(d.textContent):0});
    }
    return out;
  }
  function hhmm(t){ if(!t||isNaN(t)) return ''; var d=new Date(t), p=function(n){ return (n<10?'0':'')+n; }; return p(d.getHours())+':'+p(d.getMinutes()); }
  function getText(f){ return fetch(BASE+f+'.xml',{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.text(); }); }
  function ticker(cfg){
    var items=[], idx=0, timer=null, paused=false;
    function show(i){
      if(!items.length) return;
      idx=(i+items.length)%items.length;
      var it=items[idx], a=$(cfg.title), bd=$(cfg.badge);
      a.classList.add('fade');
      setTimeout(function(){
        var sokbo=/^\s*\[속보\]/.test(it.title);
        bd.textContent = sokbo ? '속보' : cfg.normalLabel;
        bd.className = 'news-badge'+(sokbo ? '' : ' '+cfg.normalClass);
        a.classList.remove('news-empty');
        a.textContent = sokbo ? it.title.replace(/^\s*\[속보\]\s*/,'') : it.title;
        a.href=it.link; a.title=it.title+' ('+hhmm(it.t)+')';
        $(cfg.time).textContent=hhmm(it.t);
        a.classList.remove('fade');
      }, 250);
    }
    function start(){ clearInterval(timer); timer=setInterval(function(){ if(!paused) show(idx+1); }, ROTATE); }
    function load(){
      cfg.fetch().then(function(list){
        if(!list.length) throw 'empty';
        var cur=items[idx] && items[idx].link;
        items=list.slice(0,MAX);
        var k=0; for(var i=0;i<items.length;i++){ if(items[i].link===cur){ k=i; break; } }
        if(!cur){ show(0); start(); } else { idx=k; }
      }).catch(function(e){
        if(!items.length){
          var a=$(cfg.title); a.classList.remove('fade');
          if(e==='empty'){ a.textContent=cfg.emptyText; a.classList.add('news-empty'); } else { a.textContent='뉴스를 불러오지 못했습니다 · 뉴시스 바로가기'; }
          a.href=HOME;
        }
      });
    }
    var box=$(cfg.box);
    box.addEventListener('mouseenter', function(){ paused=true; });
    box.addEventListener('mouseleave', function(){ paused=false; });
    $(cfg.prev).addEventListener('click', function(){ show(idx-1); start(); });
    $(cfg.next).addEventListener('click', function(){ show(idx+1); start(); });
    load(); setInterval(load, REFRESH);
  }
  ticker({ box:'news-line', title:'news-title', badge:'news-badge', time:'news-time', prev:'news-prev', next:'news-next',
    normalLabel:'최신', normalClass:'latest', emptyText:'표시할 기사가 없습니다 · 뉴시스 바로가기',
    fetch:function(){ return getText('sokbo').then(function(t){ return parse(t); }); } });
  ticker({ box:'local-line', title:'local-title', badge:'local-badge', time:'local-time', prev:'local-prev', next:'local-next',
    normalLabel:'지역', normalClass:'region', emptyText:'현재 전남광주 지역 기사가 없습니다 · 뉴시스 바로가기',
    fetch:function(){
      var feeds=['sokbo','country','society','politics','economy','culture'];
      return Promise.all(feeds.map(function(f){ return getText(f).then(function(t){ return parse(t, LOCAL_RE); }, function(){ return null; }); }))
      .then(function(res){
        if(res.every(function(r){ return r===null; })) throw 0;
        var seen={}, all=[];
        res.forEach(function(list){ (list||[]).forEach(function(it){ if(!seen[it.link]){ seen[it.link]=1; all.push(it); } }); });
        all.sort(function(a,b){ return (b.t||0)-(a.t||0); });
        return all;
      });
    } });
})();
</script>
