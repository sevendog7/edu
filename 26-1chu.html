<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026년도 제1회 추경 예상 질의·답변서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --ink:#1f2933; --sub:#52606d; --mute:#8a96a3; --line:#e1e5ea;
  --navy:#1d3557; --navy2:#274b7a; --accent:#2563a8; --accent-bg:#eaf1fa;
  --inc:#b42318; --inc-bg:#fdecea; --dec:#1d5fbf; --dec-bg:#e8f0fc; --neu:#5b6672; --neu-bg:#eef0f3;
  --hl:#ffe58a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans KR","Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;word-break:keep-all}
button{font:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;padding:14px 24px;position:sticky;top:0;z-index:20;box-shadow:0 1px 0 rgba(0,0,0,.1)}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1440px;margin:0 auto}
.brand{min-width:260px}
.brand small{display:block;font-size:12px;opacity:.75;letter-spacing:.02em}
.brand b{font-size:18px;font-weight:700}
.search{flex:1;min-width:280px;position:relative}
.search input{width:100%;padding:11px 40px 11px 14px;border-radius:8px;border:0;font:inherit;font-size:15px;outline:none;color:var(--ink)}
.search input:focus{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.search .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mute);font-size:18px;display:none}
.hbtn{display:flex;gap:6px}
.hbtn button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:7px 12px;font-size:13px}
.hbtn button:hover{background:rgba(255,255,255,.22)}
.layout{display:grid;grid-template-columns:290px 1fr;gap:20px;max-width:1440px;margin:0 auto;padding:20px 24px 60px}
aside{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 10px}
.side-h{font-size:12px;color:var(--mute);padding:4px 8px 8px;display:flex;justify-content:space-between}
.bureau{margin-bottom:6px}
.bureau>.bt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:6px;font-weight:700;color:var(--navy);font-size:14px}
.bureau>.bt:hover{background:var(--bg)}
.dept{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;padding:5px 8px 5px 18px;border-radius:6px;color:var(--sub);font-size:13.5px}
.dept:hover{background:var(--bg)}
.dept.on,.bureau>.bt.on{background:var(--accent-bg);color:var(--accent)}
.cnt{font-size:12px;color:var(--mute);font-weight:400}
.dept.on .cnt{color:var(--accent)}
main{min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips .lbl{font-size:12px;color:var(--mute);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--sub)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.status{font-size:13.5px;color:var(--sub);margin:0 0 12px}
.status b{color:var(--ink)}
.status .reset{border:0;background:none;color:var(--accent);text-decoration:underline;font-size:13px;padding:0 4px}
.grp{font-size:13px;font-weight:700;color:var(--navy);margin:22px 0 8px;padding-left:2px;display:flex;gap:8px;align-items:center}
.grp:first-child{margin-top:0}
.grp span{color:var(--mute);font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;scroll-margin-top:90px}
.card.open{border-color:#c9d5e4;box-shadow:0 2px 10px rgba(29,53,87,.06)}
.ch{display:grid;grid-template-columns:auto 1fr auto;gap:14px;padding:14px 18px;cursor:pointer;align-items:start}
.ch:hover{background:#fafbfc}
.qno{font-size:12px;font-weight:700;color:#fff;background:var(--navy2);border-radius:6px;padding:3px 8px;white-space:nowrap;margin-top:2px}
.qt{font-weight:700;font-size:16px;line-height:1.45}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font-size:12.5px;color:var(--mute)}
.tag{display:inline-block;font-size:11.5px;font-weight:500;border-radius:4px;padding:1px 7px;margin-right:4px;vertical-align:1px}
.t-in{background:#efe9fb;color:#5b3fa0}.t-out{background:var(--neu-bg);color:var(--neu)}.t-etc{background:#fff4e0;color:#8a5a00}
.k-inc{background:var(--inc-bg);color:var(--inc)}.k-dec{background:var(--dec-bg);color:var(--dec)}.k-neu{background:var(--neu-bg);color:var(--neu)}
.arrow{color:var(--mute);transition:transform .15s;margin-top:4px}
.card.open .arrow{transform:rotate(90deg)}
.pre{padding:0 18px 14px 18px;margin:-4px 0 0;font-size:14px;color:var(--sub)}
.pre ul{margin:0;padding:10px 14px;list-style:none;background:#f8fafc;border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.pre li{margin:2px 0}
.pre li b{color:var(--navy);font-weight:700}
.card.open .pre{display:none}
.body{display:none;padding:4px 22px 22px;border-top:1px solid var(--line)}
.card.open .body{display:block}
.body h4{font-size:15px;color:var(--navy);margin:20px 0 8px;padding:0 0 4px;border-bottom:2px solid var(--accent-bg)}
.body h4 .unit{font-size:12px;font-weight:400;color:var(--mute);margin-left:4px}
.body h5{font-size:14px;margin:14px 0 6px;color:var(--ink)}
.body p{margin:3px 0}
.body .l0{font-weight:500}
.body .l1{padding-left:14px}
.body .l2{padding-left:30px;color:#3e4c59}
.body .note{padding-left:14px;font-size:13.5px;color:var(--sub)}
.body .unit{font-size:12.5px;color:var(--mute);text-align:right}
.body .pg{font-size:13px;color:var(--mute)}
.body ul.summary{list-style:none;margin:8px 0;padding:12px 16px;background:#f8fafc;border:1px solid #dbe5f1;border-radius:8px}
.body ul.summary li{margin:3px 0}
.body ul.summary li b{color:var(--navy)}
.body .sub{margin:26px 0 6px;padding:8px 12px;background:var(--navy);color:#fff;border-radius:6px;font-weight:700;font-size:14px}
.body .nestbox{margin:8px 0 12px;padding:4px 0}
.body .boxnote{padding:8px 12px;background:#f8fafc;border:1px solid var(--line);border-radius:6px;margin:8px 0;font-size:14px}
.tw{overflow-x:auto;margin:8px 0 10px}
.body table{border-collapse:collapse;font-size:13.5px;min-width:60%;border-top:2px solid var(--navy)}
.body td{border:1px solid var(--line);padding:6px 9px;vertical-align:middle;text-align:center}
.body td.th{background:#f1f4f8;font-weight:700;color:var(--navy)}
.body td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.body td.minus{color:var(--dec)}
.cfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.cfoot button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 11px;font-size:12.5px;color:var(--sub)}
.cfoot button:hover{border-color:var(--accent);color:var(--accent)}
mark{background:var(--hl);color:inherit;padding:0 1px;border-radius:2px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:40px;text-align:center;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}
.menu-btn{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:14px}
  aside{position:fixed;inset:0 30% 0 0;top:0;max-height:none;border-radius:0;z-index:40;transform:translateX(-105%);transition:.2s;padding-top:20px}
  aside.show{transform:none;box-shadow:4px 0 20px rgba(0,0,0,.2)}
  .menu-btn{display:inline-block}
  .brand{min-width:0}
  .search .kbd{display:none}
  .ch{padding:12px 14px;gap:10px}
  .body{padding:4px 14px 18px}
}
@media print{
  header,aside,.toolbar,.cfoot,.status{display:none}
  .layout{display:block;padding:0}
  .card{break-inside:avoid-page;border:0;border-bottom:1px solid #ccc;border-radius:0}
  .pre{display:none}
  .body{display:block!important;border:0}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <button class="hbtn menu-btn" id="menuBtn" style="background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:6px 10px">목차</button>
    <div class="brand"><small>2026년도 전남광주통합특별시교육비특별회계</small><b>제1회 추경 예상 질의·답변서</b></div>
    <div class="search">
      <input id="q" type="search" placeholder="사업명, 담당자, 키워드 검색 (예: 인건비, 이월, 황진아)" autocomplete="off">
      <span class="kbd" id="kbd">/</span>
      <button class="clr" id="clr" aria-label="검색어 지우기">×</button>
    </div>
    <div class="hbtn">
      <button id="openAll">모두 펼치기</button>
      <button id="closeAll">모두 접기</button>
    </div>
  </div>
</header>
<div class="layout">
  <aside id="side"></aside>
  <main>
    <div class="toolbar">
      <div class="chips" id="fType"><span class="lbl">구분</span></div>
      <div class="chips" id="fKind"><span class="lbl">유형</span></div>
    </div>
    <p class="status" id="status"></p>
    <div id="list"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

 {"id": 11, "bureau": "미래정책국", "dept": "미래시민교육과", "no": 4, "type": "세출", "title": "‘과학실 안전장구 및 안전설비 확충 지원비’예산 증액 사유는?", "staff": "이미정", "phone": "062-380-4503", "pages": "예산서: p 79 사업설명서: p 24", "kind": "증액", "summary": "○ (예산 편성현황) 특별교부금 800,000천원 순증 편성  ○ (근거) 2026년 제3차 국가시책 특별교부금 지원계획 안내(교육부, 2026.9.17.)  ○ (증액사유) 교육부 제3차 국가시책 특별교부금으로 학교 과학실험실의 안전장구 및 안전설비를 확충하여 안전사고를 예방하고자함  ○ (증액내용) 관내 초·중·고 143교에 보안경·실험복 등 안전장구와 밀폐시약장·눈세척기 등 안전설비 확충비 지원", "body": "<h4>답변요지<\/h4>\n<ul class=\"summary\"><li><b>(예산 편성현황)<\/b> 특별교부금 800,000천원 순증 편성<\/li><li><b>(근거)<\/b> 2026년 제3차 국가시책 특별교부금 지원계획 안내(교육부, 2026.9.17.)<\/li><li><b>(증액사유)<\/b> 교육부 제3차 국가시책 특별교부금으로 학교 과학실험실의 안전장구 및 안전설비를 확충하여 안전사고를 예방하고자함<\/li><li><b>(증액내용)<\/b> 관내 초·중·고 143교에 보안경·실험복 등 안전장구와 밀폐시약장·눈세척기 등 안전설비 확충비 지원<\/li><\/ul>\n<h4>현 황<\/h4>\n<p class=\"unit\">(단위: 교, 천원)<\/p>\n<div class=\"tw\"><table><tr><td rowspan=\"2\" class=\"th\">학교급<\/td><td colspan=\"3\" class=\"th\">학교수<\/td><td colspan=\"3\" class=\"th\">지원금액<\/td><\/tr><tr><td>공립<\/td><td>사립<\/td><td>소계<\/td><td>공립<\/td><td>사립<\/td><td>소계<\/td><\/tr><tr><td>초등학교<\/td><td class=\"n\">58<\/td><td class=\"n\">2<\/td><td class=\"n\">60<\/td><td class=\"n\">308,000<\/td><td class=\"n\">9,000<\/td><td class=\"n\">317,000<\/td><\/tr><tr><td>중학교<\/td><td class=\"n\">30<\/td><td class=\"n\">14<\/td><td class=\"n\">44<\/td><td class=\"n\">126,500<\/td><td class=\"n\">99,500<\/td><td class=\"n\">226,000<\/td><\/tr><tr><td>고등학교<\/td><td class=\"n\">10<\/td><td class=\"n\">29<\/td><td class=\"n\">39<\/td><td class=\"n\">70,000<\/td><td class=\"n\">187,000<\/td><td class=\"n\">257,000<\/td><\/tr><tr><td>합계<\/td><td class=\"n\">98<\/td><td class=\"n\">45<\/td><td class=\"n\">143<\/td><td class=\"n\">504,500<\/td><td class=\"n\">295,500<\/td><td class=\"n\">800,000<\/td><\/tr><\/table><\/div>\n<p class=\"note\">※국제고등학교 지원액: 14,500천원<\/p>\n<h4>예산 증액 사유<\/h4>\n<p class=\"l1\">○ 학교 실험실 안전 강화를 위해 학교 수요에 따라, 안전장구 및 안전설비 확충비를 지원함<\/p>\n<p class=\"l1\">○ 「광주광역시 과학 교구·설비 기준」 에 따라 학교 자체 계획을 수립하여 학교 실정에 맞는 과학실 안전 관리 관련 예산 집행을 하도록 함<\/p>\n<h4>추경예산편성 내역<\/h4>\n<p class=\"unit\">(단위: 천원)<\/p>\n<div class=\"tw\"><table><tr><td class=\"th\">세부사업<\/td><td class=\"th\">사업세부내역<\/td><td class=\"th\">추경예산(A)<\/td><td class=\"th\">기정예산(B)<\/td><td class=\"th\">합계<br>(C=A+B)<\/td><td class=\"th\">비고<\/td><\/tr><tr><td>교육과정운영여건개선<\/td><td>과학실안전장구 및<br>안전설비<\/td><td class=\"n\">800,000<\/td><td class=\"n\">0<\/td><td class=\"n\">800,000<\/td><td>특교<\/td><\/tr><\/table><\/div>\n<h4>참고사항-국제고 화학실험 사고 관련 과학실험실 안전관리 현황<\/h4>\n<p class=\"l1\">○ 최근 3년간 과학실험실 사고 현황?<\/p>\n<p class=\"unit\">(단위: 교)<\/p>\n<div class=\"tw\"><table><tr><td class=\"th\">구분<\/td><td class=\"th n\">2024<\/td><td class=\"th n\">2025<\/td><td class=\"th n\">2026<\/td><td class=\"th\">비고<\/td><\/tr><tr><td>초등학교<\/td><td class=\"n\">2<\/td><td><\/td><td class=\"n\">-<\/td><td rowspan=\"5\" class=\"minus\">- 2024년: 유리관 등 유리깨짐 등으로 손가락 베임(2건)<br>- 2025년: 메탄올 실험 중 불길이 번져, 소화기 작동 중 분말 흡입(1건)<br>- 2026년: 동아리 화학실험중 화학약품 폭연<\/td><\/tr><tr><td>중학교<\/td><td class=\"n\">-<\/td><td class=\"n\">-<\/td><td class=\"n\">-<\/td><\/tr><tr><td>고등학교<\/td><td class=\"n\">-<\/td><td class=\"n\">1<\/td><td class=\"n\">1<\/td><\/tr><tr><td>특수학교<\/td><td class=\"n\">-<\/td><td class=\"n\">-<\/td><td class=\"n\">-<\/td><\/tr><tr><td>계<\/td><td class=\"n\">2<\/td><td class=\"n\">1<\/td><td class=\"n\">1<\/td><\/tr><\/table><\/div>\n<p class=\"l1\">○ 과학실 안전관리를 위한 추진 내용?<\/p>\n<p class=\"l2\">- (안전관리계획수립) 과학실 안전관리 계획 수립·운영 → 안전 매뉴얼 포함<\/p>\n<p class=\"l1\">‧ 시교육청 과학실험실 안전관리 기본 계획 수립<\/p>\n<p class=\"l1\">‧ 각급 학교별 과학실험실 안전관리 계획 수립<\/p>\n<p class=\"l2\">→ 국제고등학교 학교 과학실험실 안전관리 계획 수립 확인 함<\/p>\n<p class=\"l2\">- (안전매뉴얼) 과학실 안전사고 예방‧조치 매뉴얼 등 안전수칙 비치의무<\/p>\n<p class=\"l2\">→ 안전사고 예방을 위한 교육 및 관리 체계 명문화/ 과학실 내 안전 관련 게시물 게시‧교육 / 안전사고 대처요령 포스터에 인근 병원, 보건교사, 담당교사 등 연락처 기재 등<\/p>\n<p class=\"l2\">→ 국제고등학교 학교 과학실험실 안전 수칙 및 매뉴얼 비치 확인 함<\/p>\n<p class=\"l2\">- (안전교육) 학생 및 교사 안전교육 실시<\/p>\n<p class=\"l1\">‧ (학생) 학생 안전교육 실시 계획 수립 및 실험 전 5분 안전교육 실시<\/p>\n<ul class=\"summary\"><li>→ 체크사항: 안전장구(보안경, 실험복 등) 착용 / 비상사태 발생 시 행동 요령 안내 / 과학실험 수업, 동아리 활동 등 진행 시 담당 교사 지도 / 사전실험을 통해 실험 위험도를 파악하고, 위험성이 높은 실험은 교사 시범 실험이나 동영상 등으로 대체<\/li><\/ul>\n<p class=\"l1\">‧ (교사) 과학실 이용 교사 안전연수 연 15차시 이상 이수의무<\/p>\n<p class=\"l2\">→ 국제고등학교 과학교사 전체(10명) 안전 교육 15차시 이수 완료<\/p>\n<p class=\"l2\">- (안전점검) 과학실 안전 점검 실시<\/p>\n<p class=\"l1\">‧ (학교) 안전점검의 날 실시매월 4일 및 현황 결과 보고학교→교육청 연 2회<\/p>\n<p class=\"l2\">→ 국제고등학교 안전 점검의 날 실시 결과 제출: 2026. 7. 20.<\/p>\n<p class=\"l1\">‧ (교육청) 학교 안전점검지원단 운영 및 학교 점검(총 22명, 106교)<\/p>\n<p class=\"note\">※ 3년 주기 전체 학교 점검 완료:  (’22) 102교 → (’23) 110교 → (’24) 100교 → (’25) 105교 → (’26) 106교<\/p>\n<p class=\"l2\">→ 국제고등학교 안전점검 실시: 2025년 하반기 실시<\/p>\n<p class=\"l2\">- (과학실 안전장구‧설비 확충비지원) 총 143교에 100만원최소~1,450만원최대, 총 8억원 지원<\/p>\n<p class=\"l2\">→ 국제고등학교 총 14,500천원 지원함<\/p>\n<p class=\"l1\">○ 과학실 안전사고 처리 체계<\/p>\n<div class=\"nestbox\"><p class=\"l0\">※ 【비상연락망】 학교(최초 발견자)→시교육청(안전총괄과 학교 안전담당자 및 미래시민교육과 과학실험실 안전담당자)→교육부(학교안전 담당자 및 과학교육 업무 담당자)<\/p><div class=\"tw\"><table><tr><td class=\"th\">학교<\/td><td rowspan=\"2\" class=\"th\">➡<\/td><td class=\"th\">시교육청<\/td><td rowspan=\"2\" class=\"th\">➡<\/td><td class=\"th\">교육부 및 관계부처<\/td><\/tr><tr><td>• 실험실 안전사고 최초 인지<br>• 신속한 신고·대응을 통한 안전 확보 및 피해 최소화<br>• 비상연락체계에 따른 보고<\/td><td>• 과학실 안전관리 사고처리 지원<br>• 비상연락체계에 따른 보고<br>• 사고처리 점검 및 재발 방지<\/td><td>• 사고 접수 및 상황 전파<br>• 중앙차원의 사고관리 및 대응 인프라 활용 지원<br>• 제도 개선 및 지침 강화 등<\/td><\/tr><\/table><\/div><\/div>\n<p class=\"l1\">○ 국제고등학교 안전사고 발생에 따른 조치 사항?<\/p>\n<p class=\"l2\">- (국제고) 국제고 동아리 화학실험 중 안전사고 발생(11.4. 16시경)<\/p>\n<p class=\"l2\">- (국제고) 보건교사 1차 조치 및 119신고 및 보고, 병원 이송 등(11.4.)<\/p>\n<p class=\"l2\">- 학교 현장 상황 파악 및 안전조치 점검(11.4. 18:00) / 미래시민교육과<\/p>\n<p class=\"l2\">- 병원 방문 학생 피해 상황 파악(11.4. 18:00) / 안전총괄과<\/p>\n<p class=\"l2\">- 전남광주통합특별시교육청 대책지원반 구성 및 상황판단회의(11.4. 20:00)<\/p>\n<p class=\"l2\">- 과학 실험 시 안전 조치 및 안전교육 강화 공문 발송(11.5.) / 미래시민교육과<\/p>\n<p class=\"l2\">- 학교안전공제회 피해 학생 보상 지원 안내(11.5.) / 안전총괄과<\/p>\n<p class=\"l2\">- (국제고) 안전사고 발생에 따른 결과 조치 보고 접수(11.5.)<\/p>\n<p class=\"l2\">- 학교 현장점검 실시 및 조치 사항 개선 요청(11.9.) / 미래시민교육과<\/p>\n<p class=\"l2\">- 학생 출석 인정 처리 및 피해 학생 심리 상담 지원 등 / 관련 부서<\/p>\n<p class=\"l1\">○ 향후 과학실 안전 사고 재발 방지 대책은?<\/p>\n<p class=\"l2\">- (과학 실험 계획 수립) 실험과정, 유의사항, 재료 및 시약 등 포함<\/p>\n<p class=\"l2\">- (사전 실험 실시) 위험성 높은 실험 교사 시범이나 동영상 등으로 대체<\/p>\n<p class=\"l2\">- (안전교육 철저) 실험 전 5분 안전교육 실시, 실험 과정에 대한 학생 숙지<\/p>\n<p class=\"l2\">- (보호구착용 의무) 보안경·실험복 등 보호구 착용 의무<\/p>\n<p class=\"l2\">- (약품·설비 관리) 화학약품 특성에 따른 분리 보관과 관리대장 정비, 폐시약의 적정 처리, 환기설비·눈세척기 등 안전설비의 작동 상태 점검<\/p>\n<p class=\"l2\">- (후속 관리) 현장점검 실시 및 미흡 사항 개선 조치 강화<\/p>\n<p class=\"l2\">- (비상대응체계) 사고 발생 시 실험 중지, 학생 대피, 응급조치 및 신속한 보고가 이루어지도록 비상 연락망과 대응 절차 재점검<\/p>\n<p class=\"l2\">- (사례 공유 및 재발 방지) 사고 원인과 유의사항 등 확인된 내용을 각급학교에 안내하여 유사 사고 예방<\/p>", "text": "‘과학실 안전장구 및 안전설비 확충 지원비’예산 증액 사유는?  답변요지 (예산 편성현황) 특별교부금 800,000천원 순증 편성 (근거) 2026년 제3차 국가시책 특별교부금 지원계획 안내(교육부, 2026.9.17.) (증액사유) 교육부 제3차 국가시책 특별교부금으로 학교 과학실험실의 안전장구 및 안전설비를 확충하여 안전사고를 예방하고자함 (증액내용) 관내 초·중·고 143교에 보안경·실험복 등 안전장구와 밀폐시약장·눈세척기 등 안전설비 확충비 지원 현 황 (단위: 교, 천원) 학교급 학교수 지원금액 공립 사립 소계 공립 사립 소계 초등학교 58 2 60 308,000 9,000 317,000 중학교 30 14 44 126,500 99,500 226,000 고등학교 10 29 39 70,000 187,000 257,000 합계 98 45 143 504,500 295,500 800,000 ※국제고등학교 지원액: 14,500천원 예산 증액 사유 ○ 학교 실험실 안전 강화를 위해 학교 수요에 따라, 안전장구 및 안전설비 확충비를 지원함 ○ 「광주광역시 과학 교구·설비 기준」 에 따라 학교 자체 계획을 수립하여 학교 실정에 맞는 과학실 안전 관리 관련 예산 집행을 하도록 함 추경예산편성 내역 (단위: 천원) 세부사업 사업세부내역 추경예산(A) 기정예산(B) 합계 (C=A+B) 비고 교육과정운영여건개선 과학실안전장구 및 안전설비 800,000 0 800,000 특교 참고사항-국제고 화학실험 사고 관련 과학실험실 안전관리 현황 ○ 최근 3년간 과학실험실 사고 현황? (단위: 교) 구분 2024 2025 2026 비고 초등학교 2 - - 2024년: 유리관 등 유리깨짐 등으로 손가락 베임(2건) - 2025년: 메탄올 실험 중 불길이 번져, 소화기 작동 중 분말 흡입(1건) - 2026년: 동아리 화학실험중 화학약품 폭연 중학교 - - - 고등학교 - 1 1 특수학교 - - - 계 2 1 1 ○ 과학실 안전관리를 위한 추진 내용? - (안전관리계획수립) 과학실 안전관리 계획 수립·운영 → 안전 매뉴얼 포함 ‧ 시교육청 과학실험실 안전관리 기본 계획 수립 ‧ 각급 학교별 과학실험실 안전관리 계획 수립 → 국제고등학교 학교 과학실험실 안전관리 계획 수립 확인 함 - (안전매뉴얼) 과학실 안전사고 예방‧조치 매뉴얼 등 안전수칙 비치의무 → 안전사고 예방을 위한 교육 및 관리 체 1,204,000 "}, {"id": 16, "bureau": "미래정책국", "dept": "노동정책과", "no": 3, "type": "세출", "title": "‘교육공무직 퇴직금’예산 증액 사유는?", "staff": "최준민", "phone": "062-380-4864", "pages": "예산서: p88 사업설명서: p27", "kind": "증액", "summary": "○ (예산 증액 현황) 1,516,118천원  ○ (근거) 「근로자퇴직급여 보장법」제16조, 같은 법 시행령 제5조  ○ (증액사유) 교육공무직 퇴직금 지급 능력 확보에 따른 증액   - 연중 합의 퇴직자 등에 대한 퇴직급여 지급으로 적립금이 감소하여, 9월 적립금 평가액이 118,332,715천원으로 2026년 최소 적립금 119,848,833천원에 미달(적립비율 약 98.75%)  ○ (증액내용) 최소적립금 100% 이상 충족에 필요한 부족액 1,516,118천원 확보 필요", "body": "<h4>답변요지<\/h4>\n<ul class=\"summary\"><li><b>(예산 증액 현황)<\/b> 1,516,118천원<\/li><li><b>(근거)<\/b> 「근로자퇴직급여 보장법」제16조, 같은 법 시행령 제5조<\/li><li><b>(증액사유)<\/b> 교육공무직 퇴직금 지급 능력 확보에 따른 증액<\/li><li>연중 합의 퇴직자 등에 대한 퇴직급여 지급으로 적립금이 감소하여, 9월 적립금 평가액이 118,332,715천원으로 2026년 최소 적립금 119,848,833천원에 미달(적립비율 약 98.75%)<\/li><li><b>(증액내용)<\/b> 최소적립금 100% 이상 충족에 필요한 부족액 1,516,118천원 확보 필요<\/li><\/ul>\n<h4>현 황<\/h4>\n<p class=\"l1\">○「근로자퇴직급여 보장법」제4조에 따라 전남광주통합특별시교육청 광주청사 소속 교육감 채용권 전환 교육공무직원은 확정급여형 퇴직연금제도(DB)로 설정됨<\/p>\n<p class=\"l2\">- 가입자 3,003명, 퇴직연금 적립금 평가액 118,332,715천원(2026.9.30.자 기준)<\/p>\n<p class=\"l1\">○ 2026년 교육감 채용권 전환 교육공무직원 퇴직 현황 (2026. 9. 30. 기준)<\/p>\n<p class=\"unit\">(단위: 명)<\/p>\n<div class=\"tw\"><table><tr><td rowspan=\"2\" class=\"th\">내역<\/td><td colspan=\"4\" class=\"th\">퇴직 사유별 인원 수<\/td><\/tr><tr><td>정년퇴직<\/td><td>합의퇴직<\/td><td>당연퇴직<\/td><td>합계<\/td><\/tr><tr><td>퇴직 인원<\/td><td class=\"n\">169<\/td><td class=\"n\">114<\/td><td class=\"n\">2<\/td><td class=\"n\">285<\/td><\/tr><\/table><\/div>\n<h4>예산 증액 사유<\/h4>\n<p class=\"l1\">○ 근로자의 퇴직급여 수급권을 보장하기 위해 법령에 따라 산출된 최소적립금 100% 이상을 적립금으로 적립하여야 함<\/p>\n<p class=\"l2\">- 연중 합의 퇴직자 등에 대한 퇴직급여 지급으로 적립금이 감소하여, 9월 적립금 평가액이 118,332,715천원으로 2026년 최소 적립금 119,848,833천원에 미달(적립비율 약 98.75%)<\/p>\n<p class=\"l2\">- 이에 따라 최소적립금 100% 충족에 필요한 부족액 1,516,118천원을 제1회 추가경정예산으로 확보 필요<\/p>\n<h4>추경예산편성 내역<\/h4>\n<p class=\"unit\">(단위: 천원)<\/p>\n<div class=\"tw\"><table><tr><td class=\"th\">세부사업<\/td><td class=\"th\">사업세부내역<\/td><td class=\"th\">추경예산(A)<\/ ", "summary": "○ 부서자산취득비는 ｢광주광역시 교육비특별회계 소관 물품관리 조례｣를 근거로 내용연수가 경과한 노후 비품을 교체하여 업무 효율성을 높이고 파손된 비품을 교체하여 원활한 업무 추진을 도모하고자 함.    ※컴퓨터 3대(대당 1,500천원), 모니터 3대(대당 280천원)", "body": "<h4>답변요지<\/h4>\n<ul class=\"summary\"><li>부서자산취득비는 ｢광주광역시 교육비특별회계 소관 물품관리 조례｣를 근거로 내용연수가 경과한 노후 비품을 교체하여 업무 효율성을 높이고 파손된 비품을 교체하여 원활한 업무 추진을 도모하고자 함.<\/li><li>※컴퓨터 3대(대당 1,500천원), 모니터 3대(대당 280천원)<\/li><\/ul>\n<h4>현 황<\/h4>\n<div class=\"tw\"><table><tr><td rowspan=\"3\" class=\"th\">구분<\/td><td rowspan=\"3\" class=\"th\">내용연수<\/td><td colspan=\"3\" class=\"th\">연도<\/td><\/tr><tr><td class=\"n\">2020<\/td><td class=\"n\">2021<\/td><td class=\"n\">2022<\/td><\/tr><tr><td class=\"n\">2016<\/td><td class=\"n\">2017<\/td><td class=\"n\">2018<\/td><\/tr><tr><td>컴퓨터<\/td><td class=\"n\">5<\/td><td class=\"n\">2<\/td><td class=\"n\">14<\/td><td class=\"n\">5<\/td><\/tr><tr><td>모니터<\/td><td class=\"n\">5<\/td><td class=\"n\">6<\/td><td class=\"n\">4<\/td><td class=\"n\">5<\/td><\/tr><\/table><\/div>\n<h4>예산 증액 사유<\/h4>\n<p class=\"l1\">○ 내용연수가 경과한 노후 비품의 단계적 교체를 통한 업무 효율성 향상과 파손 비품을 교체하여 원활한 업무 추진을 위함. 1차 추경을 통해 컴퓨터, 프린터, 사무용 의자를 구입하였으며, 집행잔액 160천원과 더불어 12월 중 부서 운영에 필요한 자산 취득비 집행 예정.<\/p>\n<h4>추경예산편성 내역<\/h4>\n<p class=\"unit\">(단위: 천원)<\/p>\n<div class=\"tw\"><table><tr><td class=\"th\">세부사업<\/td><td class=\"th\">사업세부내역<\/td><td class=\"th\">추경예산(A)<\/td><td class=\"th\">기정예산(B)<\/td><td class=\"th\">합계<br>(C=A+B)<\/td><td class=\"th\">비고<\/td><\/tr><tr><td>공유재산 및 물품관리<\/td><td>유형자산<\/td><td class=\"n\">5,340<\/td><td class=\"n\">2,640<\/td><td class=\"n\">7,980<\/td><td><\/td><\/tr><\/table><\/div>\n<h4>참 고<\/h4>\n<div class=\"tw\"><table><tr><td class=\"th\">구분<\/td><td class=\"th\">자산취득<\/td><td class=\"th\">품목<\/td><td class=\"th\">집행액(천원)<\/td><td class=\"th\">비고<\/td><\/tr><tr><td>2025년<\/td><td>7건<\/td><td>컴퓨터, TV, 모니터 등<\/td><td class=\"n\">25,068<\/td><td><\/td><\/tr><tr><td>2026년<\/td><td>3건<\/td><td>프린터, 컴퓨터, 사무용의자<\/td><td class=\"n\">2,470<\/td><td><\/td><\/tr><\/table><\/div>", "text": 00천원 → 309,000천원(△63,000천원)<\/li><\/ul>\n<h4>현황<\/h4>\n<p class=\"l1\">○ (채용연계형 직무교육과정) 대한상공회의소(교육부 지정)가 전국 단위 기업과 채용을 연계하고 맞춤형 교육을 실시한 후 협약기업 취업을 연계하는 사업<\/p>\n<p class=\"l1\">○ (참여 현황)<\/p>\n<div class=\"tw\"><table><tr><td rowspan=\"2\" class=\"th\">구분<\/td><td colspan=\"2\" class=\"th\">채용연계형 직무교육과정 참여 인원(명)<\/td><td rowspan=\"2\" class=\"th\">집행(예정)액<br>(천원)<\/td><td rowspan=\"2\" class=\"th\">비고(기준)<\/td><\/tr><tr><td>계획<\/td><td>교육완료 및 이수예정<\/td><\/tr><tr><td>2025년<\/td><td>50명<\/td><td>25명<\/td><td class=\"n\">70,000<\/td><td class=\"n\">2026.2.1.<\/td><\/tr><tr><td>2026년<\/td><td>100명<\/td><td>80명<\/td><td class=\"n\">309,000<\/td><td class=\"n\">2026.10.30.<\/td><\/tr><\/table><\/div>\n<h4>예산 감액 사유<\/h4>\n<p class=\"l1\">○ 대한상공회의소의 지방교부금 신청(2026.10.29.)에 따라 실제 참여 인원을 반영하여 시도분담금을 309,000천원으로 확정<\/p>\n<p class=\"l1\">○ 당초 참여 예정 인원 대비 실제 참여 인원이 감소하여 시도분담금 63,000천원 감액(정리추경 반영으로 불용 최소화)<\/p>\n<h4>향후 대책<\/h4>\n<p class=\"l1\">○ ‘27년 본예산은 참여 수요를 사전 조사하여 편성하고, 직업계고 대상 사업 안내·홍보로 참여 학생 확대<\/p>\n<p class=\"l1\">○ 현장실습·취업지원 사업과 연계하여 직무교육 이수 학생의 협약기업 취업 연계율 제고<\/p>\n<h4>추경예산편성 내역<\/h4>\n<div class=\"tw\"><table><tr><td class=\"th\">세부사업<\/td><td class=\"th\">사업세부내역<\/td><td class=\"th\">추경예산<br>(A)<\/td><td class=\"th\">기정예산<br>(B)<\/td><td class=\"th\">합계<br>(C=A+B)<\/td><td class=\"th\">비고<\/td><\/tr><tr><td>취업역량강화<\/td><td>직업계고채용연계형직무교육과정지원 시도분담금<\/td><td class=\"n minus\">△63,000<\/td><td class=\"n\">372,000<\/td><td class=\"n\">309,000<\/td><td><\/td><\/tr><\/table><\/div>", "text": "‘학습중심현장실습운영지원’예산 감액 사유는?  □ 답변요지 (예산 감액) △63,000천원(기정 372,000천원 → 309,000천원) (근거) 대한상공회의소 「2026년 직업계고 채용연계형 직무교육과정 지원사업 지방교부금 신청」(상교인직-1275, 2026.10.29.) (감액사유) 채용연계형 직무교육과정 실제 참여 인원 감소에 따른 시도분담금 조정 (감액내용) 직업계고 채용연계형 직무교육과정 시도분담금 372,000천원 → 309,000천원(△63,000천원) 현황 ○ (채용연계형 직무교육과정) 대한상공회의소(교육부 지정)가 전국 단위 기업과 채용을 연계하고 맞춤형 교육을 실시한 후 협약기업 취업을 연계하는 사업 ○ (참여 현황) 구분 채용연계형 직무교육과정 참여 인원(명) 집행(예정)액 (천원) 비고(기준) 계획 교육완료 및 이수예정 2025년 50명 25명 70,000 2026.2.1. 2026년 100명 80명 309,000 2026.10.30. 예산 )<\/p>\n<div class=\"tw\"><table><tr><td class=\"th\">목<\/td><td class=\"th\">세부내역<\/td><td class=\"th\">추경예산(A)<\/td><td class=\"th\">기정예산(B)<\/td><td class=\"th\">합계<br>(C=A+B)<\/td><td class=\"th\">증감<\/td><\/tr><tr><td>민간경상보조<\/td><td>대안교육기관 운영지원비<\/td><td class=\"n minus\">-652,245<\/td><td class=\"n\">2,034,860<\/td><td class=\"n\">1,382,615<\/td><td class=\"n minus\">△652,245<\/td><\/tr><\/table><\/div>\n<p class=\"l0\">[붙임]<\/p>\n<div class=\"tw\"><table><tr><td class=\"th\"><\/td><td rowspan=\"2\" class=\"th\">겨자씨크리스챤스쿨 행정소송 관련 현황<\/td><td class=\"th\"><\/td><\/tr><tr><td><\/td><td><\/td><\/tr><tr><td colspan=\"3\">□ 기관 현황<br>◦ 설립·운영자: 겨자씨교육선교회(박종은)<br>◦ 위치(주소): 전남광주통합특별시 동구 선교로 201<br><br>□ 주요 경과<br>◦ (25.10.01.) [보도자료] ‘광주 기독교 대안교육기관 유아교육법 위반 고발’최초 보도자료 배포<br>[국민신문고] 시민단체 국민신문고 민원 접수(불법유치원 운영 및 편향적 교육 제보)<br>◦ (25.10.02.) [현장조사] 리박 동영상 관련 학교장 사실조사 확인서 징구<br>◦ (25.10.17.) [행정처분] 과태료 부과 사전통지 및 시정명령<br>◦ 과태료 부과: 변경 시설 및 미등록 시설·설비 변경등록 미이행 사유<br>◦ 시정명령: ① 미등록 6,7세반 운영 금지, ② 변경 시설 및 미등록 상태 시설·설비 현황 변경 등록, ③ 교육의 공공성 및 중립성 확보<br>◦ (25.10.20.) [합동점검] 관련부서 유아교육 실태 현장 합동 점검 실시<br>* 유치원 인허가, 불법 교육시설 점검, 유아교육 업무담당 부서 본청, 지역청 10명<br>◦ (25.10.22.) [국정감사] 겨자씨크리스챤스쿨 사안 시정명령으로 종결처리 지적<br>◦ (25.10.27.) [법률자문] 미등록 6, 7세반 운영 관련 「유아교육법」 위반 여부 법률자문 요청<br>◦ 자문요청 대상 기관: 교육청 자문 변호사(나재호, 최목, 이민아) 사무소<br>◦ (25.11.17.) [고발] 학원법, 유아교육법 위반 혐의<br>◦ (25.12.04.) [등록운영위원회] 등록취소 안건 심의(등록취소 결정)<br>◦ 사유: ① 미등록 6,7세반 운영, ② 시설 변경 등록 미실시, ③ 정치 편향적 기관 운영 우려<br>◦ (25.12.30.) [청문] 등록취소 처분 전 청문 실시<br>◦ (26.02.01.) [등록취소 처분]<br>◦ (26.02.20.) [보조금 지원 대상 제외] 2026년 보조금 지원 대상 제외(법률위반* 사유)<br>* 「광주광역시교육청 대안교육기관 지원 조례」 제8조(지원의 중단 등)<br>◦ (26.02.25.) [집행정지 인용 결정]<br>◦ (26.05.28.) [1차 변론기일]<br>◦ (26.08.06.) [2차 변론기일]<br>◦ (26.10.01.) [학원법 유죄 판결] 벌금형 200만원, 선고유예<br>◦ (26.10.현재) [행정소송 진행] 등록취소 처분에 대한 행정소송 진행중<br>※ 26.10.22. 판결 예정이었으나 27.2.4. 변론 재개 결정 통지<br><br>□ 향후 계획<br>◦ 행정소송 결과<br>◦ 1안(등록취소)<br>- 재학생 원적 학교 복귀 또는 타 대안교육기관 연계 등 학습권 보호<br>◦ 2안(등록유지)<br>- 대안교육등록기관 법적 지위 유지<br>- 2027년도 보조금 지원 검토<\/td><\/tr><\/t 관리 강화<\/li><li>※ 2024학년도 「오남용 예방 시행 대책」 수립 이후 매년 내용을 보완·개선하여 지속적인 오남용 예방 및 관리 추진<\/li><li>① (모니터링 강화) 온·오프라인 모니터링단* 상시 운영<\/li><li><b>(오프라인, 17명)<\/b> 가맹점 현장점검 및 지도<\/li><li>※ (‘26. 4월~현재) 전체 가맹점의 40% 점검 완료<\/li><li><b>(온라인, 11명)<\/b> 온라인 커뮤니티·중고거래 플랫폼 등 모니터링<\/li><li>② (제재조치 강화) 오남용 처리 기준 및 조치 사항을 지침에 반영<\/li><li><b>(사용자)<\/b> 오남용 횟수(1~3회)에 따라 사용중단, 환수, 지급 제외<\/li><li><b>(가맹점)<\/b> 경미한 경우 시정 요구·주의, 중대한 경우 가맹 제한<\/li><li>③ (제재조치 사례) 바우처 사용 중단 “1건”(‘25년 11월)<\/li><li>중고거래 플랫폼에서 바우처 카드 양도를 통한 현금화 시도<\/li><li>⇒ 바우처 카드 사용 중단 및 잔액 환수 조치<\/li><\/ul>\n<h4>(참고) 오남용 처리 기준<\/h4>\n<div class=\"tw\"><table><tr><td rowspan=\"2\" class=\"th\">위반<br>정도<\/td><td rowspan=\"2\" class=\"th\">위반 사례<br>(예시)<\/td><td colspan=\"2\" class=\"th\">조치사항<\/td><\/tr><tr><td>사용자<\/td><td>가맹점<\/td><\/tr><tr><td>중대<\/td><td>- 바우처 카드 양도·매매<br>- 현금화(선결제·중고거래 등)<br>- 고의·반복적 교육활동 목적 외<br>품목 구입·판매 등<\/td><td>(1회 위반 시) 당해연도 바우처 사용 중단 및 환수<br>(2회 위반 시) 당해연도 바우처 사용 중단 및 환수,<br>차년도 바우처 지원금액 50% 감액<br>(3회 위반 시) 당해연도 바우처 사용 중단 및 환수,<br>차년도부터 바우처 지원 대상 제외<\/td><td>가맹 제한<\/td><\/tr><tr><td>경미<\/td><td>기타 경미한 사항<\/td><td colspan=\"2\">시정 요구·주의 조치<\/td><\/tr><\/table><\/div>\n<h4>2025년 오남용 신고내용 및 조치사항<\/h4>\n<div class=\"tw\"><table><tr><td class=\"th\">구분<\/td><td class=\"th\">내용<\/td><td class=\"th\">조치 사항<\/td><\/tr><tr><td rowspan=\"2\">오남용<br>신고센터<\/td><td>에어팟 구매(2건)<\/td><td>에어팟은 교육용 물품으로 구매 가능한 품목<\/td><\/tr><tr><td>에어팟 중고거래(2건)<\/td><td>확인 불가(게시물 삭제)<\/td><\/tr><tr><td rowspan=\"5\">언론 보도<\/td><td>물품구매 후 중고거래<br>(1건)<\/td><td>확인 불가(게시물 삭제)<\/td><\/tr><tr><td>선결제 후 현금 환급<br>(1건)<\/td><td>가맹점 확인 불가<\/td><\/tr><tr><td>선결제 후 포인트 적립<br>(2건)<\/td><td rowspan=\"2\">가맹점 정보가 특정되지 않은 경우, 확인 불가<br>가맹점 현장 조사 결과, 부정사용 정황 확인되지 않음<br>일부 가맹점 결제 방식 특성상 확인 절차 미흡<br>전체 가맹점 대상 유의사항 안내 및 오남용 예방 협조 요청<\/td><\/tr><tr><td>교육목적 외 품목 구매<br>(6건)<\/td><\/tr><tr><td>단순 질의<br>(4건)<\/td><td>- 학생·학부모 대상 바우처 사용 기준 교육·안내<br>정보 전달 및 소통 강화를 위한 공식 누리집 개설(‘26.3월)<\/td><\/tr><tr><td>국민신문고<\/td><td>바우처 카드 양도·매매<br>(1건)<\/td><td>바우처 포인트 중단 및 잔액 환수 조치<\/td><\/tr><\/table><\/div>\n<p class=\"note\">※ (2026년) 바우처 오남용 신고 및 조치 사례 없음<\/p>\n<h4>가맹점 현장점검 현황 [2026. 11. 10. 기준] <span class=\"unit\">(단위: 개)<\/span><\/h4>\n<div class=\"tw\"><table><tr><td class=\"th\">구분<\/td><td class=\"th\">기간<\/td><td class=\"th\">총 가맹점 수<\/td><td class=\"th\">점검 가맹점 수<\/td><td class=\"th\">점검률<\/td><td class=\"th\">비고<\/td><\/tr><tr><td>2025학년도<\/td><td>2025. 5.~2026. 2.<\/td><td class=\"n\">1,368<\/td><td class=\"n\">783<\/td><td class=\"n\">57%<\/td><td><\/td><\/tr><tr><td>2026학년도<\/td><td>2026. 4.~현재<\/td><td class=\"n\">1,212<\/td><td class=\"n\">490<\/td><td class=\"n\">40%<\/td><td>진행 중<\/td><\/tr><\/table><\/div>\n<p class=\"note\">※ (`25년) 사용 빈도가 많은 가맹점 우선 점검, (`26년) 전년도 미점검 가맹점 우선 점검<\/p>\n<p class=\"l1\">⇒ 26. 11월 현재 전체 가맹점에 대해 평균 1회 점검 완료함<\/p>\n<h4>연도별 오남용 관리 방안<\/h4>\n<p class=\"l1\">○ (2024학년도) 「꿈드리미 바우처 카드 오남용 예방 시행 대책」 수립<\/p>\n<p class=\"l1\">⇒ 학생·학부모·가맹업체 안내, 현장 지도·점검, 환수 및 가맹 제한 조치<\/p>\n<p class=\"l1\">○ (2025학년도) 「꿈드리미 오남용 관리 매뉴얼」 수립·시행<\/p>\n<p class=\"l1\">⇒ (신규) 모니터링단 구성·운영, 오남용 신고센터 운영, 중고거래 플랫폼(당근마켓 등) 거래 금지 품목 추가, 분기별 가맹업체 현황 정비<\/p>\n<p class=\"l1\">○ (2026학년도) 「꿈드리미 오남용 관리 계획」 수립·시행<\/p>\n<p class=\"l1\">⇒ (개선) 모니터링단 확대(오프라인 17명, 온라인 11명), 오남용 처리 기준 구체화 및 중대 위반 시 제재조치 강화, 온라인 커뮤니티(중고거래 플랫폼, 맘카페 등) 상시 모니터링<\/p>", "text": "꿈드리미 바우처 오남용 관리 현황은?  답변요지 (관리 현황) 「꿈드리미 오남용 관리 계획」을 수립하여 오남용 관리 강화 ※ 2024학년도 「오남용 예방 시행 대책」 수립 이후 매년 내용을 보완·개선하여 지속적인 오남용 예방 및 관리 추진 ① (모니터링 강화) 온·오프라인 모니터링단* 상시 운영 (오프라인, 17명) 가맹점 현장점검 및 지도 ※ (‘26. 4월~현재) 전체 가맹점의 40% 점검 완료 (온라인, 11명) 온라인 커뮤니티·중고거래 플랫폼 등 모니터링 ② (제재조치 강화) 오남용 처리 기준 및 조치 사항을 지침에 반영 (사용자) 오남용 횟수(1~3회)에 따라 사용중단, 환수, 지급 제외 (가맹점) 경미한 경우 시정 요구·주의, 중대한 경우 가맹 제한 ③ (제재조치 사례) 바우처 사용 중단 “1건”(‘25년 11월) 중고거래 플랫폼에서 바우처 카드 양도를 통한 현금화 시도 ⇒ 바우처 카드 사용 중단 및 잔액 환수 조치 (참고) 오남용 처리 기준 위반 정도 위반 사례 (예시) 조치사항 사용자 가맹점 중대 - 바우처 카드 양도·매매 - 현금화(선결제·중고거래 등) - 고의·반복적 교육활동 목적 외 품목 구입·판매 등 (1회 위반 시) 당해연도 바우처 사용 중단 및 환수 (2회 위반 시) 당해연도 바우처 사용 중단 및 환수, 차년도 바우처 지원금액 50% 감액 (3회 위반 시) 당해연도 바우처 사용 중단 및 환수, 차 =\"l2\">- (광주청사) △113,400천원<\/p>\n<p class=\"note\">* 학교복합시설(대촌중앙초)<\/p>\n<p class=\"l1\">한국교육개발원의 사전기획용역 지원 사업 선정에 따라 기편성된 용역비 감액 △40,000천원<\/p>\n<p class=\"note\">* 공공건축물그린리모델링(송정다가치문화도서관)<\/p>\n<p class=\"l1\">도시공원관리계획 변경 비대상 회신에 따른 용역비 감액 △20,000천원<\/p>\n<p class=\"note\">* 방화셔터교체(운남고 등 4교)<\/p>\n<p class=\"l1\">방화셔터 교체 기준 개정을 적용한 제품 개발 지연 △43,400천원<\/p>\n<p class=\"note\">* 시설사업추진지원<\/p>\n<p class=\"l1\">교류국 현장여건 변화에 따른 유휴책걸상 운송비 미집행 △10,000천원<\/p>\n<p class=\"l2\">- (서부) △254,670천원<\/p>\n<p class=\"note\">* 봉산유 기타내부환경개선(손끼임방지)<\/p>\n<p class=\"l1\">학교 요청에 따른 사업비 감액 △15,000천원<\/p>\n<p class=\"note\">* 무학초 내부창호보수<\/p>\n<p class=\"l1\">학교 자체 보수에 따른 사업계획 변경 △77,910천원<\/p>\n<p class=\"note\">* 중(공립)3교 (승압공사)<\/p>\n<p class=\"l1\">기존 전기용량으로 수용 가능하여 승압 공사 불필요에 따른 전액 감액 △161,760천원<\/p>\n<h4>추경 증감 세부내역<\/h4>\n<p class=\"unit\">(단위: 천원)<\/p>\n<div class=\"tw\"><table><tr><td class=\"th\">구분<\/td><td class=\"th\">세부사업명<\/td><td class=\"th\">내용<\/td><td class=\"th\">요구액<\/td><td class=\"th\">비 고<\/td><\/tr><tr><td rowspan=\"20\">광주청사<\/td><td rowspan=\"2\">학교신증설<\/td><td>(가칭)광산고 신설<\/td><td class=\"n minus\">△703,029<\/td><td><\/td><\/tr><tr><td>학급증설<\/td><td class=\"n minus\">△6,444<\/td><td><\/td><\/tr><tr><td colspan=\"2\">소계<\/td><td class=\"n minus\">△709,473<\/td><td><\/td><\/tr><tr><td rowspan=\"3\">학교시설확충<\/td><td>기숙사신축(광주자동화설비마이스터고)<\/td><td class=\"n minus\">△4,655,664<\/td><td><\/td><\/tr><tr><td>다목적강당신축(광주동신여고)<\/td><td class=\"n minus\">△145,307<\/td><td><\/td><\/tr><tr><td>장애인편의시설증축<\/td><td class=\"n minus\">△7,161<\/td><td><\/td><\/tr><tr><td colspan=\"2\">소계<\/td><td class=\"n minus\">△4,808,132<\/td><td><\/td><\/tr><tr><td rowspan=\"5\">학교시설환경개선<\/td><td>그린스마트스쿨조성(평동초)<\/td><td class=\"n minus\">△200,688<\/td><td><\/td><\/tr><tr><td>학교복합시설(대촌중앙초)<\/td><td class=\"n minus\">△40,000<\/td><td><\/td><\/tr><tr><td>방화셔터교체<\/td><td class=\"n minus\">△43,400<\/td><td><\/td><\/tr><tr><td>기타내부환경개선 등 환경개선사업<\/td><td class=\"n minus\">△2,613,877<\/td><td><\/td><\/tr const items = DATA.items;
const state = {q:'', bureau:null, dept:null, type:null, kind:null, open:new Set()};
const $ = s => document.querySelector(s);
const KINDMAP = {'증액':'증액','신규':'증액','감액':'감액','증감':'증감·조정','조정':'증감·조정','미집행':'미집행','이월':'이월','반환':'기타','반영액':'감액','현황':'현황·내역','내역':'현황·내역','내용':'현황·내역','편성':'증액'};
const KINDCLS = {'증액':'k-inc','감액':'k-dec'};
items.forEach(it=>{
  it.kgroup = KINDMAP[it.kind] || '기타';
  it.tgroup = it.type.includes('세입')&&it.type.includes('세출') ? '세입·세출' : it.type.includes('세입') ? '세입' : it.type.includes('세출') ? '세출' : '요구자료 등';
  it.lc = (it.text + ' ' + it.dept + ' ' + it.bureau + ' ' + it.staff + ' ' + it.phone).toLowerCase();
});
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function terms(){return state.q.trim().toLowerCase().split(/\s+/).filter(Boolean)}

/* sidebar */
function buildSide(){
  const by = {};
  DATA.bureaus.forEach(b=>by[b]={});
  items.forEach(it=>{(by[it.bureau][it.dept] ||= []).push(it)});
  let h = `<div class="side-h"><span>국·과별 목차</span><span>${items.length}건</span></div>`;
  for(const b of DATA.bureaus){
    const n = Object.values(by[b]).reduce((a,v)=>a+v.length,0);
    h += `<div class="bureau"><button class="bt" data-b="${esc(b)}">${esc(b)}<span class="cnt">${n}</span></button>`;
    for(const d in by[b]) h += `<button class="dept" data-b="${esc(b)}" data-d="${esc(d)}">${esc(d)}<span class="cnt">${by[b][d].length}</span></button>`;
    h += `</div>`;
  }
  $('#side').innerHTML = h;
  $('#side').addEventListener('click',e=>{
    const t = e.target.closest('button'); if(!t) return;
    const b = t.dataset.b, d = t.dataset.d || null;
    if(state.bureau===b && state.dept===d){state.bureau=null;state.dept=null}
    else {state.bureau=b;state.dept=d}
    $('#side').classList.remove('show');
    render(); window.scrollTo({top:0});
  });
}
function buildChips(){
  const tOrder=['세입','세출','세입·세출','요구자료 등'], kOrder=['증액','감액','증감·조정','미집행','이월','현황·내역','기타'];
  const mk=(el,order,key,field)=>{
    order.filter(v=>items.some(i=>i[field]===v)).forEach(v=>{
      const n=items.filter(i=>i[field]===v).length;
      const b=document.createElement('button'); b.className='chip'; b.dataset.v=v; b.textContent=`${v} ${n}`;
      b.onclick=()=>{state[key]=state[key]===v?null:v; render()};
      el.appendChild(b);
    });
  };
  mk($('#fType'),tOrder,'type','tgroup'); mk($('#fKind'),kOrder,'kind','kgroup');
}
function filtered(){
  const ts = terms();
  return items.filter(it=>
    (!state.bureau||it.bureau===state.bureau)&&(!state.dept||it.dept===state.dept)&&
    (!state.type||it.tgroup===state.type)&&(!state.kind||it.kgroup===state.kind)&&
    ts.every(t=>it.lc.includes(t)));
}
function hlText(s){
  const ts=terms(); if(!ts.length) return esc(s);
  const re=new RegExp('('+ts.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  return esc(s).replace(re,'<mark>$1</mark>');
}
function hlNode(root){
  const ts=terms(); if(!ts.length) return;
  const re=new RegExp('('+ts.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); const nodes=[];
  while(w.nextNode()) if(re.test(w.currentNode.nodeValue)) nodes.push(w.currentNode);
  nodes.forEach(n=>{const span=document.createElement('span'); span.innerHTML=esc(n.nodeValue).replace(re,'<mark>$1</mark>'); n.replaceWith(...span.childNodes)});
}
function summaryHtml(it){
  if(!it.summary) return '';
  const m = it.body.match(/<ul class="summary">[\s\S]*?<\/ul>/);
  if(!m) return '';
  const tmp=document.createElement('div'); tmp.innerHTML=m[0];
  const lis=[...tmp.querySelectorAll('li')].slice(0,3);
  return '<ul>'+lis.map(li=>`<li>${li.innerHTML}</li>`).join('')+'</ul>';
}
function card(it){
  const tcls = it.tgroup==='세입'?'t-in':it.tgroup==='세출'?'t-out':'t-etc';
  const kcls = KINDCLS[it.kgroup]||'k-neu';
  const meta = [`${esc(it.dept)}`, it.staff?`담당 ${hlText(it.staff)}`:'', it.phone?`☎ ${esc(it.phone)}`:'', it.pages?esc(it.pages):''].filter(Boolean).join(' · ');
  return `<article class="card${state.open.has(it.id)?' open':''}" id="q${it.id}" data-id="${it.id}">
    <div class="ch"><span class="qno">질의 ${it.no}</span>
      <div><div class="qt"><span class="tag ${tcls}">${esc(it.type||'기타')}</span><span class="tag ${kcls}">${esc(it.kgroup)}</span>${hlText(it.title)}</div>
      <div class="meta">${meta}</div></div><span class="arrow">▶</span></div>
    <div class="pre">${summaryHtml(it)}</div>
    <div class="body"></div></article>`;
}
function fillBody(el){
  const it = items.find(i=>i.id==el.dataset.id);
  const b = el.querySelector('.body');
  b.innerHTML = it.body + `<div class="cfoot"><button data-act="copy">답변요지 복사</button><button data-act="link">이 질의 링크 복사</button><button data-act="close">접기</button></div>`;
  hlNode(b); hlNode(el.querySelector('.pre'));
}
function render(){
  const list = filtered();
  document.querySelectorAll('#side button').forEach(b=>b.classList.toggle('on', b.dataset.b===state.bureau && (b.dataset.d||null)===state.dept));
  document.querySelectorAll('.chip').forEach(c=>{const p=c.parentElement.id==='fType'?'type':'kind'; c.classList.toggle('on',state[p]===c.dataset.v)});
  const conds=[state.dept||state.bureau, state.type, state.kind, state.q.trim()&&`“${state.q.trim()}”`].filter(Boolean);
  $('#status').innerHTML = `전체 ${items.length}건 중 <b>${list.length}건</b>` + (conds.length?` · ${esc(conds.join(' / '))} <button class="reset" id="reset">조건 초기화</button>`:'');
  const r=$('#reset'); if(r) r.onclick=()=>{Object.assign(state,{q:'',bureau:null,dept:null,type:null,kind:null}); $('#q').value=''; syncClr(); render()};
  if(!list.length){$('#list').innerHTML='<div class="empty">조건에 맞는 질의가 없습니다. 검색어를 줄이거나 조건을 초기화해 보세요.</div>'; return}
  let h='', lastKey='';
  for(const it of list){
    const key=it.bureau+'|'+it.dept;
    if(key!==lastKey){h+=`<div class="grp">${esc(it.dept)} <span>${esc(it.bureau)}</span></div>`; lastKey=key}
    h+=card(it);
  }
  $('#list').innerHTML=h;
  document.querySelectorAll('.card.open').forEach(fillBody);
  if(state.q.trim()) document.querySelectorAll('.card:not(.open) .pre').forEach(hlNode);
}
$('#list').addEventListener('click',e=>{
  const c=e.target.closest('.card'); if(!c) return;
  const act=e.target.closest('[data-act]');
  const it=items.find(i=>i.id==c.dataset.id);
  if(act){
    if(act.dataset.act==='close'){toggle(c,false); c.scrollIntoView({block:'nearest'}); return}
    if(act.dataset.act==='copy'){const lis=[...c.querySelectorAll('.body ul.summary li')].map(li=>'○ '+li.textContent.trim()); copy(`[${it.dept}] ${it.title}\n`+lis.join('\n'), '답변요지를 복사했습니다'); return}
    if(act.dataset.act==='link'){location.hash='q'+it.id; copy(location.href,'링크를 복사했습니다 (공유 화면에서는 주소가 다를 수 있습니다)'); return}
  }
  if(e.target.closest('.ch')||e.target.closest('.pre')) toggle(c);
});
function toggle(c,force){
  const id=+c.dataset.id, open = force===undefined ? !state.open.has(id) : force;
  if(open){state.open.add(id); c.classList.add('open'); fillBody(c)} else {state.open.delete(id); c.classList.remove('open')}
}
function copy(text,msg){
  (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast(msg)).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy'); toast(msg)}catch(e){toast('복사하지 못했습니다')} ta.remove();
  });
}
let tt; function toast(m){const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1800)}
let deb;
function syncClr(){const v=$('#q').value; $('#clr').style.display=v?'block':'none'; $('#kbd').style.display=v?'none':''}
$('#q').addEventListener('input',e=>{syncClr(); clearTimeout(deb); deb=setTimeout(()=>{state.q=e.target.value; render()},120)});
$('#clr').onclick=()=>{$('#q').value=''; state.q=''; syncClr(); render(); $('#q').focus()};
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault(); $('#q').focus()}
  if(e.key==='Escape'&&document.activeElement===$('#q')){$('#q').value=''; state.q=''; syncClr(); render()}
});
$('#openAll').onclick=()=>{filtered().forEach(i=>state.open.add(i.id)); render()};
$('#closeAll').onclick=()=>{state.open.clear(); render()};
$('#menuBtn').onclick=()=>$('#side').classList.toggle('show');
function fromHash(){
  const m=location.hash.match(/^#q(\d+)$/); if(!m) return;
  const id=+m[1]; state.open.add(id); render();
  const el=document.getElementById('q'+id); if(el) el.scrollIntoView({block:'start'});
}
buildSide(); buildChips(); render(); fromHash();
window.addEventListener('hashchange',fromHash);
</script>
</body>
</html>
