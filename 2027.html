<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c1f">
<title>2027 전남광주교육 주요업무계획</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#070c1f; --bg2:#0b1330; --panel:rgba(18,28,64,.62); --panel2:rgba(24,37,82,.72);
  --line:rgba(140,170,255,.14); --line2:rgba(140,170,255,.26);
  --tx:#eef2ff; --tx2:#b6c1e3; --tx3:#7f8bb3;
  --cy:#45d4ff; --vi:#9b8cff; --grad:linear-gradient(90deg,#45d4ff 0%,#7aa8ff 45%,#a58bff 100%);
  --c1:#5b8cff; --c2:#ff9b4a; --c3:#36d69a; --c4:#3cc2f5; --c5:#b28cff;
  --r:18px; --nav:64px;
  --f:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --fn:"Space Grotesk","Pretendard Variable",Pretendard,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:16px;line-height:1.65;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(900px 520px at 85% -10%,rgba(155,140,255,.20),transparent 60%),
  radial-gradient(800px 520px at -10% 10%,rgba(69,212,255,.14),transparent 60%),
  radial-gradient(700px 600px at 50% 120%,rgba(91,140,255,.12),transparent 60%),var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(140,170,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(140,170,255,.06) 1px,transparent 1px);
  background-size:44px 44px;mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.35) 70%,transparent 100%)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--fn)}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.kicker{font-size:12.5px;letter-spacing:.32em;color:var(--cy);font-weight:600;text-transform:uppercase}
.kicker b{color:var(--tx3);font-weight:400;margin:0 .5em}

/* ── top bar ── */
.top{position:sticky;top:0;z-index:40;height:60px;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:rgba(7,12,31,.78);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font:700 13px var(--fn);color:#071029;flex:none}
.brand .t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .t small{display:block;font-size:11px;color:var(--tx3);font-weight:500;letter-spacing:.02em}
.sbtn{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 10px;border:1px solid var(--line2);border-radius:12px;background:rgba(255,255,255,.04);color:var(--tx2);font-size:14px;min-width:0}
.sbtn:hover{border-color:var(--cy);color:var(--tx)}
.sbtn kbd{font:500 11px var(--fn);border:1px solid var(--line2);border-radius:6px;padding:1px 6px;color:var(--tx3)}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.ibtn:hover{border-color:var(--line2)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--grad);width:0;transition:width .1s}

/* ── layout ── */
.shell{display:grid;grid-template-columns:1fr;max-width:1320px;margin:0 auto}
.side{display:none}
main{min-width:0;padding:0 16px calc(var(--nav) + 40px + env(safe-area-inset-bottom))}
.wrap{max-width:900px;margin:0 auto}
@media(min-width:1080px){
  .shell{grid-template-columns:300px 1fr;gap:12px}
  .side{display:block;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto;padding:22px 10px 40px 18px;border-right:1px solid var(--line);scrollbar-width:thin}
  main{padding:0 28px 80px}
  .bnav{display:none!important}
  .menuBtn{display:none!important}
}
.tree .grp{margin:4px 0 10px}
.tree .ttl{font-size:11.5px;letter-spacing:.18em;color:var(--tx3);margin:16px 8px 8px;font-weight:600}
.tree a{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:10px;color:var(--tx2);font-size:14px;line-height:1.4}
.tree a:hover{background:rgba(255,255,255,.04);color:var(--tx)}
.tree a.on{background:rgba(69,212,255,.10);color:var(--tx);box-shadow:inset 2px 0 0 var(--cy)}
.tree a .n{font:600 12px var(--fn);color:var(--tx3);min-width:36px;padding-top:1px}
.tree .ind>a{font-weight:700;color:var(--tx)}
.tree .ind>a .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.tree .pol{margin-left:10px;border-left:1px solid var(--line);padding-left:6px;display:none}
.tree .ind.open .pol{display:block}
.tree .pol a{font-size:13.5px}

/* ── bottom nav ── */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(7,12,31,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--tx3)}
.bnav .on{color:var(--cy)}
.bnav svg{width:22px;height:22px}
.bnav .sch span.orb{width:44px;height:44px;margin-top:-18px;border-radius:15px;background:var(--grad);display:grid;place-items:center;color:#071029;box-shadow:0 8px 24px rgba(69,212,255,.35)}

/* ── drawer ── */
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(3,6,18,.6)}
.drawer .pane{position:absolute;top:0;bottom:0;left:0;width:min(86vw,340px);background:var(--bg2);border-right:1px solid var(--line2);overflow:auto;padding:16px 10px 40px 14px;animation:slin .22s ease}
@keyframes slin{from{transform:translateX(-30px);opacity:0}}

/* ── hero ── */
.hero{padding:34px 0 18px}
.hero h1{margin:10px 0 0;font-weight:800;line-height:1.05;letter-spacing:-.03em;font-size:clamp(40px,10.5vw,84px)}
.hero h1 .yr{font-family:var(--fn);font-weight:700;letter-spacing:-.04em}
.hero p.lead{color:var(--tx2);margin:16px 0 0;font-size:clamp(15px,3.8vw,17px);max-width:640px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0 6px}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px 10px;background:rgba(255,255,255,.025)}
.stat b{display:block;font:700 clamp(22px,6vw,30px)/1.1 var(--fn)}
.stat span{font-size:11.5px;white-space:nowrap;color:var(--tx3)}
.jump{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.jump::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;color:var(--tx2);background:rgba(255,255,255,.03);white-space:nowrap}
.chip:hover{color:var(--tx);border-color:var(--cy)}
.chip.on{background:rgba(69,212,255,.14);border-color:var(--cy);color:var(--tx)}

/* ── section ── */
.sec{padding:40px 0 8px;scroll-margin-top:70px}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.sec-h .no{font:700 12px var(--fn);color:var(--cy);letter-spacing:.2em}
.sec-h h2{margin:0;font-size:clamp(22px,5.6vw,28px);font-weight:800;letter-spacing:-.02em}
.sec-h .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.card{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:20px;backdrop-filter:blur(6px)}
.glow{position:relative;overflow:hidden}
.glow::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(69,212,255,.55),rgba(155,140,255,.25) 40%,transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}

/* vision */
.vision-slogan{font-size:clamp(20px,5.4vw,30px);line-height:1.45;font-weight:500;text-align:center;margin:6px 0 4px}
.vision-slogan em{font-style:normal;font-weight:800}
.lbl{display:inline-flex;font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--cy);border:1px solid rgba(69,212,255,.4);padding:3px 10px;border-radius:999px;margin-bottom:12px}
.prose{color:var(--tx2);font-size:15.5px;line-height:1.85}
.prose br.d{display:none}
@media(min-width:720px){.prose br.d{display:inline}}

/* wheel */
.wheel{display:grid;gap:18px;align-items:center}
@media(min-width:760px){.wheel{grid-template-columns:330px 1fr}}
.ring{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:0 auto}
.ring svg{width:100%;height:100%;overflow:visible}
.ring .core{position:absolute;inset:27%;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:800;font-size:clamp(14px,3.8vw,16px);line-height:1.35;background:radial-gradient(circle at 50% 35%,#16245a,#0b1330);border:1px solid var(--line2);box-shadow:0 0 40px rgba(69,212,255,.18) inset}
.legend{display:grid;gap:8px}
.legend a{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
.legend a:hover{border-color:var(--line2);background:rgba(255,255,255,.05)}
.legend .num{font:700 20px var(--fn);width:26px;text-align:center}
.legend .t{font-size:15px;font-weight:600}
.legend .t small{display:block;font-weight:400;color:var(--tx3);font-size:12.5px}

/* values */
.values-head{font-size:clamp(18px,4.8vw,24px);line-height:1.7;font-weight:600;margin:0 0 18px}
.values-head em{font-style:normal;font-weight:800;font-size:1.25em}
.venn{width:min(280px,72vw);margin:6px auto 18px;display:block}
.vgrid{display:grid;gap:12px}
@media(min-width:760px){.vgrid{grid-template-columns:repeat(3,1fr)}}
.vcard h3{margin:0 0 8px;font-size:20px;font-weight:800}

/* indicators */
.igrid{display:grid;gap:12px}
@media(min-width:760px){.igrid{grid-template-columns:1fr 1fr}}
.icard{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:start;transition:transform .2s,border-color .2s}
.icard:hover{transform:translateY(-2px);border-color:var(--line2)}
.icard .ph{width:76px;height:76px;border-radius:50%;overflow:hidden;border:2px solid var(--c);box-shadow:0 0 0 4px rgba(255,255,255,.03),0 0 24px color-mix(in srgb,var(--c) 35%,transparent)}
.icard .ph img{width:100%;height:100%;object-fit:cover;transform:scale(1.12)}
.icard .sub{font-size:13px;color:var(--c);font-weight:700}
.icard h3{margin:0 0 6px;font-size:22px;font-weight:800;display:flex;align-items:baseline;gap:10px}
.icard h3 .k{font:500 30px var(--fn);color:var(--c);opacity:.9;margin-left:auto}
.icard p{margin:0;color:var(--tx2);font-size:14.5px;line-height:1.8}
.icard p b{color:var(--tx);font-weight:700}
.icard .go{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--tx3);border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}
.icard .go span:last-child{color:var(--c);font-weight:600}

/* priorities */
.pgrid{display:grid;gap:12px}
.pcard{display:grid;gap:10px}
@media(min-width:760px){.pcard{grid-template-columns:230px 1fr;gap:22px}}
.pcard .pn{font:700 13px var(--fn);color:var(--pc);letter-spacing:.2em}
.pcard h3{margin:4px 0 0;font-size:23px;font-weight:800;line-height:1.35;color:var(--pc)}
.pcard p{margin:0 0 10px;color:var(--tx2)}
.pcard ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.pcard li{display:flex;gap:8px;font-weight:600}
.pcard li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pc);margin-top:10px;flex:none}
.pcard .rel{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}

/* ── indicator page ── */
.ihead{padding:30px 0 10px}
.ihead .big{font:700 clamp(64px,18vw,120px)/.9 var(--fn);color:var(--c);opacity:.95;letter-spacing:-.04em}
.ihead h1{margin:6px 0 0;font-size:clamp(28px,7vw,40px);font-weight:800;letter-spacing:-.02em}
.ihead .sub{color:var(--c);font-weight:700}
.pol{margin-top:26px}
.pol-h{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
.pol-h .id{font:700 15px var(--fn);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);padding:2px 10px;border-radius:999px}
.pol-h h2{margin:0;font-size:clamp(19px,5vw,23px);font-weight:800}
.tlist{display:grid;gap:10px}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px 16px;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.trow:hover{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:var(--panel2)}
.trow .id{font:700 14px var(--fn);color:var(--c)}
.trow .tt{font-weight:700;font-size:16px;line-height:1.45}
.trow .meta{font-size:12.5px;color:var(--tx3);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.trow svg{color:var(--tx3)}

/* badges */
.bd{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:700;white-space:nowrap;vertical-align:middle;letter-spacing:0}
.bd.p{background:rgba(69,212,255,.14);color:#7fe3ff;border:1px solid rgba(69,212,255,.35)}
.bd.d{background:rgba(155,140,255,.15);color:#c3b8ff;border:1px solid rgba(155,140,255,.38)}
.bd.e{background:rgba(255,190,80,.14);color:#ffd08a;border:1px solid rgba(255,190,80,.4)}
.bd.n{background:rgba(54,214,154,.14);color:#7cf0c3;border:1px solid rgba(54,214,154,.4)}
.bds{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px;vertical-align:middle}

/* ── task page ── */
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--tx3);padding:22px 0 0}
.crumb a:hover{color:var(--tx)}
.thead{padding:14px 0 6px}
.thead .id{font:700 clamp(30px,8vw,44px)/1 var(--fn);color:var(--c)}
.thead h1{margin:10px 0 10px;font-size:clamp(24px,6.4vw,34px);line-height:1.3;font-weight:800;letter-spacing:-.02em}
.depts{display:grid;gap:8px;margin:14px 0}
@media(min-width:720px){.depts{grid-template-columns:1fr 1fr}}
.dept{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.025);font-size:14px;color:var(--tx2)}
.dept b{flex:none;font-size:11.5px;letter-spacing:.08em;padding:2px 8px;border-radius:6px;margin-top:1px}
.dept.jn b{background:rgba(54,214,154,.16);color:#7cf0c3}
.dept.gj b{background:rgba(91,140,255,.18);color:#a9c2ff}
.goals{border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,transparent),rgba(255,255,255,.02));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);display:grid;gap:8px;margin:16px 0 8px}
.goals div{display:flex;gap:10px;font-weight:700;line-height:1.5}
.goals svg{flex:none;color:var(--c);margin-top:3px}
.blk{margin-top:26px;scroll-margin-top:76px}
.blk h3{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;font-size:18.5px;line-height:1.45;font-weight:800}
.blk h3 .ic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);margin-top:1px}
.items{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.items>li{padding:9px 12px 9px 30px;position:relative;border-radius:10px;line-height:1.6;scroll-margin-top:90px}
.items>li::before{content:"";position:absolute;left:13px;top:18px;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.items>li:hover{background:rgba(255,255,255,.03)}
.items ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.items ul li{font-size:14.5px;color:var(--tx2);padding-left:14px;position:relative}
.items ul li::before{content:"-";position:absolute;left:0;color:var(--tx3)}
.items ul li.note::before{content:""}
.items ul li.note{padding-left:0;color:var(--tx3);font-size:13.5px}
.terms{display:grid;gap:8px;margin-top:12px}
.term{display:grid;gap:4px;padding:12px 14px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--c) 45%,transparent);background:rgba(255,255,255,.02);scroll-margin-top:90px}
@media(min-width:720px){.term{grid-template-columns:190px 1fr;gap:16px}}
.term b{color:var(--c);font-size:14px;line-height:1.5}
.term span{color:var(--tx2);font-size:14px;line-height:1.7}
.qr{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:12.5px;color:var(--tx3)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:40px}
.pager a{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel);min-width:0}
.pager a:hover{border-color:var(--line2)}
.pager small{display:block;color:var(--tx3);font-size:12px}
.pager span{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager .nx{text-align:right}
.flash{animation:flash 2.2s ease}
@keyframes flash{0%,35%{background:rgba(69,212,255,.22);box-shadow:0 0 0 1px rgba(69,212,255,.6)}100%{background:transparent;box-shadow:none}}
mark{background:rgba(69,212,255,.28);color:#fff;border-radius:3px;padding:0 1px}

/* ── tables / status ── */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th,.tbl td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th{font-size:12.5px;color:var(--tx3);font-weight:600;background:rgba(255,255,255,.03)}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:#0d1538;z-index:1}
.tbl tr.sum td{font-weight:800;color:var(--tx)}
.tbl td{font-family:var(--fn);color:var(--tx2)}
.tbl td:first-child{font-family:var(--f);color:var(--tx);font-weight:600}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.asof{font-size:12px;color:var(--tx3);margin:-8px 0 10px;text-align:right}
.notes{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--tx3);display:grid;gap:4px}
.notes li::before{content:"※ ";}
.org{display:grid;gap:14px}
.org .top1{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.node{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:10px;font-weight:800;font-size:14px}
.node.sup{background:var(--grad);color:#071029;font-size:16px}
.node.dep{border:1px solid var(--line2);background:rgba(255,255,255,.04)}
.node.jn{background:rgba(54,214,154,.15);color:#8cf3cc;border:1px solid rgba(54,214,154,.4)}
.node.gj{background:rgba(91,140,255,.18);color:#b2c8ff;border:1px solid rgba(91,140,255,.45)}
.oside{display:grid;gap:10px}
@media(min-width:760px){.oside{grid-template-columns:1fr 1fr}}
.bureau{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.02)}
.bureau h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between}
.bureau h4 small{color:var(--tx3);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.05);color:var(--tx2);border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpis div{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;background:rgba(255,255,255,.025)}
.kpis b{display:block;font:700 26px/1.1 var(--fn)}
.kpis span{font-size:12px;color:var(--tx3)}
.inst{display:grid;gap:12px}
@media(min-width:760px){.inst{grid-template-columns:1fr 1fr}}
.inst ol{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-size:14px;color:var(--tx2);counter-reset:i}
.inst ol li{counter-increment:i;display:flex;gap:10px;padding:5px 0;border-bottom:1px solid rgba(140,170,255,.07)}
.inst ol li::before{content:counter(i,decimal-leading-zero);font:500 12px var(--fn);color:var(--tx3);min-width:20px;padding-top:2px}
.inst ol li small{color:var(--tx3)}
.fin{display:grid;gap:12px}
@media(min-width:760px){.fin{grid-template-columns:1fr 1fr}}
.stack{display:flex;height:16px;border-radius:999px;overflow:hidden;margin:12px 0 14px;background:rgba(255,255,255,.05)}
.stack i{display:block;height:100%}
.flist{display:grid;gap:8px;font-size:14px}
.flist div{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center}
.flist .sw{width:12px;height:12px;border-radius:4px}
.flist b{font-family:var(--fn)}
.flist small{color:var(--tx3);font-family:var(--fn)}
.ftot{font:700 28px var(--fn)}
.ftot small{font:500 13px var(--f);color:var(--tx3);margin-left:6px}

/* map */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.region{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel)}
.region h4{margin:0 0 6px;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
.region h4 small{font:600 11px var(--fn);color:var(--tx3)}
.region .cnt{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;font-size:12.5px;color:var(--tx2)}
.region .cnt span b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:10.5px;margin-right:5px;color:#071029}
.k-u{background:#ffab5c}.k-c{background:#6fe0a2}.k-m{background:#5cc8ff}.k-g{background:#c9b48f}.k-t{background:#ff8a7a}.k-a{background:#b9a2ff}
.region.gj{border-color:rgba(91,140,255,.45)}

/* index table */
.ixw{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.ixi{padding:14px 14px 4px;border-bottom:1px solid var(--line)}
.ixi h3{margin:0 0 6px;font-size:16px;display:flex;gap:8px;align-items:center}
.ixp{margin:10px 0 6px;font-size:13px;color:var(--tx3);font-weight:700}
.ixr{display:grid;grid-template-columns:44px 1fr;gap:6px 10px;padding:9px 0;border-top:1px dashed rgba(140,170,255,.1);align-items:start}
.ixr .id{font:700 12.5px var(--fn);color:var(--c);padding-top:2px}
.ixr .t{font-size:14.5px;font-weight:600}
.ixr .t:hover{color:var(--cy)}
.ixr .b{grid-column:2;display:flex;flex-wrap:wrap;gap:4px}

/* ── search overlay ── */
.sov{position:fixed;inset:0;z-index:80;display:none;background:rgba(4,7,20,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sov.open{display:block}
.spanel{position:absolute;left:50%;top:0;transform:translateX(-50%);width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;background:var(--bg2);border-left:1px solid var(--line);border-right:1px solid var(--line)}
@media(min-width:800px){.spanel{top:6vh;height:86vh;border-radius:22px;border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.5)}}
.sbar{display:flex;gap:10px;align-items:center;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.sinput{flex:1;display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.04)}
.sinput:focus-within{border-color:var(--cy);box-shadow:0 0 0 3px rgba(69,212,255,.15)}
.sinput input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:500 17px var(--f)}
.sinput input::placeholder{color:var(--tx3)}
.sclose{white-space:nowrap;font-size:14px;color:var(--tx2);padding:8px 4px}
.sfil{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}

.sfil .sep{width:1px;flex:none;background:var(--line2);margin:4px 2px}
.sres{flex:1;overflow:auto;padding:6px 10px 30px;overscroll-behavior:contain}

.sgroup>a.gh .id{font:700 12.5px var(--fn)}

.hit:hover,.hit.sel{background:rgba(255,255,255,.05);border-color:var(--line2);color:var(--tx)}
.hit .ty{display:inline-block;font-size:11px;font-weight:700;color:var(--tx3);border:1px solid var(--line2);border-radius:5px;padding:0 6px;margin-right:6px;vertical-align:1px}
.hit .ctx{display:block;font-size:12px;color:var(--tx3);margin-top:2px}
.sugg{padding:14px 6px}
.sugg h4{margin:6px 0 10px;font-size:12.5px;color:var(--tx3);letter-spacing:.12em}
.sugg .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.empty{padding:40px 10px;text-align:center;color:var(--tx3)}

.totop{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));z-index:30;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);opacity:0;pointer-events:none;transition:opacity .2s}
.totop.show{opacity:1;pointer-events:auto}
@media(min-width:1080px){.totop{bottom:24px}}
footer{color:var(--tx3);font-size:12.5px;text-align:center;padding:50px 0 10px}
.reveal{animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ───────── search ───────── */
const norm=s=>s.toLowerCase().replace(/[\s·ㆍ・\-‧∙•,.「」『』()\[\]〔〕‘’“”*]/g,'');
const DOCS=[];
function addDoc(o){o.n=norm(o.text+' '+(o.extra||''));DOCS.push(o)}
function buildIndex(){
  TASKS.forEach(t=>{const base={ind:t.ind,tid:t.id};
    addDoc({...base,ty:'과제',text:t.title,extra:t.id+' '+t.pol.title+' '+t.all.join(' '),anchor:'',bd:t.all});
    if(t.dept_jn||t.dept_gj)addDoc({...base,ty:'부서',text:[t.dept_jn&&('전남: '+t.dept_jn),t.dept_gj&&('광주: '+t.dept_gj)].filter(Boolean).join(' / '),anchor:'',bd:[]});
    t.goals.forEach(g=>addDoc({...base,ty:'목표',text:g,anchor:'',bd:[]}));
    t.secs.forEach((s,si)=>{
      if(s.h)addDoc({...base,ty:'추진내용',text:s.h,extra:s.badges.join(' '),anchor:'b'+si,bd:s.badges});
      s.items.forEach((it,ii)=>{
        addDoc({...base,ty:'세부사업',text:it.t,extra:it.b.join(' ')+' '+it.sub.map(u=>u.t).join(' '),ctx:s.h,anchor:`i${si}-${ii}`,bd:[...s.badges,...it.b],own:it.b});
      });
    });
    t.terms.forEach((x,gi)=>addDoc({...base,ty:'용어',text:x.term,extra:x.def,def:x.def,anchor:'g'+gi,bd:[]}));
  });
  IND.forEach(I=>addDoc({ind:I.n,ty:'교육지표',text:I.sub+' '+I.name,extra:I.desc.join(' '),route:'/i/'+I.n,bd:[]}));
  PLAN.forEach(d=>d.policies.forEach(p=>addDoc({ind:d.n,ty:'추진과제',text:p.id+' '+p.title,route:'/i/'+d.n,bd:[]})));
  [['기본방향',VISION.slogan.join(' ').replace(/<[^>]+>/g,''),'s-dir'],['비전',VISION.text.join(' '),'s-vis'],['인재상',VISION.talent+' '+VISION.talentText.join(' '),'s-vis'],
   ...VALUES.items.map(v=>['핵심가치 · '+v.k,v.t.join(' '),'s-val']),...PRIOR.map(P=>['역점과제 '+P.n,P.title.join(' ')+' — '+P.items.join(', '),'s-pri'])]
   .forEach(([ty,text,a])=>addDoc({ind:0,ty:'개요',label:ty,text,route:'/',hash:a,bd:[]}));
  DIRECT.forEach(x=>addDoc({ind:0,ty:'현황',label:'직속기관',text:'전남광주통합특별시교육청'+x,route:'/status',hash:'st-org',bd:[]}));
  LOCAL.forEach(x=>addDoc({ind:0,ty:'현황',label:'지역교육청',text:'전남광주통합특별시'+x+'교육지원청',route:'/status',hash:'st-org',bd:[]}));
  [...REG.jn,...REG.gj].forEach(r=>addDoc({ind:0,ty:'현황',label:'학교 분포',text:`${r[0]} — 유 ${r[1]} · 초 ${r[2]} · 중 ${r[3]} · 고 ${r[4]}${r[5]?' · 특 '+r[5]:''}${r[6]?' · 각 '+r[6]:''}`,route:'/map',bd:[]}));
}
const S={q:'',ind:0,ty:'all',bd:''};
const TYPES=[['all','전체'],['과제','과제명'],['세부사업','세부사업'],['용어','용어'],['부서','부서']];
function filtersHTML(){
  return `${['전체',1,2,3,4,5].map((n,i)=>`<button class="chip ${S.ind===i?'on':''}" data-ind="${i}">${i?`<b class="mono" style="color:${IND[i-1].hex}">${i}</b>${IND[i-1].name}`:'전체 지표'}</button>`).join('')}<span class="sep"></span>
  ${TYPES.map(([k,l])=>`<button class="chip ${S.ty===k?'on':''}" data-ty="${k}">${l}</button>`).join('')}<span class="sep"></span>
  ${[['공약','p'],['발전','d'],['역점','e'],['신규','n']].map(([k,c])=>`<button class="chip ${S.bd===k?'on':''}" data-bd="${k}"><span class="bd ${c}" style="height:18px;padding:0 6px">${k}</span></button>`).join('')}`;
}
function hlRe(tokens){const parts=tokens.filter(Boolean).map(t=>[...t].map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('[\\s·ㆍ・\\-‧∙•,.「」()\\[\\]*]*'));return parts.length?new RegExp('('+parts.join('|')+')','gi'):null}
function hl(text,re){const e=esc(text);if(!re)return e;return esc(text).replace(re,'<mark>$1</mark>')}
function snippet(text,re,max=120){if(!re||text.length<=max)return text;re.lastIndex=0;const m=re.exec(text);re.lastIndex=0;if(!m)return text.slice(0,max)+'…';const st=Math.max(0,m.index-40);return (st?'…':'')+text.slice(st,st+max)+(st+max<text.length?'…':'')}
function runSearch(){
  const raw=S.q.trim();const tokens=raw.split(/\s+/).map(norm).filter(Boolean);
  const box=$('#sres');$('#sfil').innerHTML=filtersHTML();
  if(!tokens.length&&!S.bd){box.innerHTML=suggHTML();return}
  const re=hlRe(raw.split(/\s+/).filter(Boolean).map(x=>x.replace(/[·ㆍ・\-‧∙•,.「」()\[\]*]/g,'')));
  let hits=DOCS.filter(d=>(!S.ind||d.ind===S.ind)&&(S.ty==='all'||d.ty===S.ty)&&tokens.every(t=>d.n.includes(t))&&(!S.bd||d.bd.some(b=>b.startsWith(S.bd))));
  const total=hits.length;
  const groups=new Map();hits.forEach(d=>{const k=d.tid||('x'+d.ty+(d.label||''));if(!groups.has(k))groups.set(k,[]);groups.get(k).push(d)});
  let html=`<div class="sinfo">${total?`<b style="color:var(--tx)">${total.toLocaleString()}</b>건 · ${groups.size}개 묶음`:'검색 결과가 없습니다'}${raw?` — “${esc(raw)}”`:''}</div>`;
  if(!total){html+=`<div class="empty">다른 낱말이나 띄어쓰기 없이 다시 찾아보세요.<br>예) 서논술형, 반도체, 교육활동보호</div>`;box.innerHTML=html;return}
  let shown=0;
  for(const [k,arr] of groups){ if(shown>400)break;
    if(k[0]!=='x'){const t=TMAP[k];const I=IND[t.ind-1];
      html+=`<div class="sgroup"><a class="gh" href="#/t/${t.id}" data-go="/t/${t.id}"><span class="id" style="color:${I.hex}">${t.id}</span><span>${hl(t.title,re)}</span><small>${esc(t.pol.title)}</small></a>`;
      arr.forEach(d=>{if(d.ty==='과제')return;shown++;
        const bd=(d.own||d.bd||[]).filter(b=>d.ty!=='세부사업'||true);
        const body=d.ty==='용어'?`${hl(d.text,re)}<span class="ctx">${hl(snippet(d.def,re,140),re)}</span>`:d.ty==='세부사업'?`${hl(d.text,re)}${badges(d.own)}${(()=>{const it=TMAP[d.tid].secs[+d.anchor.slice(1).split('-')[0]].items[+d.anchor.split('-')[1]];const sm=it.sub.filter(u=>re&&(re.lastIndex=0,re.test(u.t)));re&&(re.lastIndex=0);return sm.length?`<span class="ctx">${sm.slice(0,3).map(u=>'- '+hl(u.t,re)).join('<br>')}</span>`:''})()}${d.ctx?`<span class="ctx">${esc(d.ctx)}</span>`:''}`:hl(d.text,re);
        html+=`<a class="hit" href="#/t/${d.tid}" data-go="/t/${d.tid}" data-a="${d.anchor||''}"><span class="ty">${d.ty}</span>${body}</a>`});
      if(arr.every(d=>d.ty==='과제'))html+=`<a class="hit" href="#/t/${t.id}" data-go="/t/${t.id}"><span class="ty">과제</span>${t.all.map(badge).join(' ')||'세부추진과제 바로가기'}</a>`;
      html+='</div>';
    } else {
      html+=`<div class="sgroup">`;arr.forEach(d=>{shown++;html+=`<a class="hit" href="#${d.route}" data-go="${d.route}" data-h="${d.hash||''}"><span class="ty">${esc(d.label||d.ty)}</span>${hl(snippet(d.text,re,160),re)}</a>`});html+='</div>';
    }
  }
  box.innerHTML=html;
}
function suggHTML(){
  const s=['AI','반도체','기초학력','서·논술형','교육활동 보호','유보통합','다문화','늘봄','현장체험학습','학교폭력','돌봄','IB','글로컬','작은학교','5·18','행정업무 경감'];
  const d=['중등교육과','유초등교육과','진로교육과','총무과','예산복지과','감사관'];
  return `<div class="sugg"><h4>추천 검색어</h4><div class="row">${s.map(x=>`<button class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>
  <h4>부서로 찾기</h4><div class="row">${d.map(x=>`<button class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>
  <h4>표시로 찾기</h4><div class="row"><button class="chip" data-q="공약 Ⅰ-1">공약 Ⅰ-1</button><button class="chip" data-bd2="역점">역점과제 연계 전체</button><button class="chip" data-bd2="신규">신규 사업 전체</button><button class="chip" data-bd2="발전">발전과제 전체</button></div>
  <h4>검색 팁</h4><p style="color:var(--tx3);font-size:13.5px;margin:0;line-height:1.8">· 띄어쓰기와 가운뎃점(·)은 무시합니다. ‘서논술형’ = ‘서·논술형’<br>· 여러 낱말을 띄어 입력하면 모두 포함된 항목만 찾습니다. 예) <b style="color:var(--tx2)">AI 연수</b><br>· 세부사업의 하위 내용(-)과 용어 설명(*)까지 함께 검색합니다.</p></div>`;
}
let lastFocus=null;
function openSearch(q){lastFocus=document.activeElement;$('#sov').classList.add('open');document.body.style.overflow='hidden';const i=$('#q');if(q!=null){i.value=q;S.q=q}runSearch();setTimeout(()=>i.focus(),30)}
function closeSearch(){$('#sov').classList.remove('open');document.body.style.overflow='';if(lastFocus)lastFocus.focus&&lastFocus.focus()}

/* ───────── router ───────── */
let pendingAnchor=null,pendingHash=null;
function route(){
  const path=(location.hash.replace(/^#/,'')||'/').split('?')[0];
  if(!path.startsWith('/')){ // in-page anchor
    const el=document.getElementById(path);if(el)el.scrollIntoView({behavior:'smooth'});return;}
  let m,html;
  if(path==='/')html=viewHome();
  else if(path==='/status')html=viewStatus();
  else if(path==='/map')html=viewMap();
  else if(path==='/index')html=viewIndex();
  else if(m=path.match(/^\/i\/([1-5])$/))html=viewInd(+m[1]);
  else if(m=path.match(/^\/t\/(\d-\d-\d)$/))html=viewTask(m[1]);
  else html=viewHome();
  const app=$('#app');app.innerHTML=html;
  const t=(path.match(/^\/t\/(.+)$/)||[])[1];
  document.title=(t&&TMAP[t]?`${t} ${TMAP[t].title} · `:'')+'2027 전남광주교육 주요업무계획';
  markTree(path);$('#drawer').classList.remove('open');
  if($('#sov').classList.contains('open')){$('#sov').classList.remove('open');document.body.style.overflow=''}
  const tgt=pendingAnchor||pendingHash;pendingAnchor=pendingHash=null;
  if(tgt){requestAnimationFrame(()=>{const el=document.getElementById(tgt);if(el){el.scrollIntoView({block:'center'});if(el.matches('li,.term,.blk'))el.classList.add('flash')}})}
  else window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');
  if(a&&!a.closest('#sov')){const h=a.getAttribute('href').slice(1);
    if(h&&!h.startsWith('/')){e.preventDefault();const el=document.getElementById(h);if(el)el.scrollIntoView({behavior:'smooth'});else{pendingHash=h;location.hash='/'}}
  }
  const g=e.target.closest('[data-go]');
  if(g){e.preventDefault();pendingAnchor=g.dataset.a||null;pendingHash=g.dataset.h||null;closeSearch();
    const target='#'+g.dataset.go;if(location.hash===target)route();else location.hash=g.dataset.go;return}
  const c=e.target.closest('#sres [data-q]');if(c){$('#q').value=c.dataset.q;S.q=c.dataset.q;runSearch();return}
  const c2=e.target.closest('#sres [data-bd2]');if(c2){S.bd=c2.dataset.bd2;runSearch();return}
  const f=e.target.closest('#sfil .chip');
  if(f){if(f.dataset.ind!=null)S.ind=+f.dataset.ind;if(f.dataset.ty)S.ty=f.dataset.ty;if(f.dataset.bd)S.bd=S.bd===f.dataset.bd?'':f.dataset.bd;runSearch();return}
  if(e.target.closest('[data-close]'))$('#drawer').classList.remove('open');
});
$('#openSearch').onclick=()=>openSearch();$('#bnSearch').onclick=()=>openSearch();$('#closeSearch').onclick=closeSearch;
$('#sov').addEventListener('click',e=>{if(e.target.id==='sov')closeSearch()});
$('#menuBtn').onclick=()=>$('#drawer').classList.add('open');
let tmr;$('#q').addEventListener('input',e=>{S.q=e.target.value;clearTimeout(tmr);tmr=setTimeout(runSearch,90)});
$('#q').addEventListener('keydown',e=>{
  const hits=$$('#sres .hit, #sres a.gh');const cur=hits.findIndex(h=>h.classList.contains('sel'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();hits.forEach(h=>h.classList.remove('sel'));const n=hits[Math.max(0,Math.min(hits.length-1,cur+(e.key==='ArrowDown'?1:-1)))];if(n){n.classList.add('sel');n.scrollIntoView({block:'nearest'})}}
  if(e.key==='Enter'){const s=hits[cur]||hits[0];if(s){e.preventDefault();s.click()}else e.target.blur()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#sov').classList.contains('open'))closeSearch();$('#drawer').classList.remove('open')}
  if((e.key==='/'||(e.key==='k'&&(e.metaKey||e.ctrlKey)))&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();openSearch()}
});
addEventListener('scroll',()=>{const h=document.documentElement;const p=h.scrollTop/(h.scrollHeight-h.clientHeight||1);$('#prog').style.width=(p*100)+'%';$('#totop').classList.toggle('show',h.scrollTop>600)},{passive:true});
$('#totop').onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('hashchange',route);
if(innerWidth<420)$$('.hide-s').forEach(x=>x.style.display='none');
buildTree();buildIndex();route();
