<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>교육감 공약 실천계획</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: neon command-board — grid-lined night canvas, chapter banners as colored gradient slabs with big numerals, glowing status chips. Single dark look by design. */
:root{
  --bg:#070A14; --grid:rgba(90,120,210,.07);
  --panel:#0B1020; --panel2:#0F1528; --panel3:#141B31;
  --line:rgba(130,150,220,.14); --line2:rgba(130,150,220,.26);
  --ink:#F2F4FA; --ink2:#AEB6CC; --ink3:#6F7891;
  --cyan:#4FC3F7;
  --c:#7B61FF; --c2:#4B33B5;
  --new:#18A058; --cont:#4F55E0; --warn:#D3344F; --plain:#3A4256; --amber:#E07A1F;
  --mark:rgba(255,200,40,.32);
  --font:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --disp:"Exo 2","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-lg:16px; --r-md:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--bg);background-image:radial-gradient(900px 500px at 92% -8%,rgba(70,90,200,.22),transparent 60%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,44px 44px,44px 44px;color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
mark{background:var(--mark);color:#fff;border-radius:3px;padding:0 1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:76px minmax(350px,440px) 1fr;gap:16px;height:100%;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.rail{background:rgba(8,11,22,.9);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0}
.rail .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#6B4FD8,#2C6FD6);display:grid;place-items:center;margin-bottom:10px;color:#fff;box-shadow:0 0 18px rgba(107,79,216,.45)}
.rail-btn{width:52px;min-height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);transition:background .15s,color .15s,box-shadow .15s;position:relative}
.rail-btn svg{width:20px;height:20px}
.rail-btn small{font-family:var(--disp);font-size:10.5px;font-weight:700;letter-spacing:.04em;line-height:1}
.rail-btn:hover{color:var(--ink2);background:rgba(255,255,255,.04)}
.rail-btn[aria-pressed="true"]{background:linear-gradient(135deg,var(--bc,#6B4FD8),var(--bc2,#4B33B5));color:#fff;box-shadow:0 0 16px color-mix(in srgb,var(--bc,#6B4FD8) 55%,transparent)}
.rail-sep{width:28px;height:1px;background:var(--line);margin:4px 0}
.rail .grow{flex:1}

.panel{background:rgba(11,16,32,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.list-head{padding:18px 18px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase}
.crumb b{font-weight:600}
h1{font-size:22px;line-height:1.3;margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.lead{margin:-6px 0 0;color:var(--ink2);font-size:12.5px}
.search{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r-md);padding:0 12px;height:44px}
.search:focus-within{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(79,195,247,.15)}
.search svg{width:18px;height:18px;color:var(--ink3);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;outline:none;height:100%}
.search input::placeholder{color:var(--ink3)}
.search .clear{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)}
.search .clear:hover{background:rgba(255,255,255,.06)}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--ink3);border:1px solid var(--line2);border-radius:6px;padding:1px 6px}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;align-items:center}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;border-radius:8px;padding:0 11px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--panel2);border:1px solid var(--line2)}
.chip .n{font-family:var(--disp);font-size:11.5px;opacity:.75}
.chip[aria-pressed="true"]{color:#fff;border-color:transparent;background:var(--k,#4F55E0);box-shadow:0 0 12px color-mix(in srgb,var(--k,#4F55E0) 60%,transparent)}
select.chip{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 14px) 13px,calc(100% - 10px) 13px;background-size:4px 4px;background-repeat:no-repeat;max-width:180px;font-family:var(--font)}
select.chip.on{border-color:var(--cyan);color:var(--cyan)}
select.chip option{background:#0F1528;color:#F2F4FA}

.list{flex:1;overflow-y:auto;padding:12px 12px 28px;min-height:0;-webkit-overflow-scrolling:touch}
.summary{margin:0 0 14px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:84px;height:84px;position:relative}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .c b{font-size:24px;font-family:var(--disp);font-weight:800}
.ring .c span{font-size:10px;color:var(--ink3)}
.sum-r{min-width:0;display:flex;flex-direction:column;gap:6px}
.sum-r .big{font-family:var(--disp);font-size:21px;font-weight:800;letter-spacing:.01em}
.sum-r .sub{font-size:11.5px;color:var(--ink3)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}

/* chapter banner */
.group{margin-top:12px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--panel)}
.banner{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:14px 14px 14px 16px;text-align:left;color:#fff;background:linear-gradient(120deg,var(--c),var(--c2));isolation:isolate}
.banner::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px)}
.banner .bn{font-family:var(--disp);font-weight:900;font-size:34px;line-height:1;letter-spacing:-.02em;flex:none;min-width:44px}
.banner .bd{width:1px;align-self:stretch;background:rgba(255,255,255,.35);flex:none}
.banner .bt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.banner .en{font-family:var(--disp);font-size:10.5px;font-weight:700;letter-spacing:.16em;opacity:.85}
.banner .kn{font-size:15px;font-weight:800;line-height:1.3;word-break:keep-all}
.banner .pill{flex:none;background:#fff;color:var(--c2);font-weight:800;font-size:12px;border-radius:999px;padding:5px 11px;font-family:var(--disp)}
.banner svg.chev{width:16px;height:16px;flex:none;transition:transform .15s;opacity:.85}
.banner[aria-expanded="false"] svg.chev{transform:rotate(-90deg)}
.group-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--cyan);text-transform:uppercase}
.group-h .cnt{color:var(--ink2)}
.rows{display:flex;flex-direction:column}
.row{cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;text-align:left;width:100%;padding:12px 12px 12px 14px;border-top:1px solid var(--line);transition:background .15s;position:relative}
.group-h + .rows .row:first-child{border-top:0}
.row:hover{background:rgba(255,255,255,.03)}
.row[aria-current="true"]{background:color-mix(in srgb,var(--c) 14%,transparent)}
.row[aria-current="true"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c);box-shadow:0 0 10px var(--c)}
.pno{font-family:var(--disp);font-size:12.5px;font-weight:800;color:color-mix(in srgb,var(--c) 55%,#fff);white-space:nowrap;margin-top:1px;min-width:22px}
.row .ttl{font-weight:700;font-size:14px;line-height:1.45;min-width:0;word-break:keep-all;overflow-wrap:anywhere;color:var(--ink)}
.row .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--ink3);align-items:center}
.row .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--ink3)}
.row .meta .mono{color:var(--ink2)}
.row .snip{margin-top:6px;font-size:12px;color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.star{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)}
.star svg{width:16px;height:16px}
.star[aria-pressed="true"]{color:#FFC233;filter:drop-shadow(0 0 6px rgba(255,194,51,.6))}
.star:hover{background:rgba(255,255,255,.06)}
.tag{display:inline-flex;align-items:center;height:21px;border-radius:6px;padding:0 8px;font-size:11px;font-weight:800;white-space:nowrap;color:#fff;letter-spacing:.02em}
.tag.new{background:var(--new);box-shadow:0 0 10px rgba(24,160,88,.55)}
.tag.cont{background:var(--cont);box-shadow:0 0 10px rgba(79,85,224,.55)}
.tag.draft{background:var(--warn);box-shadow:0 0 10px rgba(211,52,79,.55)}
.tag.plain{background:var(--plain);color:#DDE2EE}
.tag.ghost{background:rgba(255,255,255,.16);color:#fff}
button.tag:hover{filter:brightness(1.15)}
.empty{padding:40px 16px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);font-size:15px;margin-bottom:6px}

/* detail */
.detail{position:relative}
.detail-scroll{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.d-top{position:sticky;top:0;z-index:2;background:rgba(11,16,32,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.d-bar{display:flex;align-items:center;gap:8px;color:var(--ink3);font-size:12px;padding:10px 20px 0}
.d-bar .crumbm{font-family:var(--mono);letter-spacing:.12em;color:var(--cyan);font-size:11px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.d-bar .back{display:none;width:34px;height:34px;border-radius:10px;place-items:center;color:var(--ink);margin-left:-8px}
.d-bar .back svg{width:20px;height:20px}
.d-bar .sp{flex:1}
.d-bar .iconbtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);flex:none}
.d-bar .iconbtn:hover{background:rgba(255,255,255,.06)}
.d-bar .iconbtn svg{width:17px;height:17px}
.d-hero{position:relative;margin:10px 20px 0;border-radius:var(--r-lg);padding:18px 18px 16px;display:flex;gap:18px;align-items:center;background:linear-gradient(120deg,var(--c),var(--c2));isolation:isolate;overflow:hidden}
.d-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px)}
.d-hero .bn{font-family:var(--disp);font-weight:900;font-size:52px;line-height:.9;letter-spacing:-.03em;flex:none}
.d-hero .bd{width:1px;align-self:stretch;background:rgba(255,255,255,.35);flex:none}
.d-hero .ht{min-width:0;flex:1}
.d-hero .en{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.18em;opacity:.85}
.d-title{font-size:22px;line-height:1.35;font-weight:800;letter-spacing:-.015em;margin:2px 0 0;text-wrap:balance;word-break:keep-all;color:#fff}
.d-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px 20px}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;height:28px;padding:0 11px;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink2);background:var(--panel2);border:1px solid var(--line)}
.jump button:hover{color:#fff;border-color:var(--c)}
.d-body{padding:18px 20px 48px;display:flex;flex-direction:column;gap:12px;max-width:900px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fact{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.fact span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.08em}
.fact b{display:block;font-size:15px;margin-top:3px;font-weight:700;word-break:keep-all}
.fact b.mono{font-family:var(--disp);font-size:18px;font-weight:800;color:color-mix(in srgb,var(--c) 45%,#fff)}
.fact.wide{grid-column:span 2}
.sec{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;scroll-margin-top:240px}
.sec h3{margin:0 0 12px;font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:baseline;gap:8px}
.sec h3 .num{font-family:var(--disp);font-size:13px;color:color-mix(in srgb,var(--c) 55%,#fff);font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--panel2);scroll-margin-top:240px}
.two .sec{border:0;border-radius:0;background:transparent}
.two .sec + .sec{border-left:1px solid var(--line)}
ul.b{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
ul.b li{position:relative;padding-left:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;max-width:74ch;color:#DCE1EC}
ul.b li::before{content:"";position:absolute;left:2px;top:.68em;width:6px;height:6px;border-radius:2px;background:var(--c);box-shadow:0 0 6px var(--c)}
ul.b li.l1{margin-left:16px;color:var(--ink2);font-size:13.5px}
ul.b li.l1::before{background:transparent;box-shadow:none;border:1px solid var(--ink3);width:5px;height:5px;border-radius:50%}
ul.b li.l2,ul.b li.l3{margin-left:32px;color:var(--ink2);font-size:13px}
ul.b li.l2::before,ul.b li.l3::before{width:6px;height:1px;border-radius:0;top:.8em;background:var(--ink3);box-shadow:none}
.kpis{display:flex;flex-direction:column;gap:10px}
.kpi{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;background:var(--panel)}
.kpi-h{display:flex;gap:10px;align-items:flex-start}
.kpi-h .ttl{font-weight:700;flex:1;min-width:0;word-break:keep-all}
.kpi-h .goal{text-align:right;flex:none}
.kpi-h .goal span{display:block;font-size:10.5px;color:var(--ink3)}
.kpi-h .goal b{font-family:var(--disp);font-size:19px;font-weight:800;color:color-mix(in srgb,var(--c) 45%,#fff)}
.years{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:10px}
.yr{border-radius:8px;background:var(--panel3);padding:6px 4px;text-align:center;line-height:1.25;border:1px solid transparent}
.yr.on{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 16%,var(--panel3))}
.yr small{display:block;font-size:10px;color:var(--ink3);font-family:var(--disp);font-weight:700}
.yr b{display:block;font-family:var(--disp);font-size:14px;font-weight:800}
.yr em{display:block;font-style:normal;font-size:10px;color:var(--ink3)}
.bars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end;height:160px;margin:8px 0 6px;padding-top:18px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bar i{display:block;width:100%;max-width:46px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c2));min-height:2px;box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent)}
.bar i.zero{background:var(--line2);box-shadow:none}
.bar .v{font-family:var(--disp);font-weight:700;font-size:11px;color:var(--ink2);white-space:nowrap}
.bar .y{font-family:var(--disp);font-weight:700;font-size:11.5px;color:var(--ink3)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:560px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--ink3);font-weight:700;background:var(--panel3)}
td:first-child,th:first-child{text-align:left;white-space:normal;min-width:130px}
tr.sum td{font-weight:800;color:#fff;background:color-mix(in srgb,var(--c) 10%,transparent)}
tr.grp td{color:var(--ink3);font-size:11.5px}
tr.subr td:first-child{padding-left:22px}
tr:last-child td{border-bottom:0}
.note{font-size:12px;color:var(--ink3);margin-top:8px;line-height:1.55}
.draft-box{border:1px dashed var(--line2);border-radius:var(--r-lg);padding:28px 20px;text-align:center;color:var(--ink2)}
.welcome{padding:32px 26px;display:flex;flex-direction:column;gap:16px;max-width:820px}
.welcome .eb{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--cyan)}
.welcome h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
.welcome p{margin:0;color:var(--ink2);max-width:62ch}
.chcards{display:flex;flex-direction:column;gap:10px}
.chcard{position:relative;border-radius:var(--r-lg);padding:16px 18px;text-align:left;display:flex;align-items:center;gap:16px;color:#fff;background:linear-gradient(120deg,var(--c),var(--c2));isolation:isolate;overflow:hidden}
.chcard::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px)}
.chcard:hover{filter:brightness(1.08)}
.chcard .bn{font-family:var(--disp);font-weight:900;font-size:40px;line-height:1;flex:none;min-width:56px}
.chcard .bd{width:1px;align-self:stretch;background:rgba(255,255,255,.35)}
.chcard .bt{flex:1;min-width:0}
.chcard .en{font-family:var(--disp);font-size:10.5px;font-weight:700;letter-spacing:.16em;opacity:.85}
.chcard b{display:block;font-size:16px;font-weight:800;line-height:1.35;word-break:keep-all}
.chcard .m{font-size:12px;opacity:.9;margin-top:4px}
.chcard .pill{flex:none;background:#fff;color:var(--c2);font-weight:800;font-size:12.5px;border-radius:999px;padding:6px 12px;font-family:var(--disp)}
.src{font-size:11.5px;color:var(--ink3)}

.bnav{display:none}

  {id:'Ⅴ', en:'GLOBAL CITIZEN', c:'#E0476A', c2:'#9E1F42', name:'세계시민교육의 실현', short:'세계', icon:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>'}
];
const ICON = {
  all:'<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',

  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'
};
const cvar = c => c ? `--c:${c.c};--c2:${c.c2};--bc:${c.c};--bc2:${c.c2}` : '';
const num2 = n => String(n).padStart(2,'0');
const svg = (p, sw=1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = s => document.querySelector(s);

/* storage (per-viewer conveniences only) */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('pledge.'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('pledge.'+k, JSON.stringify(v)); }catch(e){} }
};

/* money: source unit = 천원 */
function won(k){
  if (k == null) return '–';
  const eok = k / 100000;
  if (eok >= 10000){ const jo = Math.floor(eok/10000); const r = Math.round(eok - jo*10000); return jo+'조' + (r ? ' '+r.toLocaleString('ko-KR')+'억' : '') + '원'; }
  if (eok >= 1) return (eok >= 100 ? Math.round(eok).toLocaleString('ko-KR') : (Math.round(eok*10)/10).toLocaleString('ko-KR')) + '억원';
  const man = k / 10; return Math.round(man).toLocaleString('ko-KR') + '만원';
}
const thou = v => v == null ? '–' : v.toLocaleString('ko-KR');

/* prep */
const norm = s => String(s||'').toLowerCase().replace(/[\s·ㆍ・‧ˑ･∙\-–_,.()「」『』\[\]]/g,'');
const flat = arr => (arr||[]).map(x => x[1]).join(' ');
DATA.forEach(p => {
  p.budgetSum = p.budgetTotal ? p.budgetTotal[5] : null;
  p.newType = p.flags ? p.flags.new : '';
  const body = [flat(p.status), flat(p.goals), flat(p.overview), flat(p.plan), (p.kpi||[]).map(k=>k.name).join(' '), flat(p.link), flat(p.effect), flat(p.risk), (p.partners||[]).join(' ')].join(' ');
  p._head = norm([p.no+'번', p.title, p.dept, (p.tags||[]).join(' ')].join(' '));
  p._body = body; p._bodyN = norm(body);
});
const DEPTS = [...new Set(DATA.map(p=>p.dept).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));

/* state */
const S = {
  q:'', ch: store.get('ch','all'), dept:'', type:'all', sort:'no',
  fav: new Set(store.get('fav', [])), sel:null,
  collapsed: new Set(store.get('collapsed', []))
};

function terms(){ return S.q.trim().split(/\s+/).filter(Boolean); }
function matches(p){
  if (S.ch === 'fav' ? !S.fav.has(p.no) : (S.ch !== 'all' && p.chapter !== S.ch)) return false;
  if (S.dept && p.dept !== S.dept) return false;
  if (S.type !== 'all'){
    if (S.type === 'draft'){ if (!p.drafting) return false; }
    else if (p.newType !== S.type) return false;
  }
  const t = terms(); if (!t.length) return true;
  return t.every(x => { const n = norm(x); return p._head.includes(n) || p._bodyN.includes(n); });
}
function hl(text){
  let h = esc(text); const t = terms(); if (!t.length) return h;
  t.forEach(x => { const re = new RegExp('('+esc(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); h = h.replace(re,'<mark>$1</mark>'); });
  return h;
}
function snippet(p){
  const t = terms(); if (!t.length) return '';
  const headHit = t.every(x => p._head.includes(norm(x)));
  if (headHit) return '';
  const lines = [...(p.overview||[]),...(p.goals||[]),...(p.status||[]),...(p.plan||[]),...(p.effect||[]),...(p.link||[]),...(p.risk||[])].map(x=>x[1]).concat((p.kpi||[]).map(k=>k.name));
  const first = t[0].toLowerCase();
  const line = lines.find(l => l.toLowerCase().includes(first)) || lines.find(l => norm(l).includes(norm(t[0])));
  if (!line) return '';
  let s = line; const i = s.toLowerCase().indexOf(first);
  if (i > 40) s = '…' + s.slice(i-30);
  return hl(s);
}

/* rail */

  h += `<button class="rail-btn" data-ch="all" aria-pressed="${S.ch==='all'}" title="전체 ${DATA.length}개">${svg(ICON.all)}<small>전체</small></button>`;

  h += `<div class="rail-sep"></div><button class="rail-btn" style="--bc:#C98A00;--bc2:#8A5C00" data-ch="fav" aria-pressed="${S.ch==='fav'}" title="관심 공약">${svg(ICON.fav)}<small>관심</small></button><div class="grow"></div>`;

}

  h += `<button class="rail-btn" style="--bc:#C98A00;--bc2:#8A5C00" data-ch="fav" aria-pressed="${S.ch==='fav'}">${svg(ICON.fav)}<small>관심</small></button>`;

}

/* filters */
function renderFilters(){
  const base = DATA.filter(p => (S.ch==='fav' ? S.fav.has(p.no) : (S.ch==='all' || p.chapter===S.ch)));
  const c = k => k==='all' ? base.length : k==='draft' ? base.filter(p=>p.drafting).length : base.filter(p=>p.newType===k).length;
  const types = [['all','전체','#3A4256'],['신규','신규','#18A058'],['지속','지속','#4F55E0'],['draft','작성중','#D3344F']];
  let h = types.map(([k,l,col]) => `<button class="chip" style="--k:${col}" data-type="${k}" aria-pressed="${S.type===k}">${l}<span class="n">${c(k)}</span></button>`).join('');
  h += `<select class="chip${S.dept?' on':''}" id="dept" aria-label="주관부서"><option value="">주관부서 전체</option>${DEPTS.map(d=>`<option value="${esc(d)}"${S.dept===d?' selected':''}>${esc(d)} (${DATA.filter(p=>p.dept===d).length})</option>`).join('')}</select>`;

  $('#filters').innerHTML = h;

/* list */
function rowHTML(p){
  const sn = snippet(p);
  const meta = [];
  meta.push(`<span>${hl(p.dept || '주관부서 미정')}</span>`);
  if (p.drafting) meta.push(`<span class="tag draft">실천계획 작성중</span>`);
  else {
    if (p.newType) meta.push(`<span class="tag ${p.newType==='신규'?'new':'cont'}">${p.newType}</span>`);
    if (p.budgetSum != null) meta.push(`<span class="mono">${won(p.budgetSum)}</span>`);
  }
  return `<div role="listitem" style="${cvar(CHAPTERS.find(c=>c.id===p.chapter))}"><div class="row" role="button" tabindex="0" data-no="${p.no}" aria-current="${S.sel===p.no}">
    <span class="pno">${num2(p.no)}</span>
    <span style="min-width:0"><span class="ttl">${hl(p.title)}</span>
      <span class="meta">${meta.join('<span class="dot"></span>')}</span>
      ${sn ? `<span class="snip">${sn}</span>` : ''}</span>
    <button class="star" data-star="${p.no}" aria-pressed="${S.fav.has(p.no)}" aria-label="관심 공약 ${S.fav.has(p.no)?'해제':'추가'}">${svg(ICON.fav)}</button>
  </div></div>`;
}
function summaryHTML(items){
  const planned = items.filter(p=>!p.drafting);
  const total = planned.reduce((a,p)=>a+(p.budgetSum||0),0);
  const nNew = planned.filter(p=>p.newType==='신규').length, nCont = planned.filter(p=>p.newType==='지속').length, nDraft = items.length - planned.length, nOther = planned.length - nNew - nCont;
  const all = items.length || 1, C = 2*Math.PI*36;
  const seg = (n, off, col) => n ? `<circle cx="42" cy="42" r="36" fill="none" stroke="${col}" stroke-width="9" stroke-dasharray="${C*n/all} ${C}" stroke-dashoffset="${-C*off/all}"/>` : '';
  return `<div class="summary">
    <div class="ring" aria-hidden="true"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" fill="none" stroke="var(--line)" stroke-width="9"/>${seg(nNew,0,'#18A058')}${seg(nCont,nNew,'#4F55E0')}${seg(nOther,nNew+nCont,'var(--ink3)')}${seg(nDraft,nNew+nCont+nOther,'#D3344F')}</svg>
      <div class="c"><div><b>${items.length}</b><br><span>공약사업</span></div></div></div>
    <div class="sum-r"><div class="sub">연차별 소요예산 합계 (${planned.length}개 사업)</div><div class="big mono">${won(total)}</div>
      <div class="legend"><span><i style="background:#18A058"></i>신규 ${nNew}</span><span><i style="background:#4F55E0"></i>지속 ${nCont}</span>${nOther?`<span><i style="background:var(--ink3)"></i>구분 미기재 ${nOther}</span>`:''}${nDraft?`<span><i style="background:#D3344F"></i>작성중 ${nDraft}</span>`:''}</div></div>
  </div>`;
}
function renderList(){
  let items = DATA.filter(matches);
  if (S.sort === 'budget') items = items.slice().sort((a,b)=>(b.budgetSum||-1)-(a.budgetSum||-1));
  const titleMap = {all:'전체 공약사업', fav:'관심 공약'};
  const ch = CHAPTERS.find(c=>c.id===S.ch);
  $('#listTitle').textContent = ch ? `${ch.id}. ${ch.name}` : titleMap[S.ch];
  let h = '';
  if (!S.q && !S.dept && S.type==='all' && S.sort==='no' && S.ch!=='fav') h += summaryHTML(items);
  if (!items.length){
    h += S.ch==='fav' && !S.q ? `<div class="empty"><b>관심 공약이 아직 없습니다</b>목록에서 별표를 누르면 이곳에 모아 볼 수 있습니다.</div>`
      : `<div class="empty"><b>검색 결과가 없습니다</b>검색어를 줄이거나 필터를 해제해 보세요.</div>`;
  } else if (S.sort==='budget' || S.q){
    h += `<div class="group"><div class="group-h"><span>${S.q?'[ SEARCH ] 검색 결과':'[ SORT ] 예산 많은 순'}</span><span class="cnt">${items.length}건</span></div><div class="rows" role="list">${items.map(rowHTML).join('')}</div></div>`;
  } else {
    CHAPTERS.forEach(c => {
      const g = items.filter(p=>p.chapter===c.id); if (!g.length) return;
      const open = !S.collapsed.has(c.id);
      h += `<div class="group" style="${cvar(c)}"><button class="banner" data-grp="${c.id}" aria-expanded="${open}"><span class="bn">${num2(CHAPTERS.indexOf(c)+1)}</span><span class="bd"></span><span class="bt"><span class="en">${c.en}</span><span class="kn">${esc(c.name)}</span></span><span class="pill">${g.length}개</span>${svg('<path d="m6 9 6 6 6-6"/>',2.4).replace('<svg','<svg class="chev"')}</button>
        <div class="rows" role="list" ${open?'':'hidden'}>${g.map(rowHTML).join('')}</div></div>`;
    });
  }
  $('#list').innerHTML = h;
}

/* detail */
function ul(items){
  if (!items || !items.length) return '<p class="note">기재 내용 없음</p>';
  return `<ul class="b">${items.map(([l,t])=>`<li class="l${l}">${hl(t)}</li>`).join('')}</ul>`;
}
function kpiHTML(list){
  if (!list.length) return '<p class="note">기재 내용 없음</p>';
  return `<div class="kpis">${list.map(k=>{
    const yrs = Object.entries(k.years).map(([y,[a,c]])=>`<div class="yr${a?' on':''}"><small>${y}</small><b>${esc(a)||'–'}</b><em>${c?'누적 '+esc(c):'&nbsp;'}</em></div>`).join('');
    return `<div class="kpi"><div class="kpi-h"><span class="pno">${esc(k.id)}</span><span class="ttl">${hl(k.name)}</span><span class="goal"><span>최종목표</span><b>${esc(k.target)||'–'}</b> <span style="display:inline">${esc(k.unit)}</span></span></div><div class="years">${yrs}</div></div>`;
  }).join('')}</div>`;
}
function budgetHTML(p){
  const t = p.budgetTotal; if (!t) return '<p class="note">기재 내용 없음</p>';
  const max = Math.max(...t.slice(0,5).map(v=>v||0), 1);
  const bars = t.slice(0,5).map((v,i)=>`<div class="bar"><span class="v">${v?won(v):'–'}</span><i class="${v?'':'zero'}" style="height:${v? Math.max(4, v/max*100):2}%"></i><span class="y">${2026+i}</span></div>`).join('');
  let inSelf = false;
  const rows = (p.budgetRows||[]).map(([lab,vals])=>{
    const L = lab.replace(/\s/g,'');
    if (!vals.length){ inSelf = true; return `<tr class="grp"><td colspan="7">${esc(lab)}</td></tr>`; }
    const isSum = L==='계'; const cls = isSum ? 'sum' : (inSelf ? 'subr' : '');
    if (isSum) inSelf = false;
    const v = vals.concat(Array(6).fill(null)).slice(0,6);
    return `<tr class="${cls}"><td>${esc(lab)}</td>${v.map(x=>`<td>${thou(x)}</td>`).join('')}</tr>`;
  }).join('');
  return `<div class="bars" role="img" aria-label="연도별 소요예산">${bars}</div>
    <div class="tbl-wrap"><table><thead><tr><th>구분 (단위: 천원)</th><th>2026</th><th>2027</th><th>2028</th><th>2029</th><th>2030</th><th>계</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${p.budgetNote?`<p class="note">${esc(p.budgetNote)}</p>`:''}`;
}
function sec(id, title, inner, n){ return `<section class="sec" id="s-${id}"><h3>${n?`<span class="num">${n}</span>`:''}${title}</h3>${inner}</section>`; }

    ${sec('sum','정책개요',ul(p.overview),'2')}
    ${sec('plan','추진계획',ul(p.plan),'3')}
    ${sec('kpi','공약달성 확인지표',kpiHTML(p.kpi||[]),'4')}
    ${sec('bud','연차별 소요예산',budgetHTML(p)+totalNote,'5')}
    ${p.link&&p.link.length?sec('link','중앙정부 및 지자체와의 연계',ul(p.link),'6'):''}
    ${sec('eff','기대효과',ul(p.effect),p.link&&p.link.length?'7':'6')}
    ${p.risk&&p.risk.length?sec('risk','추진 시 문제점 및 대책',ul(p.risk),p.link&&p.link.length?'8':'7'):''}
    <p class="src">출처: 「Ⅴ. 공약사업별 실천 계획」 원문 ${p.page?p.page+'쪽':''} · 예산 원자료 단위 천원</p>
  </div>`;
  box.scrollTop = 0;
}
function welcomeHTML(){
  const tot = DATA.reduce((a,p)=>a+(p.budgetSum||0),0);
  const byCh = CHAPTERS.map(c=>{ const g=DATA.filter(p=>p.chapter===c.id); return {c, n:g.length, b:g.reduce((a,p)=>a+(p.budgetSum||0),0)}; });
  const maxB = Math.max(...byCh.map(x=>x.b));
  return `<div class="welcome welcome-d">
    <div class="eb">[ 00 ] OVERVIEW · ${DATA.length}개 공약사업 · 5개 분야</div>
    <h2>왼쪽 목록에서 공약을 선택하면 실천계획 전문이 여기에 표시됩니다</h2>
    <p>공약명뿐 아니라 현황, 정책개요, 확인지표, 기대효과 본문까지 검색합니다. 띄어쓰기와 가운뎃점(·)은 무시하므로 ‘학생교육기본수당’과 ‘학생 교육 기본수당’ 모두 찾을 수 있습니다.</p>
    <div class="chcards">${byCh.map((x,i)=>`<button class="chcard" style="${cvar(x.c)}" data-ch="${x.c.id}"><span class="bn">${num2(i+1)}</span><span class="bd"></span><span class="bt"><span class="en">${x.c.en}</span><b>${esc(x.c.name)}</b><span class="m">소요예산 ${won(x.b)}</span></span><span class="pill">${x.n}개</span></button>`).join('')}</div>
    <p class="src">5개 분야 소요예산 합계 ${won(tot)} (실천계획 작성중 3개 사업 제외)</p>
  </div>`;
}

/* actions */
const mq = matchMedia('(max-width:820px)');
function openP(no, push=true){
  S.sel = no; renderDetail(); renderList();
  if (mq.matches) $('#detail').classList.add('open');
  try{ if (push) history.replaceState(null,'','#p'+no); }catch(e){}
}
function closeP(){
  $('#detail').classList.remove('open');
  if (mq.matches){ S.sel = null; renderList(); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
}
function setCh(ch){
  S.ch = ch; store.set('ch', ch); S.dept = ''; renderNav(); renderFilters(); renderList(); $('#list').scrollTop = 0;
}
function toggleFav(no){
  S.fav.has(no) ? S.fav.delete(no) : S.fav.add(no); store.set('fav',[...S.fav]);
  renderList(); renderFilters(); if (S.sel===no) renderDetail();
  toast(S.fav.has(no) ? '관심 공약에 추가했습니다' : '관심 공약에서 해제했습니다');
}
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1600); }

document.addEventListener('click', e => {
  const st = e.target.closest('[data-star]'); if (st){ e.stopPropagation(); toggleFav(+st.dataset.star); return; }
  const chb = e.target.closest('[data-ch]'); if (chb){ setCh(chb.dataset.ch); if (mq.matches) closeP(); return; }
  const row = e.target.closest('.row'); if (row){ openP(+row.dataset.no); return; }
  const g = e.target.closest('[data-grp]'); if (g){ const id=g.dataset.grp; S.collapsed.has(id)?S.collapsed.delete(id):S.collapsed.add(id); store.set('collapsed',[...S.collapsed]); renderList(); return; }
  const ty = e.target.closest('[data-type]'); if (ty){ S.type = ty.dataset.type; renderFilters(); renderList(); return; }
  if (e.target.closest('[data-sort]')){ S.sort = S.sort==='no'?'budget':'no'; renderFilters(); renderList(); return; }
  const jq = e.target.closest('[data-q]'); if (jq){ $('#q').value = jq.dataset.q; S.q = jq.dataset.q; S.ch='all'; renderNav(); renderFilters(); renderList(); syncClear(); if (mq.matches) closeP(); return; }
  const j = e.target.closest('[data-jump]'); if (j){ const el = document.getElementById('s-'+j.dataset.jump); if (el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'}); return; }
  if (e.target.closest('#back')){ closeP(); return; }
  if (e.target.closest('#dStar')){ toggleFav(S.sel); return; }
  if (e.target.closest('#dLink')){
    const txt = `[공약 ${S.sel}] ${DATA.find(p=>p.no===S.sel).title} — 링크 끝에 #p${S.sel} 를 붙이면 바로 열립니다`;
    const done = ()=>toast('공약명과 바로가기 표시를 복사했습니다');
    try{ navigator.clipboard.writeText(txt).then(done, ()=>toast('#p'+S.sel+' (복사 불가 환경)')); }catch(err){ toast('#p'+S.sel); }
    return;
  }
  if (e.target.closest('#clearQ')){ $('#q').value=''; S.q=''; syncClear(); renderList(); $('#q').focus(); return; }
  if (e.target.closest('#themeBtn')){
    const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    const nx = cur==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme', nx); store.set('theme', nx); themeIcon(); return;
  }
});
document.addEventListener('keydown', e => {
  if (e.target.classList && e.target.classList.contains('row') && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); openP(+e.target.dataset.no); return; }
  if (e.key==='/' && document.activeElement !== $('#q')){ e.preventDefault(); $('#q').focus(); }
  if (e.key==='Escape'){ if ($('#detail').classList.contains('open')) closeP(); else if (S.q){ $('#q').value=''; S.q=''; syncClear(); renderList(); } }
});
document.addEventListener('change', e => { if (e.target.id==='dept'){ S.dept = e.target.value; renderFilters(); renderList(); } });
let qt; $('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(()=>{ S.q = e.target.value; syncClear(); renderList(); if (S.sel && !mq.matches) renderDetail(); }, 120); });
$('#q').addEventListener('keydown', e => { if (e.key==='Enter'){ const f = DATA.filter(matches)[0]; if (f && !mq.matches) openP(f.no); e.target.blur(); } });
function syncClear(){ $('#clearQ').hidden = !S.q; $('#kbdHint').hidden = !!S.q || mq.matches; }
function themeIcon(){ return;  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); $('#themeBtn').innerHTML = svg(cur==='dark'?ICON.sun:ICON.moon); }

/* boot */
(function(){
  
  themeIcon();
  if (!['all','fav',...CHAPTERS.map(c=>c.id)].includes(S.ch)) S.ch='all';
  renderNav(); renderFilters(); syncClear();
  const m = (location.hash||'').match(/^#p(\d{1,2})$/);
  const no = m ? +m[1] : null;
  if (no && DATA.some(p=>p.no===no)){ S.ch='all'; renderNav(); openP(no,false); }
  else { renderList(); renderDetail(); }
})();
</script>

</body></html>
