<title>전남 교직원 관사 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 좌측 조회 패널 + 우측 벡터 지도(타일 없이 읍면동 경계를 직접 그림). 폰에서는 지도 위, 패널 아래. */
:root{
  --sea:#d9e4ea; --land:#f7f8f5; --land-alt:#eef1ea; --edge:#c3cbc4; --sgg:#6f7d77;
  --bg:#fbfcfb; --panel:#ffffff; --fg:#1d2522; --muted:#5f6b66; --line:#dde3df;
  --accent:#0f6b5c; --accent-soft:#e2f0ec;
  --y1:#b23a2e; --y2:#d98a1f; --y3:#3b7fb8; --y4:#2f8f5b;
  --shadow:0 6px 24px rgba(20,40,35,.14);
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0f1a20; --land:#1b2420; --land-alt:#202a25; --edge:#34413b; --sgg:#7f9189;
  --bg:#121816; --panel:#18201d; --fg:#e4ebe7; --muted:#9aa8a1; --line:#2c3732;
  --accent:#5cc3ad; --accent-soft:#1f3a33;
  --y1:#ef7a6c; --y2:#efb056; --y3:#78b2e6; --y4:#6fcf98; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0f1a20; --land:#1b2420; --land-alt:#202a25; --edge:#34413b; --sgg:#7f9189;
  --bg:#121816; --panel:#18201d; --fg:#e4ebe7; --muted:#9aa8a1; --line:#2c3732;
  --accent:#5cc3ad; --accent-soft:#1f3a33;
  --y1:#ef7a6c; --y2:#efb056; --y3:#78b2e6; --y4:#6fcf98; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px}
.app{height:100%;display:grid;grid-template-columns:minmax(300px,380px) 1fr;}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.head{padding-block:18px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;border-bottom:1px solid var(--line);display:grid;gap:12px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--accent-soft);border-radius:8px;padding:7px 8px;min-width:0}
.stat b{display:block;font-size:16px;font-variant-numeric:tabular-nums;font-weight:700}
.stat span{font-size:11px;color:var(--muted)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters input,.filters select{width:100%;box-sizing:border-box;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)}
.filters input{grid-column:1/-1}
.filters :focus-visible,.chip:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:4px 10px 4px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="false"]{opacity:.45}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1.5px solid var(--panel);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.label{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:-4px}
.list{overflow:auto;flex:1;min-height:0;padding-block:6px 16px}
.count{font-size:12px;color:var(--muted);padding:6px 16px 4px max(16px,env(safe-area-inset-left,0px))}
.item{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:start;padding:9px 16px 9px max(16px,env(safe-area-inset-left,0px));border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.item:hover{background:var(--accent-soft)}
.item .dot{margin-top:4px}
.item .nm{font-weight:600;font-size:13.5px;min-width:0}
.item .ad{font-size:12px;color:var(--muted)}
.item .hh{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#map{height:100%;background:var(--sea);min-width:0}
.src{font-size:11px;color:var(--muted);padding:8px 16px 10px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);line-height:1.5}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:52vh auto;height:auto}
  #map{grid-row:1;height:52vh}
  aside{grid-row:2;border-right:0}
  .list{max-height:none;overflow:visible}
  .head{padding-right:max(16px,env(safe-area-inset-right,0px))}
  .legend{display:none}
}
/* --- Leaflet core (inlined) --- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:var(--font);outline-offset:1px}
.leaflet-container img,.leaflet-container svg{max-width:none!important;max-height:none!important}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-pane{z-index:400}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path{user-select:none}
.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-pane>svg path.leaflet-interactive,svg.leaflet-image-layer.leaflet-interactive path{pointer-events:visiblePainted;pointer-events:auto}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right;margin-right:10px}.leaflet-left .leaflet-control{margin-left:10px}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-bar{box-shadow:var(--shadow);border-radius:8px;overflow:hidden}
.leaflet-bar a{display:block;width:32px;height:32px;line-height:32px;text-align:center;text-decoration:none;color:var(--fg);background:var(--panel);border-bottom:1px solid var(--line);font-size:18px;font-weight:600}
.leaflet-bar a:last-child{border-bottom:0}
.leaflet-bar a.leaflet-disabled{color:var(--muted);cursor:default}
.leaflet-control-zoom-in,.leaflet-control-zoom-out{font-family:var(--font)}
.leaflet-control-attribution{display:none}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}
.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:10px;background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.leaflet-popup-content{margin:14px 16px;line-height:1.45;font-size:13px;min-height:1px}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg);background:var(--panel);box-shadow:var(--shadow)}
.leaflet-container a.leaflet-popup-close-button{position:absolute;top:4px;right:4px;width:26px;height:26px;font:20px/26px var(--font);text-align:center;color:var(--muted);text-decoration:none;border-radius:6px}
.leaflet-container a.leaflet-popup-close-button:hover{background:var(--accent-soft);color:var(--fg)}
.leaflet-tooltip{position:absolute;padding:3px 7px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:5px;white-space:nowrap;user-select:none;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.15);font-size:12px;font-weight:600}
.leaflet-tooltip-top:before,.leaflet-tooltip-bottom:before,.leaflet-tooltip-left:before,.leaflet-tooltip-right:before{display:none}
.sgg-label{background:none;border:0;box-shadow:none;color:var(--sgg);font-weight:700;font-size:12px;letter-spacing:.06em;padding:0}
/* markers & clusters */
.pin{width:14px!important;height:14px!important;margin:-7px 0 0 -7px!important;border-radius:50%;border:2px solid var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.35);box-sizing:border-box}
.cl{border-radius:50%;display:grid;place-items:center;color:var(--panel);font-weight:700;font-size:12px;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 28%,transparent),0 2px 6px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.leaflet-cluster-anim .leaflet-marker-icon,.leaflet-cluster-anim .leaflet-marker-shadow{transition:transform .3s ease-out,opacity .3s ease-in}
.leaflet-cluster-spider-leg{transition:stroke-dashoffset .3s ease-out,stroke-opacity .3s ease-in}
@media (prefers-reduced-motion:reduce){.leaflet-cluster-anim .leaflet-marker-icon,.leaflet-zoom-anim .leaflet-zoom-animated{transition:none}}
/* popup body */
.pp h3{margin:0 22px 2px 0;font-size:15px;line-height:1.3}
.pp .meta{color:var(--muted);font-size:12px;margin-bottom:8px}
.pp .addr{display:inline-block;background:var(--accent-soft);color:var(--fg);border-radius:5px;padding:2px 7px;font-size:12px;margin-bottom:8px}
.pp table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.pp th{font-weight:500;color:var(--muted);text-align:right;padding:3px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.pp td{text-align:right;padding:4px;border-bottom:1px solid var(--line);white-space:nowrap}
.pp th:nth-child(2),.pp td:nth-child(2){text-align:left}
.pp .yr{display:inline-flex;align-items:center;gap:5px}
.pp .warn{color:var(--y1)}
.pp .note{margin-top:8px;font-size:11px;color:var(--muted)}
.pp .tw{max-height:220px;overflow:auto}
.legend{background:var(--panel);color:var(--fg);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px;font-size:11.5px;display:grid;gap:4px}
.legend div{display:flex;align-items:center;gap:6px}
</style>

  </aside>
  <div id="map" role="region" aria-label="관사 위치 지도"></div>
</div>

const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const BINS=[
  {k:'y1',t:'1989년 이전',test:y=>y<=1989},
  {k:'y2',t:'1990~1999년',test:y=>y>=1990&&y<=1999},
  {k:'y3',t:'2000~2009년',test:y=>y>=2000&&y<=2009},
  {k:'y4',t:'2010년 이후',test:y=>y>=2010},
];
const fmt=n=>n.toLocaleString('ko-KR');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// derive per-item stats
DATA.items.forEach((it,i)=>{
  it.id=i;
  it.oldest=Math.min(...it.b.map(b=>b[0]));
  it.bin=BINS.findIndex(b=>b.test(it.oldest));
  it.bld=it.b.reduce((s,b)=>s+b[2],0);
  it.hh=it.b.reduce((s,b)=>s+b[3],0);
  it.idle=it.b.reduce((s,b)=>s+b[5],0);
  it.types=[...new Set(it.b.map(b=>b[1]))];
  it.ll=DATA.geo[it.a];
  it.key=(it.n+' '+it.a+' '+it.r).replace(/\s/g,'');
});

// map
const map=L.map('map',{zoomControl:true,attributionControl:false,minZoom:7,maxZoom:15,zoomSnap:.5});
const land=L.geoJSON(EMD,{style:f=>({color:css('--edge'),weight:.6,fillColor:css('--land'),fillOpacity:1}),interactive:false}).addTo(map);
const sggLine=L.geoJSON({type:'Feature',geometry:SGG},{style:()=>({color:css('--sgg'),weight:1.3,opacity:.7}),interactive:false}).addTo(map);
const labels=L.layerGroup(Object.entries(LAB).map(([s,ll])=>L.tooltip({permanent:true,direction:'center',className:'sgg-label',interactive:false}).setLatLng(ll).setContent(s))).addTo(map);
map.fitBounds(land.getBounds(),{padding:[10,10]});
map.setMaxBounds(land.getBounds().pad(.35));

function restyle(){
  land.setStyle({color:css('--edge'),fillColor:css('--land')});
  sggLine.setStyle({color:css('--sgg')});
  markers.forEach(m=>{const el=m.getElement&&m.getElement(); if(el) el.style.background=css('--'+BINS[m.it.bin].k);});
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{restyle();refreshClusters();});
new MutationObserver(()=>{restyle();refreshClusters();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

const cluster=L.markerClusterGroup({
  showCoverageOnHover:false,maxClusterRadius:42,spiderfyDistanceMultiplier:1.6,
  spiderLegPolylineOptions:{weight:1.2,color:'#7a8a84',opacity:.7},
  iconCreateFunction:c=>{const n=c.getChildCount();const s=n<10?28:n<50?34:n<150?40:46;
    return L.divIcon({html:`<div class="cl" style="width:${s}px;height:${s}px">${n}</div>`,className:'',iconSize:[s,s]});}
});
map.addLayer(cluster);

function popupHtml(it){
  const rows=it.b.slice().sort((a,b)=>a[0]-b[0]).map(b=>`<tr>
    <td><span class="yr"><span class="dot" style="background:var(--${BINS[BINS.findIndex(x=>x.test(b[0]))].k})"></span>${b[0]}</span></td>
    <td>${esc(b[1])}</td><td>${b[2]}</td><td>${b[3]}</td><td class="${b[5]?'warn':''}">${b[5]?b[5]+(b[6]?' · '+esc(b[6]):''):'-'}</td></tr>`).join('');
  const note=DATA.notes[it.a]?`<div class="note">위치 참고: ${esc(DATA.notes[it.a])} 대표점</div>`:'';
  return `<div class="pp"><h3>${esc(it.n)}</h3>
    <div class="meta">${esc(it.r)} · ${esc(it.l)} · 관사 ${it.b.length}건</div>
    <div class="addr">${esc(it.a)}</div>
    <div class="tw"><table><thead><tr><th>건축연도</th><th>형태</th><th>동수</th><th>세대수</th><th>미활용</th></tr></thead>
    <tbody>${rows}</tbody>
    ${it.b.length>1?`<tfoot><tr><td></td><td><b>계</b></td><td><b>${it.bld}</b></td><td><b>${it.hh}</b></td><td><b>${it.idle||'-'}</b></td></tr></tfoot>`:''}

}

  const m=L.marker(it.ll,{icon:L.divIcon({className:'pin',iconSize:[14,14]}),keyboard:true,title:it.n});
  m.it=it;
  m.bindTooltip(`${it.n} · ${it.hh}세대`,{direction:'top',offset:[0,-8]});
  m.bindPopup(()=>popupHtml(it),{maxWidth:340,minWidth:250,autoPanPadding:[20,20]});
  m.on('add',()=>{const el=m.getElement(); if(el) el.style.background=css('--'+BINS[it.bin].k);});
  return m;
});

// filters
const $=id=>document.getElementById(id);
const uniq=(arr)=>[...new Set(arr)];
const regionOrder=uniq(DATA.items.map(i=>i.r));
$('fRegion').innerHTML='<option value="">지역 전체</option>'+regionOrder.map(r=>`<option>${esc(r)}</option>`).join('');
const lv=uniq(DATA.items.map(i=>i.l));
$('fLevel').innerHTML='<option value="">급별 전체</option>'+lv.map(r=>`<option>${esc(r)}</option>`).join('');
const ty=uniq(DATA.items.flatMap(i=>i.types));
$('fType').innerHTML='<option value="">건물형태 전체</option>'+ty.map(r=>`<option>${esc(r)}</option>`).join('');
const yOn=BINS.map(()=>true);
$('yChips').innerHTML=BINS.map((b,i)=>`<button class="chip" id="yc${i}" aria-pressed="true" data-i="${i}"><span class="dot" style="background:var(--${b.k})"></span>${b.t}</button>`).join('');
$('yChips').addEventListener('click',e=>{const c=e.target.closest('.chip'); if(!c) return; const i=+c.dataset.i; yOn[i]=!yOn[i]; c.setAttribute('aria-pressed',yOn[i]); apply();});

let current=[];
function apply(fit){
  const q=$('q').value.replace(/\s/g,''), r=$('fRegion').value, l=$('fLevel').value, t=$('fType').value, idle=$('fIdle').value;
  current=DATA.items.filter(it=>(!q||it.key.includes(q))&&(!r||it.r===r)&&(!l||it.l===l)&&(!t||it.types.includes(t))&&(!idle||it.idle>0)&&yOn[it.bin]);
  cluster.clearLayers();
  cluster.addLayers(current.map(it=>markers[it.id]));
  $('sOrg').textContent=fmt(uniq(current.map(i=>i.n)).length);
  $('sBld').textContent=fmt(current.reduce((s,i)=>s+i.bld,0));
  $('sHh').textContent=fmt(current.reduce((s,i)=>s+i.hh,0));
  $('sIdle').textContent=fmt(current.reduce((s,i)=>s+i.idle,0));
  $('cnt').textContent=`${fmt(current.length)}개 기관·주소 · 관사 ${fmt(current.reduce((s,i)=>s+i.b.length,0))}건`;
  renderList();
  if(fit&&current.length){const b=L.latLngBounds(current.map(i=>i.ll)); map.fitBounds(b.pad(.15),{maxZoom:12});}
  try{localStorage.setItem('gwansa-f',JSON.stringify({q:$('q').value,r,l,t,idle,y:yOn}));}catch(e){}
}
function renderList(){
  const arr=current.slice().sort((a,b)=>regionOrder.indexOf(a.r)-regionOrder.indexOf(b.r)||a.a.localeCompare(b.a,'ko')||a.n.localeCompare(b.n,'ko'));
  $('list').innerHTML=arr.map(it=>`<button class="item" data-id="${it.id}">
    <span class="dot" style="background:var(--${BINS[it.bin].k})"></span>
    <span><span class="nm">${esc(it.n)}</span><br><span class="ad">${esc(it.a)} · ${esc(it.types.join('·'))}</span></span>
    <span class="hh">${it.oldest}${it.b.length>1?'~':''}<br>${it.bld}동 ${it.hh}세대</span></button>`).join('');
}
$('list').addEventListener('click',e=>{
  const b=e.target.closest('.item'); if(!b) return;
  const m=markers[+b.dataset.id];
  cluster.zoomToShowLayer(m,()=>m.openPopup());
  if(matchMedia('(max-width:760px)').matches) document.getElementById('map').scrollIntoView({behavior:'smooth'});
});
let tq; $('q').addEventListener('input',()=>{clearTimeout(tq); tq=setTimeout(()=>apply(true),200);});
['fRegion','fLevel','fType','fIdle'].forEach(id=>$(id).addEventListener('change',()=>apply(true)));
function refreshClusters(){cluster.refreshClusters();}

// legend
const lg=L.control({position:'bottomright'});
lg.onAdd=()=>{const d=L.DomUtil.create('div','legend'); d.innerHTML='<b style="font-size:11px">건축연도(기관별 최고령 건물)</b>'+BINS.map(b=>`<div><span class="dot" style="background:var(--${b.k})"></span>${b.t}</div>`).join('')+'<div><span class="cl" style="width:16px;height:16px;font-size:9px">n</span>묶음(확대 시 분리)</div>'; return d;};
lg.addTo(map);

// restore filters
try{const s=JSON.parse(localStorage.getItem('gwansa-f')||'null'); if(s){$('q').value=s.q||'';$('fRegion').value=s.r||'';$('fLevel').value=s.l||'';$('fType').value=s.t||'';$('fIdle').value=s.idle||''; (s.y||[]).forEach((v,i)=>{yOn[i]=v!==false; $('yc'+i).setAttribute('aria-pressed',yOn[i]);});}}catch(e){}
apply(false);
</script>
