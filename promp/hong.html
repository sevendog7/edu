<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홍보 일러스트 프롬프트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nanum+Pen+Script&display=swap">
<style>
/*
VOICE: 밝고 친근하지만 정돈된 공공기관 실무 도구
IDEA: 홍보 배너 한 장을 펼쳐 놓은 작업지시서, 상단은 배너 속 하늘
PICTURE: 하늘·구름·햇살 띠 위의 제목, 아래 입력 카드와 원고지처럼 정리된 프롬프트
COLOUR and TYPE: 하늘색 그라데이션 띠, 교육청 남색 기본, 주황 복사 버튼, 노란 하이라이트 / Noto Sans KR + 손글씨 한 줄
LAYOUT: 넓은 화면은 왼쪽 입력, 오른쪽 프롬프트(고정 복사 바), 좁은 화면은 위아래로 쌓기
*/
:root{color-scheme:light dark;
--bg:light-dark(#f3f7fc,#0d1323);--card:light-dark(#ffffff,#161e36);--ink:light-dark(#1a2340,#e7ecf8);--sub:light-dark(#5b6683,#a6b0ca);
--navy:light-dark(#1c2e6b,#9db8ff);--line:light-dark(#e1e8f3,#27324f);--fill:light-dark(#f5f8fd,#1c2542);
--accent:#ff6a2b;--accent2:#e5384f;--teal:#1fa595;--mark:light-dark(#fff1b8,#5a4a12);
--sky1:light-dark(#6fb8f5,#1b3263);--sky2:light-dark(#cfeaff,#2a4a86)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2));padding:clamp(32px,5vw,56px) max(5vw,16px) clamp(56px,7vw,84px)}
.hero svg.deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero-in{position:relative;max-width:1200px;margin:0 auto}
.tag{display:inline-block;padding:5px 14px 6px;border-radius:999px;background:rgba(255,255,255,.88);color:#1c2e6b;font-size:14px;font-weight:700;box-shadow:0 4px 12px rgba(28,46,107,.12)}
.hero h1{margin:14px 0 0;font-size:clamp(30px,4.6vw,48px);line-height:1.12;font-weight:900;letter-spacing:-.02em;color:#ffffff;text-shadow:0 3px 0 rgba(28,46,107,.35),0 10px 24px rgba(28,46,107,.25);text-wrap:balance}
.hero p{margin:12px 0 0;max-width:640px;color:#ffffff;font-size:16px;text-shadow:0 1px 6px rgba(28,46,107,.4)}
.hand{position:absolute;right:0;top:4px;font-family:'Nanum Pen Script',cursive;font-size:30px;color:#1c2e6b;transform:rotate(5deg);background:rgba(255,255,255,.75);padding:2px 14px;border-radius:12px}
@media(max-width:760px){.hand{display:none}}

/* layout */
.main{max-width:1200px;margin:-44px auto 0;padding:0 max(5vw,16px) 64px;position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(28,46,107,.08)}
.pad{padding:clamp(18px,2.6vw,26px)}
.head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:var(--card);font-size:14px;font-weight:900}
.head h2{margin:0;font-size:19px;font-weight:700}
.note{margin:0 0 18px 40px;color:var(--sub);font-size:14px}

/* form */
.field{margin-bottom:14px}
.field label{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700;margin-bottom:6px}
.field label small{font-weight:500;color:var(--sub);font-size:13px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--fill);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;min-height:46px;transition:border-color .15s,background .15s}
textarea{resize:vertical;min-height:88px;line-height:1.55}
input:hover,textarea:hover{border-color:color-mix(in srgb,var(--navy) 35%,var(--line))}
input:focus,textarea:focus{outline:none;border-color:var(--navy);background:var(--card);box-shadow:0 0 0 4px color-mix(in srgb,var(--navy) 16%,transparent)}
input.filled,textarea.filled{border-color:color-mix(in srgb,var(--teal) 60%,var(--line))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:inherit;font-size:13px;font-weight:500;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.chip:hover{color:var(--navy);border-color:var(--navy)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
button{font:inherit;cursor:pointer}
.btn{min-height:46px;padding:0 18px;border-radius:12px;font-size:15px;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--navy);color:var(--navy)}
.btn svg{width:18px;height:18px}
button:focus-visible{outline:3px solid color-mix(in srgb,var(--navy) 45%,transparent);outline-offset:2px}
.progress{margin-top:16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.meter{flex:1;height:8px;border-radius:99px;background:var(--fill);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),#4fc3f7);border-radius:99px;transition:width .25s}

/* prompt */
.out-card{display:flex;flex-direction:column}
@media(min-width:901px){.out-card{position:sticky;top:16px;max-height:calc(100vh - 32px)}}
.out-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:18px clamp(18px,2.6vw,26px);border-bottom:1px solid var(--line)}
.out-top .meta{font-size:13px;color:var(--sub)}
.copy{min-height:48px;padding:0 22px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 16px rgba(255,106,43,.35);transition:transform .12s,filter .12s}
.copy:hover{filter:brightness(1.05);transform:translateY(-1px)}
.copy.done{background:var(--teal);box-shadow:0 6px 16px rgba(31,165,149,.35)}
.copy svg{width:19px;height:19px}
.doc{overflow:auto;padding:22px clamp(18px,2.6vw,30px) 28px;font-size:15px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
.doc .l{margin:0;min-height:1em}
.doc .h1{font-size:19px;font-weight:900;color:var(--navy);margin:0 0 6px}
.doc .h2{font-size:16.5px;font-weight:700;color:var(--navy);margin:18px 0 4px;padding-top:14px;border-top:1px dashed var(--line)}
.doc .h3{font-size:15px;font-weight:700;color:var(--accent2);margin:10px 0 2px}
.doc .li{padding-left:1.1em;text-indent:-1.1em}
.doc .ol{padding-left:1.4em;text-indent:-1.4em}
.doc .fld{font-weight:700}
.doc mark{background:var(--mark);color:inherit;padding:1px 4px;border-radius:4px;font-weight:700}
.doc .gap{height:.6em}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:#1c2e6b;color:#fff;padding:12px 20px;border-radius:12px;font-size:15px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="hero">
<svg class="deco" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs><radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff7d6"/><stop offset=".4" stop-color="#ffe9a3" stop-opacity=".6"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient>
<g id="cl"><ellipse cx="0" cy="18" rx="80" ry="16" fill="#fff"/><circle cx="-40" cy="6" r="24" fill="#fff"/><circle cx="-8" cy="-8" r="32" fill="#fff"/><circle cx="30" cy="2" r="26" fill="#fff"/><circle cx="56" cy="12" r="16" fill="#fff"/></g></defs>
<circle cx="980" cy="40" r="170" fill="url(#sun)"/>
<use href="#cl" transform="translate(840 80) scale(.9)" opacity=".95"/>
<use href="#cl" transform="translate(1110 150) scale(.75)" opacity=".9"/>
<use href="#cl" transform="translate(640 40) scale(.5)" opacity=".7"/>
<use href="#cl" transform="translate(90 220) scale(.6)" opacity=".6"/>
<path d="M0 250 C 200 230 380 246 600 240 C 820 234 1000 222 1200 236 L1200 260 L0 260Z" fill="#9fd88a" opacity=".55"/>
<path d="M700 120 C 740 150 770 100 810 122" stroke="#fff" stroke-width="2.5" stroke-dasharray="6 7" fill="none"/>
<g transform="translate(812 118) rotate(-18)"><path d="M0 0 L30 -9 L9 9Z" fill="#fff"/><path d="M9 9 L30 -9 L12 3Z" fill="#dbe9f7"/></g>
</svg>
<div class="hero-in">
<span class="tag">ChatGPT 제미나이 이미지 생성용</span>
<h1>공공기관 정책 홍보 일러스트 프롬프트</h1>
<p>제작 정보만 채우고 복사하세요. 고정 디자인 가이드라인은 원문 그대로 들어갑니다.</p>
<span class="hand">입력하고, 복사하고, 붙여 넣기!</span>
</div>
</header>

<main class="main">
<section class="card pad" aria-labelledby="h-in">
<div class="head"><span class="num">1</span><h2 id="h-in">제작 정보 입력</h2></div>
<p class="note">비워 둔 항목은 원문의 빈칸 그대로 남습니다.</p>

<div class="field"><label for="f-topic">주제</label><input id="f-topic" data-key="주제" placeholder="예: 지역과 함께 성장하는 미래교육"></div>
<div class="field"><label for="f-copy">핵심 문구 <small>맞춤법·띄어쓰기 그대로</small></label><input id="f-copy" data-key="핵심 문구" placeholder="예: 지역과 함께 만드는 더 나은 교육"></div>
<div class="field"><label for="f-people">등장인물</label><input id="f-people" data-key="등장인물" placeholder="예: 학생, 학부모, 교직원, 지역주민">
<div class="chips" data-for="f-people"><button type="button" class="chip">학생</button><button type="button" class="chip">학부모</button><button type="button" class="chip">교직원</button><button type="button" class="chip">지역주민</button><button type="button" class="chip">어르신</button></div></div>
<div class="field"><label for="f-bg">배경</label><input id="f-bg" data-key="배경" placeholder="예: 미래형 학교, 푸른 자연, 현대적인 교육시설"></div>
<div class="field"><label for="f-ratio">비율</label><input id="f-ratio" data-key="비율" placeholder="예: 가로형 3.5:1">
<div class="chips" data-for="f-ratio" data-single="1"><button type="button" class="chip">가로형 3.5:1</button><button type="button" class="chip">가로형 16:9</button><button type="button" class="chip">정사각형 1:1</button><button type="button" class="chip">세로형 A4</button></div></div>
<div class="field"><label for="f-feat">특징 <small>추가 요청</small></label><textarea id="f-feat" placeholder="예: 중앙에는 핵심 문구를 크게 배치하고, 좌우에는 다양한 인물이 밝게 웃으며 함께하는 모습을 표현"></textarea></div>

<div class="row">
<button type="button" class="btn" id="sample"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></svg>예시 채우기</button>
<button type="button" class="btn" id="reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>입력 지우기</button>
</div>
<div class="progress"><span id="cnt">0 / 6 항목 입력</span><div class="meter" aria-hidden="true"><i id="bar"></i></div></div>
</section>

<section class="card out-card" aria-labelledby="h-out">
<div class="out-top">
<div><div class="head" style="margin:0"><span class="num">2</span><h2 id="h-out">프롬프트 전문</h2></div><div class="meta" id="meta" style="margin-left:40px"></div></div>
<button type="button" class="copy" id="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>전체 복사</span></button>
</div>
<div class="doc" id="out" tabindex="0" aria-label="프롬프트 전문"></div>
</section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
{
const BASE = `# 역할: 공공기관 정책 홍보 일러스트 전문 디자이너

너는 대한민국 공공기관의 정책 홍보 포스터, 교육 캠페인, 정책 안내 배너, 행사 홍보물 등을 전문적으로 제작하는 일러스트 디자이너다.

사용자가 입력한 제작 정보를 바탕으로 아래의 고정 디자인 가이드라인을 적용하여 고품질 홍보 일러스트를 제작한다.

## 1. 고정 디자인 가이드라인

### [일러스트 스타일]
- 밝고 따뜻하며 친근한 한국형 2D 디지털 홍보 일러스트
- 세련된 한국 웹툰과 애니메이션의 중간 느낌
- 부드럽고 깔끔한 외곽선, 섬세한 채색과 자연스러운 명암
- 인물은 호감형으로 표현하고 생동감 있는 표정과 자연스러운 동작 구현
- 과도하게 유아적이거나 만화적으로 표현하지 않고 성인도 선호할 수 있는 세련된 그림체
- 풍부하고 선명한 파스텔톤 색상 사용

### [인물 표현]
- 다양한 연령대와 개성을 가진 한국인 인물
- 자연스러운 미소와 밝고 긍정적인 표정
- 인물별 얼굴 특징과 헤어스타일을 구분하여 표현
- 역동적인 자세와 자연스러운 신체 비율
- 등장인물의 역할과 직업적 특성이 시각적으로 드러나도록 표현

### [배경 및 분위기]
- 맑고 푸른 하늘, 부드러운 흰 구름
- 싱그러운 녹색 나무와 풍성한 식물
- 현대적인 교육기관 및 공공건물
- 밝은 햇살과 따뜻하고 희망적인 분위기
- 주제에 맞는 상징물과 시각적 요소를 자연스럽게 배치
- 배경은 풍성하지만 핵심 메시지와 인물을 방해하지 않도록 구성

### [디자인 및 레이아웃]
- 사용자가 지정한 비율을 정확하게 반영
- 중앙에는 핵심 정책 메시지를 배치할 수 있는 넓은 여백 확보
- 좌우에는 인물 일러스트를 배치하여 시각적 균형 유지
- 상단과 하단에 보조 문구 및 행사 정보를 배치할 공간 확보
- 핵심 메시지가 가장 먼저 눈에 들어오는 명확한 시각적 위계
- 굵고 시원한 제목과 강조색을 활용한 전문적인 타이포그래피
- 파란색, 빨간색, 노란색 등을 활용한 선명한 포인트 컬러
- 전문적인 대한민국 공공기관 정책 홍보 디자인 수준

### [최종 품질]
- 고해상도, 정교한 디지털 페인팅
- 세련된 색채 조화와 깨끗한 마감
- 자연스러운 인체 비율과 안정적인 구도
- 완성도 높은 상업용 홍보 일러스트
- 실제 공공기관에서 사용할 수 있는 전문적인 디자인

## 2. 사용자 입력 항목

사용자가 아래 항목을 입력하면 해당 정보를 최우선으로 반영한다.

주제:
핵심 문구:
등장인물:
배경:
비율:

특징:
전문적인 공공기관 정책 홍보물로 완성해 줘.

## 3. 제작 실행 규칙

1. 사용자가 입력한 주제와 핵심 문구를 중심으로 전체 디자인 콘셉트를 구성한다.
2. 등장인물은 입력된 대상과 역할에 맞게 시각화한다.
3. 배경은 주제와 연관된 장소, 건축물, 자연환경, 상징물을 활용한다.
4. 핵심 문구는 가장 눈에 띄는 위치에 크고 선명하게 배치한다.
5. 긴 문구는 임의로 변경하거나 축약하지 않는다.
6. 입력된 문구의 맞춤법, 띄어쓰기, 숫자, 고유명사를 임의로 수정하지 않는다.
7. 별도의 지시가 없으면 좌우 인물 배치와 중앙 메시지 구성을 기본으로 한다.
8. 사용자가 특정 색상, 인물 수, 배치, 상징물 등을 지정하면 해당 지시를 우선한다.
9. 별도의 설명이나 시안 제시로 끝내지 말고 이미지 생성 도구를 이용해 완성된 이미지를 직접 제작한다.
10. 추가 정보가 부족하더라도 합리적인 디자인 요소를 활용하여 완성도를 높인다. 단, 핵심 문구나 필수 정보는 임의로 만들어내지 않는다.

## 4. 최종 제작 원칙

사용자가 입력한 내용과 고정 디자인 가이드라인을 결합하여 하나의 완성된 홍보 일러스트를 제작한다.

단순한 캐릭터 그림이 아니라 정책 메시지 전달력, 시각적 완성도, 공공기관의 신뢰감, 친근함을 동시에 갖춘 홍보 디자인을 구현한다.

별도의 이미지 스타일 지시가 없다면 항상 위에 정의된 일러스트 스타일을 유지한다.`;

const SAMPLE = {
  'f-topic': '지역과 함께 성장하는 미래교육',
  'f-copy': '지역과 함께 만드는 더 나은 교육',
  'f-people': '학생, 학부모, 교직원, 지역주민',
  'f-bg': '미래형 학교, 푸른 자연, 현대적인 교육시설',
  'f-ratio': '가로형 3.5:1',
  'f-feat': '중앙에는 핵심 문구를 크게 배치하고, 좌우에는 다양한 인물이 밝게 웃으며 함께하는 모습을 표현해 줘.'
};

const $ = (id) => document.getElementById(id);
const out = $('out'), toast = $('toast'), copyBtn = $('copy');
const inputs = [...document.querySelectorAll('input[data-key]')];
const feat = $('f-feat');
const all = [...inputs, feat];
const KEYS = inputs.map((el) => el.dataset.key);

const vals = () => {
  const v = {};
  for (const el of inputs) v[el.dataset.key] = el.value.trim();
  v['특징'] = feat.value.trim();
  return v;
};

const build = () => {
  const v = vals();
  let t = BASE;
  for (const k of KEYS) if (v[k]) t = t.replace(`\n${k}:\n`, `\n${k}: ${v[k]}\n`);
  if (v['특징']) t = t.replace('특징:\n전문적인', `특징:\n${v['특징']}\n전문적인`);
  return t;
};

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const render = () => {
  const v = vals();
  const text = build();
  const html = text.split('\n').map((line) => {
    if (line === '') return '<div class="gap"></div>';
    if (line.startsWith('### ')) return `<p class="l h3">${esc(line.slice(4))}</p>`;
    if (line.startsWith('## ')) return `<p class="l h2">${esc(line.slice(3))}</p>`;
    if (line.startsWith('# ')) return `<p class="l h1">${esc(line.slice(2))}</p>`;
    if (line.startsWith('- ')) return `<p class="l li">· ${esc(line.slice(2))}</p>`;
    if (/^\d+\.\s/.test(line)) return `<p class="l ol">${esc(line)}</p>`;
    for (const k of [...KEYS, '특징']) {
      if (line === `${k}:`) return `<p class="l fld">${esc(line)}</p>`;
      if (v[k] && k !== '특징' && line === `${k}: ${v[k]}`) return `<p class="l"><span class="fld">${esc(k)}:</span> <mark>${esc(v[k])}</mark></p>`;
    }
    if (v['특징'] && line === v['특징']) return `<p class="l"><mark>${esc(line)}</mark></p>`;
    return `<p class="l">${esc(line)}</p>`;
  }).join('');
  out.innerHTML = html;
  const n = all.filter((el) => el.value.trim()).length;
  $('cnt').textContent = `${n} / 6 항목 입력`;
  $('bar').style.width = `${(n / 6) * 100}%`;
  $('meta').textContent = `${text.length.toLocaleString('ko-KR')}자 · 원문 그대로 포함`;
  for (const el of all) el.classList.toggle('filled', !!el.value.trim());
};

const say = (msg) => {
  toast.textContent = msg; toast.classList.add('on');
  clearTimeout(say.t); say.t = setTimeout(() => toast.classList.remove('on'), 2400);
};

const doneCopy = () => {
  copyBtn.classList.add('done'); copyBtn.querySelector('span').textContent = '복사 완료';
  clearTimeout(doneCopy.t);
  doneCopy.t = setTimeout(() => { copyBtn.classList.remove('done'); copyBtn.querySelector('span').textContent = '전체 복사'; }, 2000);
  say('복사했습니다. ChatGPT 입력창에 붙여 넣으세요.');
};

copyBtn.addEventListener('click', async () => {
  const text = build();
  try { await navigator.clipboard.writeText(text); doneCopy(); return; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  if (ok) { doneCopy(); return; }
  const r = document.createRange(); r.selectNodeContents(out);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  say('전문을 선택해 두었습니다. Ctrl+C(⌘+C)로 복사하세요.');
});

for (const box of document.querySelectorAll('.chips')) {
  const target = $(box.dataset.for);
  box.addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    const word = b.textContent;
    if (box.dataset.single) { target.value = word; }
    else {
      const parts = target.value.split(',').map((s) => s.trim()).filter(Boolean);
      if (!parts.includes(word)) parts.push(word);
      target.value = parts.join(', ');
    }
    render(); target.focus();
  });
}

$('sample').addEventListener('click', () => {
  for (const [id, val] of Object.entries(SAMPLE)) $(id).value = val;
  render(); say('예시를 채웠습니다. 필요한 부분만 고치세요.');
});

$('reset').addEventListener('click', () => {
  for (const el of all) el.value = '';
  render(); say('입력을 지웠습니다.');
});

for (const el of all) el.addEventListener('input', render);
render();
}
</script>
</body>
</html>
