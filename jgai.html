<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어린이집 지도 (2026.10. 기준)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* 배치: 왼쪽 목록·필터 패널 + 오른쪽 지도, 선택한 어린이집의 세부정보는 지도 위 카드로 표시 */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#1d2a2c; --sub:#5d6b6e; --line:#dfe5e4;
  --accent:#0f6e6a; --accent-soft:#e2f1ef; --warn:#b4541a; --warn-soft:#fbeee4;
  --t-gov:#1667c5; --t-welfare:#7a4fc9; --t-corp:#0f8a8a; --t-private:#d9731a;
  --t-home:#3a9a4b; --t-work:#c7355e; --t-coop:#6b7280;
  --font:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:14px;color:var(--ink);background:var(--bg);line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:360px 1fr;height:100%}
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.head{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.head h1{margin:0;font-size:19px;letter-spacing:-.02em}
.head p{margin:4px 0 0;color:var(--sub);font-size:12.5px}
.tools{padding:12px 18px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.tools input[type=search],.tools select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12.5px}
.chip[aria-pressed=false]{opacity:.45}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.count{padding:8px 18px;font-size:12.5px;color:var(--sub);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.list{flex:1;overflow:auto;margin:0;padding:0;list-style:none}
.list li{border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;width:100%;padding:10px 18px;border:0;background:none;text-align:left}
.item:hover{background:var(--bg)}
.item[aria-current=true]{background:var(--accent-soft)}
.item .dot{margin-top:6px}
.item b{font-weight:600}
.item span{grid-column:2;color:var(--sub);font-size:12.5px}
.item .nopos{color:var(--warn)}
.empty{padding:24px 18px;color:var(--sub)}

.mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:#e6ebea}
.status{position:absolute;left:56px;top:12px;z-index:1100;max-width:min(420px,calc(100% - 130px));padding:9px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 8px rgba(20,40,40,.12);font-size:13px}
.status .bar{height:4px;margin-top:6px;border-radius:2px;background:var(--line);overflow:hidden}
.status .bar i{display:block;height:100%;width:0;background:var(--accent)}
.status.warn{background:var(--warn-soft);border-color:#eccbb0}
.status button{margin-left:6px;padding:2px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:12px}

.detail{position:absolute;right:12px;bottom:28px;z-index:1100;width:min(360px,calc(100% - 24px));padding:16px 18px;border-radius:10px;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 24px rgba(20,40,40,.18)}
.detail h2{margin:6px 30px 10px 0;font-size:18px;letter-spacing:-.02em}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;color:#fff;background:var(--c)}
.detail dl{display:grid;grid-template-columns:64px 1fr;gap:6px 10px;margin:0}
.detail dt{color:var(--sub)}
.detail dd{margin:0;word-break:keep-all;overflow-wrap:anywhere}
.detail .x{position:absolute;right:10px;top:10px;width:28px;height:28px;border:0;border-radius:6px;background:none;font-size:18px;line-height:1;color:var(--sub)}
.detail .x:hover{background:var(--bg)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.actions button{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);text-decoration:none;font-size:13px}
.note{margin-top:10px;padding:8px 10px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-size:12.5px}

.leaflet-container{font-family:var(--font)}
.leaflet-tooltip.label{padding:3px 9px;border:0;border-radius:5px;background:var(--ink);color:#fff;font-size:12.5px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.leaflet-tooltip.label::before{border-top-color:var(--ink)}

.setup{position:absolute;inset:0;z-index:1200;display:grid;place-items:center;padding:16px;background:rgba(243,245,244,.94);overflow:auto}
.setup form{width:min(520px,100%);padding:24px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 30px rgba(20,40,40,.14)}
.setup h2{margin:0 0 6px;font-size:18px}
.setup p,.setup ol{color:var(--sub);margin:0 0 12px}
.setup ol{padding-left:20px}
.setup li{margin-bottom:4px}
.setup code{padding:1px 5px;border-radius:4px;background:var(--bg);color:var(--ink);font-size:12.5px}
.setup label{display:block;margin-bottom:6px;font-weight:600}
.setup input{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px}
.setup button{margin-top:12px;padding:9px 16px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:600}
.setup .err{margin:0 0 12px;padding:9px 11px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-size:12.5px}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:56% 44%}
  .mapwrap{order:-1}
  .side{border-right:0;border-top:1px solid var(--line)}
  .head{padding:10px 16px 8px}.head h1{font-size:16px}.head p{display:none}
  .tools{padding:8px 16px}.count{padding:6px 16px}.item{padding:9px 16px}
  .detail{left:12px;right:12px;width:auto}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="head">
      <h1>어린이집 지도</h1>
      <p>전남광주통합특별시 5개 자치구 · 일람표 2026.10. 기준 · 총 <span id="total"></span>개소</p>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="어린이집명·주소·행정동 검색" aria-label="검색">
      <div class="row">
        <select id="gu" aria-label="자치구"><option value="">자치구 전체</option></select>
        <select id="dong" aria-label="행정동"><option value="">행정동 전체</option></select>
      </div>
      <div class="chips" id="types" role="group" aria-label="어린이집 유형"></div>
    </div>
    <div class="count"><span id="count"></span> <button type="button" class="linkbtn" id="reset" hidden>조건 초기화</button></div>
    <ul class="list" id="list"></ul>
  </aside>
  <main class="mapwrap">
    <div id="map"></div>
    <div class="status" id="status" hidden></div>
    <section class="detail" id="detail" hidden aria-live="polite"></section>
    <div class="setup" id="setup" hidden>
      <form id="keyform">
        <h2>브이월드 인증키 입력</h2>
        <p class="err" id="keyerr" hidden></p>
        <p>지도 표시와 주소→좌표 변환에 브이월드(국토교통부 공간정보 오픈플랫폼)를 사용합니다. 처음 한 번만 입력하면 이 브라우저에 저장됩니다.</p>
        <ol>
          <li>브이월드(www.vworld.kr)에 로그인한 뒤 오픈API 인증키를 발급받습니다.</li>
          <li>발급 신청서의 서비스 URL에는 이 페이지를 올려 둘 주소를 적습니다. 현재 주소: <code id="origin"></code></li>
          <li>발급된 인증키를 아래에 붙여 넣습니다.</li>
        </ol>
        <label for="key">인증키</label>
        <input id="key" autocomplete="off" spellcheck="false" required>
        <button type="submit">지도 불러오기</button>
      </form>
    </div>
  </main>
</div>

Object.keys(TYPE_COLOR).forEach(t=>{
  const n = items.filter(d=>d.type===t).length; if(!n) return;
  const b=document.createElement("button"); b.type="button"; b.className="chip"; b.setAttribute("aria-pressed","true");
  b.innerHTML='<i class="dot"></i>'; b.firstChild.style.setProperty("--c",colorOf(t));
  b.append(t+" "+n);
  b.onclick=()=>{ const on=!state.types.has(t); on?state.types.add(t):state.types.delete(t); b.setAttribute("aria-pressed",on); render(); };
  $("types").append(b);
});
$("q").oninput = e=>{ state.q=e.target.value.trim().toLowerCase(); render(); };
$("gu").onchange = e=>{ state.gu=e.target.value; fillDong(); render(true); };
$("dong").onchange = e=>{ state.dong=e.target.value; render(true); };
$("reset").onclick = ()=>{
  state.q=""; state.gu=""; state.dong=""; state.types=new Set(Object.keys(TYPE_COLOR));
  $("q").value=""; $("gu").value=""; fillDong();
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","true")); render(true);
};

function filtered(){
  return items.filter(d=> state.types.has(d.type) && (!state.gu||d.gu===state.gu) && (!state.dong||d.dong===state.dong)
    && (!state.q || (d.name+" "+d.addr+" "+d.dong).toLowerCase().includes(state.q)));
}

function render(fit){
  const rows = filtered();
  const located = rows.filter(d=>d.pos).length;
  $("count").textContent = "표시 "+rows.length.toLocaleString()+"개소" + (geocodeDone && located<rows.length ? " · 위치 미확인 "+(rows.length-located) : "");
  $("reset").hidden = rows.length===items.length;
  const ul=$("list"); ul.textContent="";
  if(!rows.length){ const p=document.createElement("li"); p.className="empty"; p.textContent="조건에 맞는 어린이집이 없습니다."; ul.append(p); }
  const frag=document.createDocumentFragment();
  rows.forEach(d=>{
    const li=document.createElement("li"), b=document.createElement("button");
    b.type="button"; b.className="item"; b.dataset.i=d.i;
    if(state.sel===d.i) b.setAttribute("aria-current","true");
    const dot=document.createElement("i"); dot.className="dot"; dot.style.setProperty("--c",colorOf(d.type));
    const nm=document.createElement("b"); nm.textContent=d.name;
    const sub=document.createElement("span"); sub.textContent=d.type+" · "+d.gu+" "+d.dong;
    b.append(dot,nm,sub);
    if(geocodeDone && !d.pos){ const w=document.createElement("span"); w.className="nopos"; w.textContent="지도 위치 미확인"; b.append(w); }
    li.append(b); frag.append(li);
  });
  ul.append(frag);
  if(map){
    layer.clearLayers();
    rows.forEach(d=>{ if(d.marker) layer.addLayer(d.marker); });
    if(halo) halo.bringToFront();
    if(fit){
      const pts=rows.filter(d=>d.pos).map(d=>d.pos);
      if(pts.length) map.fitBounds(pts,{padding:[30,30],maxZoom:17});
    }
  }
}
$("list").addEventListener("click",e=>{ const b=e.target.closest(".item"); if(b) select(+b.dataset.i,true); });

/* ---------- 세부정보 ---------- */
function select(i, move){
  state.sel=i; const d=items[i];
  document.querySelectorAll(".item[aria-current]").forEach(n=>n.removeAttribute("aria-current"));
  const row=document.querySelector('.item[data-i="'+i+'"]');
  if(row){ row.setAttribute("aria-current","true"); if(!move) row.scrollIntoView({block:"nearest"}); }

  const box=$("detail"); box.textContent=""; box.hidden=false;
  const x=document.createElement("button"); x.type="button"; x.className="x"; x.setAttribute("aria-label","닫기"); x.textContent="×";
  x.onclick=()=>{ box.hidden=true; state.sel=null; clearMark(); document.querySelectorAll(".item[aria-current]").forEach(n=>n.removeAttribute("aria-current")); };
  const badge=document.createElement("span"); badge.className="badge"; badge.style.setProperty("--c",colorOf(d.type)); badge.textContent=d.type;
  const h=document.createElement("h2"); h.textContent=d.name;
  const dl=document.createElement("dl");
  [["소재지",d.gu+" "+d.dong],["주소",d.addr],["전화",d.tel||"일람표에 없음"]].forEach(([k,v])=>{
    const dt=document.createElement("dt"), dd=document.createElement("dd"); dt.textContent=k; dd.textContent=v; dl.append(dt,dd);
  });
  const act=document.createElement("div"); act.className="actions";
  const cp=document.createElement("button"); cp.type="button"; cp.textContent="주소 복사";
  cp.onclick=()=>{ (navigator.clipboard?navigator.clipboard.writeText(d.addr):Promise.reject()).then(()=>{cp.textContent="복사됨";},()=>{cp.textContent="복사 실패";}); };
  act.append(cp);
  if(d.tel){ const tp=document.createElement("button"); tp.type="button"; tp.textContent="전화번호 복사";
    tp.onclick=()=>{ (navigator.clipboard?navigator.clipboard.writeText(d.tel):Promise.reject()).then(()=>{tp.textContent="복사됨";},()=>{tp.textContent="복사 실패";}); };
    act.append(tp); }
  box.append(x,badge,h,dl,act);
  if(!d.pos && geocodeDone){ const n=document.createElement("p"); n.className="note"; n.textContent="이 주소는 좌표로 변환되지 않아 지도에 표시하지 못했습니다."; box.append(n); }
  else if(d.approx){ const n=document.createElement("p"); n.className="note"; n.textContent="도로명주소로 좌표를 찾지 못해 어린이집명 검색 결과의 위치로 표시했습니다. 실제 위치와 다를 수 있습니다."; box.append(n); }

  clearMark();
  if(map && d.pos){
    if(move) map.setView(d.pos, Math.max(map.getZoom(),17));
    halo=L.circleMarker(d.pos,{radius:13,color:colorOf(d.type),weight:3,fillColor:"#fff",fillOpacity:.35,interactive:false}).addTo(map);
    label=L.tooltip({permanent:true,direction:"top",offset:[0,-12],className:"label"}).setLatLng(d.pos).setContent(esc(d.name)).addTo(map);
  }
}
function clearMark(){ if(halo){ halo.remove(); halo=null; } if(label){ label.remove(); label=null; } }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- 브이월드 지도 ---------- */
function showSetup(msg){
  $("origin").textContent = location.protocol==="file:" ? "내 컴퓨터의 파일(웹 주소 없음)" : location.origin;
  $("keyerr").hidden=!msg; $("keyerr").textContent=msg||"";
  $("key").value = store.get(KEY_K)||DEFAULT_KEY;
  $("setup").hidden=false;
}
$("keyform").onsubmit = e=>{ e.preventDefault(); const k=$("key").value.trim(); if(!k) return; store.set(KEY_K,k); $("setup").hidden=true; start(k); };

/* 브이월드 API는 JSONP(callback)로 호출한다 */
let jsonpSeq=0;
function jsonp(path, params){
  return new Promise(resolve=>{
    const cb="__vw"+(++jsonpSeq), s=document.createElement("script");
    const done=v=>{ clearTimeout(timer); delete window[cb]; s.remove(); resolve(v); };
    const timer=setTimeout(()=>{ window[cb]=()=>{}; s.remove(); resolve(null); },10000);
    window[cb]=done; s.onerror=()=>done(null);
    s.src="https://api.vworld.kr/req/"+path+"?"+new URLSearchParams({...params, format:"json", errorformat:"json", key:vkey, callback:cb});
    document.head.append(s);
  });
}
/* 반환: [위도,경도] | null(결과 없음) | {error:"사유"}(키 오류·통신 실패) */
async function vwAddress(address){
  const j=await jsonp("address",{service:"address",request:"getcoord",version:"2.0",crs:"epsg:4326",type:"road",refine:"true",simple:"false",address});
  const r=j&&j.response; if(!r) return {error:"브이월드 서버에서 응답을 받지 못했습니다."};
  if(r.status==="OK" && r.result && r.result.point) return [+r.result.point.y, +r.result.point.x];
  if(r.status==="NOT_FOUND") return null;
  return {error:(r.error&&(r.error.text||r.error.code))||"요청이 거부되었습니다."};
}
async function vwPlace(d){
  const j=await jsonp("search",{service:"search",request:"search",version:"2.0",crs:"EPSG:4326",type:"place",size:"10",page:"1",query:d.name});
  const list=j&&j.response&&j.response.status==="OK"&&j.response.result&&j.response.result.items||[];
  const hit=list.find(p=>{ const a=p.address||{}; return ((a.road||"")+" "+(a.parcel||"")).includes(d.gu) && (p.title||"").replace(/\s/g,"").includes(d.name.replace(/\s/g,"")); });
  return hit&&hit.point ? [+hit.point.y, +hit.point.x] : null;
}

function start(key){
  vkey=key;
  if(!window.L){ showSetup("지도 라이브러리(Leaflet)를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로 고쳐 주세요."); return; }
  if(!map){
    map=L.map("map",{preferCanvas:true,minZoom:7,maxZoom:19}).setView([35.1557,126.8354],12);
    const opt={maxNativeZoom:18,maxZoom:19,attribution:"지도 © 브이월드(국토교통부)"};
    const base=L.tileLayer("https://api.vworld.kr/req/wmts/1.0.0/"+encodeURIComponent(key)+"/Base/{z}/{y}/{x}.png",opt).addTo(map);
    const sat=L.tileLayer("https://api.vworld.kr/req/wmts/1.0.0/"+encodeURIComponent(key)+"/Satellite/{z}/{y}/{x}.jpeg",opt);
    L.control.layers({"일반지도":base,"항공사진":sat},null,{collapsed:false}).addTo(map);
    let tileErr=0; base.on("tileerror",()=>{ if(++tileErr===8 && !geocodeDone) setStatus("지도 그림을 불러오지 못하고 있습니다. 인증키와 서비스 URL 등록 내용을 확인해 주세요."); });
    layer=L.layerGroup().addTo(map);
    items.forEach(d=>{ const c=posCache[d.addr]; if(c){ d.pos=[c[0],c[1]]; d.approx=!!c[2]; addMarker(d); } });
  }
  render(true);
  geocodeAll();
}
function addMarker(d){
  d.marker=L.circleMarker(d.pos,{radius:7,color:"#fff",weight:1.5,fillColor:colorOf(d.type),fillOpacity:.95});
  d.marker.on("click",()=>select(d.i,false));
  d.marker.bindTooltip(esc(d.name),{direction:"top",offset:[0,-6]});
}

/* 주소 → 좌표: 도로명+건물번호로 조회, 실패하면 시 명칭을 바꿔 재조회, 그래도 없으면 어린이집명 장소검색 */
const CITY="전남광주통합특별시";
let cityForms=[CITY,"광주광역시"];
async function locate(d){
  for(const form of cityForms.slice()){
    const p=await vwAddress(d.query.replace(CITY,form));
    if(Array.isArray(p)){ if(cityForms[0]!==form) cityForms=[form,...cityForms.filter(f=>f!==form)]; return {pos:p}; }
    if(p && p.error) return p;
  }
  const p=await vwPlace(d);
  return p ? {pos:p,approx:true} : {pos:null};
}
async function geocodeAll(){
  const todo=items.filter(d=>!d.pos && posCache[d.addr]!==0);
  const total=todo.length; let done=0, idx=0, stopped=false;
  if(!total){ finish(); return; }
  progress(0,total);
  const apply=(d,r)=>{
    if(r.pos){ d.pos=r.pos; d.approx=!!r.approx; posCache[d.addr]=r.approx?[r.pos[0],r.pos[1],1]:r.pos; addMarker(d); }
    else posCache[d.addr]=0;
    done++;
  };
  /* 첫 건으로 인증키가 통하는지 먼저 확인한다 */
  const first=await locate(todo[idx++]);
  if(first.error){ setStatus(""); showSetup("주소를 좌표로 바꾸지 못했습니다. 인증키와 서비스 URL 등록 내용을 확인해 주세요. (사유: "+first.error+")"); return; }
  apply(todo[0],first);
  let errors=0;
  async function worker(){
    while(idx<todo.length && !stopped){
      const d=todo[idx++];
      let r=await locate(d);
      if(r.error){ await new Promise(x=>setTimeout(x,1500)); r=await locate(d); }
      if(r.error){ errors++; done++; if(errors>=15) stopped=true; }
      else apply(d,r);
      if(done%20===0||done===total){ progress(done,total); store.set(POS_K,JSON.stringify(posCache)); render(false); }
      await new Promise(x=>setTimeout(x,60));
    }
  }
  await Promise.all([worker(),worker(),worker()]);
  finish(stopped||errors ? "일부 주소는 브이월드 응답 오류로 변환하지 못했습니다." : "");
}
function progress(done,total){
  const el=$("status"); el.hidden=false; el.className="status";
  el.innerHTML='주소를 지도 좌표로 변환하는 중 <b></b><div class="bar"><i></i></div>';
  el.querySelector("b").textContent=done+" / "+total;
  el.querySelector("i").style.width=(total?done/total*100:0)+"%";
}
function finish(extra){
  geocodeDone=true; store.set(POS_K,JSON.stringify(posCache));
  const miss=items.filter(d=>!d.pos).length, approx=items.filter(d=>d.approx).length;
  render(true);
  const el=$("status");
  if(!miss && !approx && !extra){ el.hidden=true; return; }
  el.hidden=false; el.className="status warn"; el.textContent="";
  const parts=[]; if(miss) parts.push("위치 미확인 "+miss+"개소"); if(approx) parts.push("명칭 검색으로 추정한 위치 "+approx+"개소");
  if(extra) parts.push(extra);
  el.append(parts.join(" · "));
  if(miss){ const b=document.createElement("button"); b.type="button"; b.textContent="다시 시도";
    b.onclick=()=>{ Object.keys(posCache).forEach(k=>{ if(posCache[k]===0) delete posCache[k]; }); geocodeDone=false; geocodeAll(); }; el.append(b); }
  const c=document.createElement("button"); c.type="button"; c.textContent="닫기"; c.onclick=()=>{ el.hidden=true; }; el.append(c);
}
function setStatus(t){ const el=$("status"); el.className="status"; el.textContent=t; el.hidden=!t; }

/* ---------- 시작 ---------- */
render();
const DEFAULT_KEY = "2F506906-1B8B-493D-851A-6355C87B1644"; // 브이월드 인증키
const savedKey = store.get(KEY_K) || DEFAULT_KEY;
if(savedKey) start(savedKey); else showSetup("");
</script>
</body>
